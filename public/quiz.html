<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF9F5" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>우리사이 - 서로 맞히기</title>
  <meta property="og:title" content="우리사이 - 서로 맞히기" />
  <meta property="og:description" content="연인은 나를 몇 개나 맞힐까요?" />
  <meta property="og:image" content="https://jkangmin95-maker.github.io/saibot/og.png" />
  <meta property="og:url" content="https://jkangmin95-maker.github.io/saibot/quiz.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- quiz.css: Tailwind 3.4.17 classes used by this page, compiled ahead of time (no CDN script on this page). -->
  <link rel="stylesheet" href="./quiz.css" />
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      background-color: #FFF9F5;
      color: #2D3436;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Inter", sans-serif;
      overscroll-behavior-y: none;
      margin: 0;
    }
    .safe-top { padding-top: max(14px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop { animation: popIn 0.25s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-[#F4ECE6]">
  <div class="relative w-full max-w-[440px] min-h-[100dvh] shadow-[0_0_40px_rgba(45,52,54,0.08)]">
    <div id="app" class="w-full min-h-[100dvh] bg-[#FFF9F5] flex flex-col"></div>
    <div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[60] hidden w-[90%] max-w-[400px] bg-[#2D3436] text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-xl text-center" style="bottom: max(2rem, calc(env(safe-area-inset-bottom) + 1.5rem))"></div>
  </div>

  <script>
    (function () {
      // 서로 맞히기 테스트 (로그인 없음). 서버: supabase_migration_v10_share_quiz.sql 의 anon RPC 만 호출.
      // 사용자가 입력한 글(닉네임)은 전부 textContent 로만 화면에 넣는다 (innerHTML 금지).
      const SUPABASE_URL = 'https://iyligsrpaxitlpuwbdjx.supabase.co';
      const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5bGlnc3JwYXhpdGxwdXdiZGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NzgxNzEsImV4cCI6MjExMTE1NDE3MX0.9VRYSaXhXSjCjvcVO60C6-1TVM47yG9rprFegw3ZW5A';
      const AVATAR_SRC = './icon-192.png';
      const TOTAL = 10;

      // 가볍고 민감하지 않은 질문 10개, 보기 4개씩. 답은 보기 번호(0~3)로 서버에 저장된다.
      const QUESTIONS = [
        { q: '주말에 더 끌리는 건?', o: ['집에서 뒹굴기', '맛집 탐방', '야외 나들이', '친구들과 약속'] },
        { q: '제일 좋아하는 계절은?', o: ['봄', '여름', '가을', '겨울'] },
        { q: '아침 메뉴로 고른다면?', o: ['빵과 커피', '따끈한 밥', '과일과 요거트', '아침은 건너뛰기'] },
        { q: '여행 갈 때 스타일은?', o: ['계획표 완벽파', '큰 틀만 정하기', '발길 닿는 대로', '따라가는 편'] },
        { q: '스트레스 풀 때는?', o: ['맛있는 거 먹기', '푹 자기', '운동하기', '수다 떨기'] },
        { q: '더 좋아하는 간식은?', o: ['달콤한 디저트', '짭짤한 과자', '매콤한 떡볶이', '시원한 아이스크림'] },
        { q: '영화 고를 때 손이 가는 건?', o: ['로맨스', '코미디', '액션·스릴러', '애니메이션'] },
        { q: '더 좋아하는 연락 방식은?', o: ['짧은 톡 자주', '긴 통화 한 번', '귀여운 이모티콘', '사진 보내기'] },
        { q: '선물로 받고 싶은 건?', o: ['손편지', '맛있는 밥', '필요한 물건', '깜짝 이벤트'] },
        { q: '아침형? 올빼미형?', o: ['완전 아침형', '조금 아침형', '조금 올빼미', '완전 올빼미'] }
      ];

      const S = {
        screen: 'loading', // loading | start | question | send | landing | score | expired
        mode: 'author', // author | guess
        aName: '', bName: '',
        answers: [], idx: 0,
        quizToken: '', challengeToken: '',
        shareToken: '', // the quiz token this author created (to share)
        result: null, // { score, a_name, b_name, challenge }
        myChallenge: null, // challenge I sent: { token, status, ... }
        isMaker: false, // this device created the quiz in the #q= link
        busy: false
      };

      // ---------- helpers ----------
      function h(tag, cls, text) {
        const el = document.createElement(tag);
        if (cls) el.className = cls;
        if (text != null) el.textContent = String(text);
        return el;
      }
      function btn(label, cls, onClick) {
        const b = h('button', cls, label);
        b.type = 'button';
        b.addEventListener('click', onClick);
        return b;
      }
      const PRIMARY = 'w-full py-3.5 rounded-2xl bg-[#FF8A80] hover:bg-[#F26D63] active:scale-[0.99] text-white text-sm font-extrabold shadow-[0_6px_20px_rgba(255,138,128,0.4)] transition-all';
      const OUTLINE = 'w-full py-3.5 rounded-2xl bg-white border border-[#FF8A80]/40 text-[#E0665B] text-sm font-extrabold';
      const GHOST = 'w-full py-3 rounded-2xl bg-white border border-[#2D3436]/10 text-[#636E72] text-xs font-bold';
      const CARD = 'bg-white rounded-3xl p-5 border border-[#FF8A80]/15 shadow-[0_8px_28px_rgba(45,52,54,0.06)]';

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.add('hidden'), 2600);
      }

      async function rpc(name, args) {
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
          method: 'POST',
          headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify(args || {})
        });
        const raw = await res.text();
        let data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch (_e) {}
        if (!res.ok) {
          const err = new Error((data && (data.message || data.hint)) || 'request-failed');
          err.status = res.status;
          throw err;
        }
        return data;
      }

      function isGone(err) {
        const m = String((err && err.message) || '');
        return m.indexOf('link_expired') >= 0 || m.indexOf('rate_limited') >= 0;
      }

      function logEvent(name) {
        rpc('log_event', { p_event: name }).catch(() => {});
      }

      function baseUrl() {
        return location.origin + location.pathname;
      }

      function copyText(t) {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
        return new Promise((resolve, reject) => {
          const ta = document.createElement('textarea');
          ta.value = t;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try { ok = document.execCommand('copy'); } catch (_e) {}
          document.body.removeChild(ta);
          if (ok) resolve(); else reject(new Error('copy-failed'));
        });
      }

      // 공유창을 탭 직후 바로 띄움(await 없이 호출해야 탭 제스처가 유지됨).
      // 공유창이 없거나 실패하면 링크 복사, 사용자가 닫은 경우(AbortError)는 아무것도 안 함.
      // 결과: 'shared' | 'copied' | 'aborted' | 'failed'
      function shareOrCopy(data, fallbackText) {
        let p;
        try {
          p = navigator.share ? navigator.share(data) : Promise.reject(new Error('share-unavailable'));
        } catch (err) {
          p = Promise.reject(err);
        }
        return Promise.resolve(p).then(() => 'shared', (err) => {
          if (err && err.name === 'AbortError') return 'aborted';
          return copyText(fallbackText).then(() => { showToast('링크 복사 완료!'); return 'copied'; },
            () => { showToast('잠시 후 다시 시도해 주세요'); return 'failed'; });
        });
      }

      // true = 공유창으로 보냈거나 복사됨
      function shareText(text, url) {
        return shareOrCopy({ title: '우리사이', text: text, url: url }, text + '\n' + url)
          .then((r) => r === 'shared' || r === 'copied');
      }

      function cleanNick(v) {
        return String(v || '').replace(/<[^>]*>/g, '').replace(/[<>&"'`\r\n\t]/g, '').trim().slice(0, 12);
      }

      // 한글 음절 종성(받침)이 있으면 '이', 없으면(그리고 비한글이면) '가'
      function subjectParticle(name) {
        const ch = String(name || '').slice(-1);
        if (!ch) return '가';
        const code = ch.charCodeAt(0);
        if (code < 0xAC00 || code > 0xD7A3) return '가';
        return ((code - 0xAC00) % 28) ? '이' : '가';
      }

      // 이 기기에서 만든 퀴즈 토큰 (서버 변경 없이 만든 사람을 구분). 저장 실패해도 동작은 그대로.
      const MADE_KEY = 'urisai_quiz_made';
      function madeTokens() {
        try { const v = JSON.parse(localStorage.getItem(MADE_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (_e) { return []; }
      }
      function rememberMade(token) {
        try {
          const list = madeTokens().filter((t) => t !== token);
          list.push(token);
          localStorage.setItem(MADE_KEY, JSON.stringify(list.slice(-20)));
        } catch (_e) {}
      }

      // ---------- layout ----------
      function shell(children) {
        const root = document.getElementById('app');
        root.textContent = '';
        const header = h('header', 'shrink-0 bg-[#FFF9F5] border-b border-[#FF8A80]/15 px-4 pb-3 safe-top flex items-center gap-2.5');
        const img = h('img', 'w-9 h-9 rounded-2xl object-cover border border-[#FF8A80]/30 shrink-0');
        img.src = AVATAR_SRC; img.alt = '우리사이';
        header.appendChild(img);
        header.appendChild(h('span', 'text-base font-extrabold text-[#2D3436]', '우리사이'));
        root.appendChild(header);
        const main = h('main', 'flex-1 px-5 py-6 safe-bottom flex flex-col gap-4');
        children.forEach((c) => c && main.appendChild(c));
        root.appendChild(main);
        window.scrollTo(0, 0);
      }

      function progress(n) {
        const wrap = h('div', 'space-y-1.5');
        const row = h('div', 'flex items-center justify-end');
        row.appendChild(h('span', 'text-[11px] font-bold text-[#E0665B]', n + '/' + TOTAL));
        wrap.appendChild(row);
        const track = h('div', 'w-full h-2.5 bg-[#FFF0EE] rounded-full overflow-hidden');
        const fill = h('div', 'h-full bg-gradient-to-r from-[#FFAB91] to-[#FF8A80] rounded-full transition-all duration-300');
        fill.style.width = Math.round((n / TOTAL) * 100) + '%';
        track.appendChild(fill);
        wrap.appendChild(track);
        return wrap;
      }

      // ---------- screens ----------
      function renderLoading() {
        const img = h('img', 'w-20 h-20 rounded-3xl object-cover border-2 border-[#FF8A80]/40 shadow-md animate-pulse mx-auto mt-24');
        img.src = AVATAR_SRC; img.alt = '';
        shell([img]);
      }

      function renderStart() {
        const card = h('div', CARD + ' animate-pop space-y-4');
        const head = h('div', 'text-center pt-1');
        head.appendChild(h('h1', 'text-xl font-extrabold text-[#2D3436] tracking-tight', '연인은 나를 몇 개나 맞힐까요?'));
        head.appendChild(h('p', 'text-xs text-[#636E72] mt-2', '로그인 없이 바로 시작해요.'));
        card.appendChild(head);
        const inputCls = 'w-full px-3.5 py-3 rounded-xl bg-[#FFF9F5] border border-[#FF8A80]/30 text-sm font-semibold text-[#2D3436] placeholder-[#9AA5A9] focus:outline-none focus:ring-2 focus:ring-[#FF8A80]/40';
        const me = h('input', inputCls); me.id = 'q-me'; me.maxLength = 12; me.placeholder = '내 닉네임'; me.value = S.aName;
        const you = h('input', inputCls); you.id = 'q-you'; you.maxLength = 12; you.placeholder = '연인 닉네임'; you.value = S.bName;
        const fields = h('div', 'space-y-2.5');
        fields.appendChild(me); fields.appendChild(you);
        card.appendChild(fields);
        card.appendChild(btn('시작하기', PRIMARY, () => {
          const a = cleanNick(me.value), b = cleanNick(you.value);
          if (!a) { me.focus(); return; }
          if (!b) { you.focus(); return; }
          S.aName = a; S.bName = b; S.mode = 'author'; S.answers = []; S.idx = 0;
          logEvent('quiz_start');
          go('question');
        }));
        shell([h('div', 'h-6'), card]);
      }

      function renderQuestion() {
        const item = QUESTIONS[S.idx];
        const card = h('div', CARD + ' animate-pop space-y-4');
        card.appendChild(progress(S.idx + 1));
        card.appendChild(h('h2', 'text-lg font-extrabold text-[#2D3436] text-center pt-2 pb-1', item.q));
        const list = h('div', 'space-y-2.5');
        item.o.forEach((label, i) => {
          list.appendChild(btn(label, 'w-full py-3.5 px-4 rounded-2xl bg-[#FFF9F5] hover:bg-[#FFF0EE] border border-[#FF8A80]/30 text-sm font-bold text-[#2D3436] transition-colors', () => {
            S.answers[S.idx] = i;
            if (S.idx < TOTAL - 1) { S.idx += 1; go('question'); return; }
            if (S.mode === 'author') go('send'); else submitGuess();
          }));
        });
        card.appendChild(list);
        shell([card]);
      }

      // 보내기 화면이 뜨면 퀴즈를 미리 만들어 두어, 버튼을 누르면 바로 공유창이 뜨게 함
      function prepareQuiz() {
        if (S.shareToken) return Promise.resolve(S.shareToken);
        if (!S.createP) {
          S.createP = rpc('create_quiz', { p_a_name: S.aName, p_b_name: S.bName, p_answers: S.answers, p_challenge_token: S.challengeToken || null })
            .then((r) => {
              S.shareToken = r.token;
              S.aName = r.a_name; S.bName = r.b_name;
              rememberMade(r.token);
              return r.token;
            }, (err) => { S.createP = null; throw err; });
        }
        return S.createP;
      }

      function renderSend() {
        if (!S.shareToken) prepareQuiz().catch(() => {});
        const card = h('div', CARD + ' animate-pop space-y-5');
        card.appendChild(progress(TOTAL));
        card.appendChild(btn('연인에게 맞히기 보내기', PRIMARY, sendToPartner));
        if (S.shareToken) {
          const link = h('input', 'w-full text-xs text-[#4A5568] text-center bg-[#FFF9F5] border border-[#FF8A80]/20 rounded-xl px-3 py-2.5 select-all');
          link.type = 'text';
          link.readOnly = true;
          link.value = baseUrl() + '#q=' + S.shareToken;
          link.setAttribute('aria-label', '공유 링크');
          link.addEventListener('focus', function () { link.select(); });
          card.appendChild(link);
        }
        shell([h('div', 'h-6'), card]);
      }

      function sendToPartner() {
        if (S.busy) return;
        S.busy = true;
        const share = () => shareText(S.aName + subjectParticle(S.aName) + ' 문제 냈어. 나에 대해 몇 개나 맞힐 수 있어? 👀', baseUrl() + '#q=' + S.shareToken);
        // 토큰이 이미 있으면 await 없이 바로 공유창
        const p = S.shareToken ? share() : prepareQuiz().then(share);
        p.then(() => go('send'), (err) => {
          if (isGone(err)) go('expired');
          else {
            if (S.shareToken) go('send');
            showToast('잠시 후 다시 시도해 주세요');
          }
        }).finally(() => { S.busy = false; });
      }

      function renderLanding() {
        const card = h('div', CARD + ' animate-pop space-y-5 text-center');
        card.appendChild(h('h1', 'text-xl font-extrabold text-[#2D3436] tracking-tight leading-snug pt-1', S.aName + '님에 대한 10문제예요. 얼마나 알고 있는지 맞혀 보세요.'));
        card.appendChild(btn('시작하기', PRIMARY, () => { S.mode = 'guess'; S.answers = []; S.idx = 0; go('question'); }));
        shell([h('div', 'h-6'), card]);
      }

      async function submitGuess() {
        if (S.busy) return;
        S.busy = true;
        renderLoading();
        try {
          const r = await rpc('submit_quiz_guess', { p_token: S.quizToken, p_guesses: S.answers });
          S.result = r;
          logEvent('quiz_finish');
          go('score');
        } catch (err) {
          if (isGone(err)) go('expired');
          else { showToast('잠시 후 다시 시도해 주세요'); go('question'); }
        } finally {
          S.busy = false;
        }
      }

      function comparisonCard(c) {
        const card = h('div', 'bg-white rounded-2xl p-4 border border-[#FF8A80]/20 shadow-sm text-center animate-pop');
        card.appendChild(h('p', 'text-xs font-bold text-[#FF8A80]', '누가 서로를 더 잘 알까요?'));
        card.appendChild(h('p', 'text-base font-extrabold text-[#2D3436] mt-2',
          c.a_name + '♥' + c.b_name + ' ' + c.score + '점 · ' + c.c_name + '♥' + c.d_name + ' ' + c.score2 + '점'));
        return card;
      }

      function renderScore() {
        const r = S.result;
        const wrong = TOTAL - Number(r.score);
        const card = h('div', 'bg-white rounded-3xl p-5 border border-[#FF8A80]/20 shadow-sm text-center animate-pop');
        card.appendChild(h('p', 'text-sm font-bold text-[#636E72]', r.b_name + '님은 ' + r.a_name + '님을'));
        const big = h('p', 'text-5xl font-extrabold text-[#2D3436] mt-2');
        big.appendChild(h('span', 'text-[#FF8A80]', String(r.score)));
        big.appendChild(document.createTextNode('/' + TOTAL));
        card.appendChild(big);
        card.appendChild(h('p', 'text-sm font-bold text-[#636E72] mt-2', '알아요'));
        if (wrong > 0) card.appendChild(h('p', 'text-xs text-[#4A5568] mt-4 pt-3 border-t border-[#2D3436]/5', '틀린 ' + wrong + '문제는 오늘 저녁에 직접 물어봐요 😊'));

        const blocks = [card];
        const theirs = r.challenge && r.challenge.status === 'done' ? r.challenge : null;
        const mine = S.myChallenge;
        if (theirs) blocks.push(comparisonCard(theirs));
        else if (mine && mine.status === 'done') blocks.push(comparisonCard(mine));
        else if (mine) {
          const w = h('div', 'bg-white rounded-2xl p-4 border border-[#FFB74D]/50 shadow-sm text-center');
          w.appendChild(h('p', 'text-xs font-extrabold text-[#2D3436]', '도전장 답장 기다리는 중'));
          blocks.push(w);
        }

        const actions = h('div', 'space-y-2.5 pt-1');
        if (S.isMaker) {
          actions.appendChild(challengeBtn(PRIMARY));
        } else {
          actions.appendChild(btn(r.a_name + '님에게 점수 보내기', PRIMARY, sendScore));
          actions.appendChild(btn('스토리에 올리기', OUTLINE, shareStory));
          actions.appendChild(challengeBtn(OUTLINE));
          prepareStory();
        }
        actions.appendChild(btn('우리사이에서 매일 이어하기', GHOST, () => {
          logEvent('quiz_kakao_start');
          setTimeout(() => { location.href = './'; }, 150);
        }));
        blocks.push(actions);
        shell(blocks);
      }

      function sendScore() {
        const r = S.result;
        shareText(r.b_name + subjectParticle(r.b_name) + ' ' + TOTAL + '문제 중 ' + r.score + '개 맞혔어 👀', baseUrl() + '#q=' + S.quizToken);
      }

      // 도전장 링크는 서버에서 만들어야 해서, 버튼을 누르기 시작할 때(pointerdown) 미리 요청해 둠
      function challengeBtn(cls) {
        const b = btn('친구 커플에게 도전장 보내기', cls, sendChallenge);
        b.addEventListener('pointerdown', () => { prepareChallenge().catch(() => {}); });
        return b;
      }

      function prepareChallenge() {
        if (S.challengeLink) return Promise.resolve(S.challengeLink);
        if (!S.challengeP) {
          S.challengeP = rpc('create_challenge', { p_quiz_token: S.quizToken })
            .then((r) => { S.challengeLink = { token: r.token, score: r.score }; return S.challengeLink; },
              (err) => { S.challengeP = null; throw err; });
        }
        return S.challengeP;
      }

      function sendChallenge() {
        if (S.busy) return;
        S.busy = true;
        const share = (c) => shareText('우리는 ' + c.score + '점 나왔어. 너네는 몇 점이야?', baseUrl() + '#c=' + c.token).then((ok) => {
          if (ok) logEvent('challenge_sent');
          if (!S.myChallenge || S.myChallenge.token !== c.token) {
            S.myChallenge = { token: c.token, status: 'waiting' };
            pollChallenge(0);
          }
          go('score');
        });
        // 링크가 이미 있으면 await 없이 바로 공유창
        const p = S.challengeLink ? share(S.challengeLink) : prepareChallenge().then(share);
        p.catch((err) => {
          if (isGone(err)) go('expired'); else showToast('잠시 후 다시 시도해 주세요');
        }).finally(() => { S.busy = false; });
      }

      let pollTimer = null;
      function pollChallenge(tries) {
        clearTimeout(pollTimer);
        if (!S.myChallenge || S.myChallenge.status === 'done' || tries > 30) return;
        pollTimer = setTimeout(async () => {
          if (document.visibilityState === 'hidden') { pollChallenge(tries); return; }
          try {
            const r = await rpc('get_challenge_result', { p_token: S.myChallenge.token });
            if (r && r.status === 'done') {
              S.myChallenge = Object.assign({ token: S.myChallenge.token }, r);
              if (S.screen === 'score') renderScore();
              return;
            }
          } catch (err) {
            if (isGone(err)) return;
          }
          pollChallenge(tries + 1);
        }, tries === 0 ? 1500 : 10000);
      }

      function renderExpired() {
        const card = h('div', CARD + ' animate-pop space-y-5 text-center');
        card.appendChild(h('h1', 'text-lg font-extrabold text-[#2D3436] pt-1', '이 링크는 끝났어요. 새로 시작해 볼까요?'));
        card.appendChild(btn('새 테스트 시작하기', PRIMARY, () => {
          history.replaceState(null, '', location.pathname);
          Object.assign(S, { quizToken: '', challengeToken: '', shareToken: '', createP: null, challengeLink: null, challengeP: null, result: null, myChallenge: null, answers: [], idx: 0 });
          go('start');
        }));
        shell([h('div', 'h-6'), card]);
      }

      // ---------- story image (1080x1920) ----------
      function roundRect(ctx, x, y, w, hgt, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + hgt, r);
        ctx.arcTo(x + w, y + hgt, x, y + hgt, r);
        ctx.arcTo(x, y + hgt, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function loadImg(src) {
        return new Promise((resolve) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => resolve(null); i.src = src; });
      }
      const FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';

      async function drawScoreCard(r) {
        const cv = document.createElement('canvas');
        cv.width = 1080; cv.height = 1920;
        const ctx = cv.getContext('2d');
        const bg = ctx.createLinearGradient(0, 0, 0, 1920);
        bg.addColorStop(0, '#FFF9F5'); bg.addColorStop(1, '#FFF0EE');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, 1080, 1920);
        ctx.save();
        ctx.shadowColor = 'rgba(45,52,54,0.08)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 16;
        roundRect(ctx, 80, 360, 920, 1020, 72); ctx.fillStyle = '#FFFFFF'; ctx.fill();
        ctx.restore();
        roundRect(ctx, 80, 360, 920, 1020, 72); ctx.strokeStyle = 'rgba(255,138,128,0.25)'; ctx.lineWidth = 3; ctx.stroke();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#636E72'; ctx.font = '700 56px ' + FONT; ctx.fillText(r.b_name + '님은 ' + r.a_name + '님을', 540, 600);
        ctx.font = '800 300px ' + FONT;
        const sc = String(r.score), rest = '/' + TOTAL;
        const w1 = ctx.measureText(sc).width, w2 = ctx.measureText(rest).width;
        const x0 = 540 - (w1 + w2) / 2;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#FF8A80'; ctx.fillText(sc, x0, 920);
        ctx.fillStyle = '#2D3436'; ctx.fillText(rest, x0 + w1, 920);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#636E72'; ctx.font = '700 56px ' + FONT; ctx.fillText('알아요', 540, 1030);
        const wrong = TOTAL - Number(r.score);
        if (wrong > 0) { ctx.fillStyle = '#4A5568'; ctx.font = '500 40px ' + FONT; ctx.fillText('틀린 ' + wrong + '문제는 오늘 저녁에 직접 물어봐요 😊', 540, 1220); }
        const icon = await loadImg(AVATAR_SRC);
        if (icon) { ctx.save(); roundRect(ctx, 474, 1580, 132, 132, 36); ctx.clip(); ctx.drawImage(icon, 474, 1580, 132, 132); ctx.restore(); }
        ctx.fillStyle = '#2D3436'; ctx.font = '800 56px ' + FONT; ctx.fillText('우리사이', 540, 1800);
        return new Promise((resolve) => cv.toBlob(resolve, 'image/png'));
      }

      // 점수 화면이 뜨면 스토리 이미지를 미리 그려 두어, 버튼을 누르면 바로 공유창이 뜨게 함
      const story = { key: '', file: null, p: null };
      function storyKey(r) { return [r.a_name, r.b_name, r.score].join('|'); }
      function prepareStory() {
        const r = S.result;
        const key = storyKey(r);
        if (story.key === key && story.p) return story.p;
        story.key = key; story.file = null;
        story.p = drawScoreCard(r).then((blob) => {
          if (story.key === key && blob) story.file = new File([blob], 'urisai-quiz.png', { type: 'image/png' });
          return story.file;
        }, () => { if (story.key === key) story.p = null; return null; });
        return story.p;
      }

      function shareStory() {
        const r = S.result;
        const text = r.b_name + '님은 ' + r.a_name + '님을 ' + r.score + '/' + TOTAL + ' 알아요';
        const url = baseUrl();
        const file = story.key === storyKey(r) ? story.file : null;
        if (!file) prepareStory();
        const data = file && navigator.canShare && navigator.canShare({ files: [file] })
          ? { files: [file], title: '우리사이' }
          : { title: '우리사이', text: text, url: url };
        shareOrCopy(data, text + '\n' + url);
      }
      window.__drawScoreCard = drawScoreCard; // self-test hook (harmless)

      // ---------- routing ----------
      function go(screen) {
        S.screen = screen;
        if (screen === 'start') renderStart();
        else if (screen === 'question') renderQuestion();
        else if (screen === 'send') renderSend();
        else if (screen === 'landing') renderLanding();
        else if (screen === 'score') renderScore();
        else if (screen === 'expired') renderExpired();
        else renderLoading();
      }

      async function boot() {
        renderLoading();
        const params = new URLSearchParams(location.hash.slice(1));
        const q = params.get('q');
        const c = params.get('c');
        try {
          if (q) {
            S.quizToken = q;
            const r = await rpc('get_quiz_for_guess', { p_token: q });
            S.aName = r.a_name; S.bName = r.b_name;
            S.isMaker = madeTokens().indexOf(q) >= 0;
            if (r.status === 'done') {
              S.result = { a_name: r.a_name, b_name: r.b_name, score: r.score, challenge: r.challenge };
              if (r.my_challenge_token) {
                S.myChallenge = { token: r.my_challenge_token, status: 'waiting' };
                pollChallenge(0);
              }
              go('score');
            } else if (S.isMaker) {
              S.shareToken = q; // 만든 사람이 자기 링크를 열면 대신 풀지 않게 보내기 화면으로
              go('send');
            } else {
              go('landing');
            }
          } else if (c) {
            await rpc('get_challenge_result', { p_token: c });
            S.challengeToken = c;
            go('start');
          } else {
            go('start');
          }
        } catch (err) {
          if (isGone(err)) go('expired');
          else { go('start'); showToast('잠시 후 다시 시도해 주세요'); }
        }
      }

      window.addEventListener('hashchange', () => location.reload());
      boot();
    })();
  </script>
</body>
