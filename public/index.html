      function normInvite(v) {
        let t = String(v || '').toUpperCase().replace(/[^A-Z0-9-]/g, '');
        if (!t) return '';
        if (t.indexOf('S2-') !== 0) t = 'S2-' + t.replace(/^S2/, '').replace(/^-/, '');
        return /^S2-[A-Z0-9]{6}$/.test(t) ? t : '';

        try {
          const a = normInvite(sessionStorage.getItem(INVITE_KEY));
          if (a) return a;

          if (b && Date.now() - Number(b.t) < 86400000) return normInvite(b.c);

        return '';

      function clearInvite() {
        try { sessionStorage.removeItem(INVITE_KEY); localStorage.removeItem(INVITE_KEY); } catch (_e) {}

          const qs = q.toString(), hs = h.toString();

          sessionStorage.setItem(INVITE_KEY, c);
          localStorage.setItem(INVITE_KEY, JSON.stringify({ c: c, t: Date.now() }));

      function detectCategory(text) {
        const s = text.toLowerCase();
        if (/폰|스마트폰|핸드폰|휴대폰|유튜브|인스타|릴스|게임|화면|만 보|만봐/.test(s)) return 'phone';
        if (/연락|답장|읽씹|카톡|톡|전화|바빠|바쁘|바쁨|무소식|기다리/.test(s)) return 'contact';
        if (/표현|사랑|좋아|예쁘|애정|스킨십|안아|고마|관심|무심|외로/.test(s)) return 'affection';
        if (/데이트|코스|계획|약속|주말|식당|카페|매번 나만|맨날 나만/.test(s)) return 'date';
        if (/말투|짜증|화내|차가|무뚝뚝|단답|퉁명|상처|예민/.test(s)) return 'tone';
        return 'default';
      }

      function nowStr() {
        const d = new Date();
        const h = d.getHours();
        const m = String(d.getMinutes()).padStart(2, '0');
        return (h >= 12 ? '오후 ' : '오전 ') + (h % 12 || 12) + ':' + m;
      }

      function welcomeChat(id) {
        return [{ id: id, sender: 'bot', type: 'welcome', text: '안녕하세요, 사이봇이에요! 오늘 연인이랑 있었던 일, 서운했던 점, 고민 뭐든 편하게 얘기해 주세요. 여기 대화는 연인에게 절대 보이지 않아요 🤫', time: '방금 전' }];
      }

      function defaultState() {
        return {
          // 'loading' | 'signedOut' | 'needCouple' | 'ready'
          phase: 'loading',
          joinMode: false,
          busy: false,
          userId: '',
          kakaoName: '',
          onboarded: false,
          myName: '',
          partnerName: '연인',
          partnerJoined: false,
          role: 'A', // 서버가 자동으로 정해줌: 코드를 만든 사람 A, 들어온 사람 B
          coupleCode: '',
          activeTab: 'saibot', // 'missions' | 'saibot' | 'warmth'
          warmthTemp: 37.5,
          completedCount: 0,
          missions: [],
          chats: { A: welcomeChat('w-a'), B: welcomeChat('w-b') },
          draftInput: '',
          gratitudeIdx: 0,
          gratitudeParts: { b: '어제 ', f: '퇴근길에 데리러 와', a: ' 줘서 고마웠어', mark: true },
          showSettings: false,
          showLogoutConfirm: false,
          showInstallGuide: false,
          showCombo: false,
          shareConsent: null, // v10: 우리 조합 카드 공유 동의 (my_share_consent)
          paywall: null, // v11: get_paywall_config (켜져 있을 때만 값이 있음)
          report: null, // v11: my_report
          showReport: false,
          secretInfoOpen: false,
          temp: null, // v11.3: my_temp (함수가 없으면 null → 카드 숨김, 예전 온도계 그대로)
          tempView: null, // 'question' | 'wait' | 'result'
          tempIdx: 0,
          tempAnswers: [],
          selfMissions: [] // v11.3: my_self_missions — 비밀방 글쓴이 본인에게만 보이는 미션
        };
      }

      // 사이봇 비밀방 대화는 이 기기에만 저장 (카카오 계정별로 분리)
      function localKey() {
        return state.userId ? STORAGE_PREFIX + state.userId : '';
      }

      function loadLocalForUser() {
        const key = localKey();
        if (!key) return;
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (saved && saved.chats) state.chats = Object.assign({ A: welcomeChat('w-a'), B: welcomeChat('w-b') }, saved.chats);
          // 보내는 도중 앱이 닫혔던 제안은 다시 보낼 수 있게
          Object.keys(state.chats).forEach((r) => (state.chats[r] || []).forEach((m) => { if (m) delete m.sending; }));
          if (saved && saved.activeTab) state.activeTab = saved.activeTab;
          if (saved && Array.isArray(saved.missions)) state.missions = saved.missions;
        } catch (_e) {}
      }

      // Old v1-v7 anonymous storage is no longer used.
      try {
        localStorage.removeItem('urisai_mobile_state_v1');
        localStorage.removeItem('urisai_last_couple_code');
        sessionStorage.removeItem('urisai_mobile_state_v1');
      } catch (_e) {}

      let state = defaultState();
      let syncTimer = null;
      let sendingEmotion = false;

      const sb = (window.supabase && window.supabase.createClient)
        ? window.supabase.createClient(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' }
          })
        : null;

      function saveState() {
        const key = localKey();
        if (!key) return;
        try {
          localStorage.setItem(key, JSON.stringify({ chats: state.chats, activeTab: state.activeTab, missions: state.missions }));
        } catch (_e) {}
      }

      function hideToast() {
        const el = document.getElementById('toast');
        if (!el) return;
        el.classList.add('hidden');
        clearTimeout(el._t);
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.add('hidden'), 2600);
      }

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Supabase REST 헬퍼 (설정된 경우에만 호출)
      async function accessToken() {
        if (!sb) return '';
        try {
          const r = await sb.auth.getSession();
          return (r && r.data && r.data.session && r.data.session.access_token) || '';
        } catch (_e) {
          return '';
        }
      }

      async function sbFetch(path, options) {
        const token = await accessToken();
        if (!token) {
          const err = new Error('not-signed-in');
          err.status = 401;
          throw err;
        }
        const base = DEFAULT_SUPABASE_URL;
        const extra = options || {};
        const headers = Object.assign({
          apikey: DEFAULT_SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + token,
          'Content-Type': 'application/json',
          Prefer: 'return=representation'
        }, extra.headers || {});
        const res = await fetch(base + '/rest/v1/' + path, Object.assign({}, extra, { headers: headers }));
        if (!res.ok) {
          let msg = '';
          try { const j = await res.json(); msg = (j && (j.message || j.hint)) || ''; } catch (_e) {}
          const err = new Error(msg || 'save-failed');
          err.status = res.status;
          throw err;
        }
        const raw = await res.text();
        if (!raw) return [];
        return JSON.parse(raw);
      }

      async function sbFetchQuiet(path, options) {
        try {
          return await sbFetch(path, options);
        } catch (_e) {
          return null;
        }
      }

      function isUserTyping() {
        const el = document.activeElement;
        return el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT');
      }

      // 내가 보낸 미션을 연인이 수락하면, 내 폰(보낸 사람)의 비밀방에 알림을 남김
      function noticeAcceptedBySender(prevMissions, merged) {
        const prevAccepted = {};
        (prevMissions || []).forEach((m) => { prevAccepted[m.id] = Boolean(m.accepted); });
        merged.forEach((m) => {
          if (!m.accepted || m.targetRole === state.role || m.targetRole === 'BOTH') return;
          if (!(m.id in prevAccepted) || prevAccepted[m.id]) return; // 처음 보는 미션이거나 이미 알림 처리됨
          state.chats[state.role] = state.chats[state.role] || [];
          state.chats[state.role].push({
            id: 'n-' + m.id,
            sender: 'bot',
            type: 'notice',
            text: (state.partnerName || '연인') + '님이 "' + m.title + '" 미션을 수락했어요 💛',
            time: nowStr()
          });
          showToast((state.partnerName || '연인') + '님이 미션을 수락했어요 💛');
        });
      }

      function mergeRemoteMissions(rows) {
        const remote = (rows || []).map((r) => ({
          id: r.id,
          targetRole: r.target_role,
          title: r.title,
          badge: r.badge,
          message: r.message,
          time: '도착함',
          accepted: Boolean(r.accepted),
          createdAt: r.created_at || null,
          acceptedAt: r.accepted_at || null
        }));
        const remoteIds = new Set(remote.map((m) => m.id));
        const localById = {};
        (state.missions || []).forEach((m) => { localById[m.id] = m; });
        const merged = remote.map((r) => {
          const local = localById[r.id];
          return local && local.accepted && !r.accepted ? Object.assign({}, r, { accepted: true }) : r;
        });
        (state.missions || []).forEach((m) => {
          if (remoteIds.has(m.id)) return;
          if (String(m.id).indexOf('base-') === 0) return; // drop old demo cards
          const ts = Number(String(m.id).replace(/^m-/, ''));
          // keep only a mission just sent on this phone, not yet visible on the server
          if (ts && (Date.now() - ts) < 20000) merged.unshift(m);
        });
        return merged;
      }

      async function syncFromSupabase() {
        if (state.phase !== 'ready' || !state.coupleCode) return;
        const couples = await sbFetchQuiet('couples?code=eq.' + encodeURIComponent(state.coupleCode));
        let changed = false;
        if (couples && couples.length > 0) {
          const row = couples[0];
          const nextTemp = Number(row.warmth_temp);
          const nextCount = Number(row.completed_count);
          if (!Number.isNaN(nextTemp) && nextTemp !== state.warmthTemp) {
            state.warmthTemp = nextTemp;
            changed = true;
          }
          if (!Number.isNaN(nextCount) && nextCount !== state.completedCount) {
            state.completedCount = nextCount;
            changed = true;
          }
          const myFromServer = state.role === 'A' ? row.name_a : row.name_b;
          const partnerFromServer = state.role === 'A' ? row.name_b : row.name_a;
          if (myFromServer && myFromServer !== state.myName) {
            state.myName = myFromServer;
            changed = true;
          }
          if (partnerFromServer && partnerFromServer !== state.partnerName) {
            state.partnerName = partnerFromServer;
            changed = true;
          }
          const joined = Boolean(row.user_a && row.user_b);
          if (joined !== state.partnerJoined) {
            state.partnerJoined = joined;
            changed = true;
            if (joined) showToast('연인이 들어왔어요! 이제 서로 연결됐어요 💛');
          }
        }
        const rows = await sbFetchQuiet('daily_missions?couple_code=eq.' + encodeURIComponent(state.coupleCode) + '&order=created_at.desc');
        if (rows && Array.isArray(rows)) {
          const merged = mergeRemoteMissions(rows);
          const before = JSON.stringify((state.missions || []).map((m) => [m.id, m.accepted]));
          const after = JSON.stringify(merged.map((m) => [m.id, m.accepted]));
          if (before !== after) {
            noticeAcceptedBySender(state.missions, merged);
            state.missions = merged;
            changed = true;
          }
        }
        if (state.partnerJoined) {
          const consent = await sbFetchQuiet('rpc/my_share_consent', { method: 'POST', body: JSON.stringify({ p_card_type: 'combo' }) });
          if (consent !== null && applyShareConsent(consent && consent.id ? consent : null)) changed = true;
        }
        if (await refreshPaywall(false)) changed = true;
        if (state.tempView !== 'question' && await refreshTemp(state.tempView === 'wait')) changed = true;
        if (await refreshSelfMissions()) changed = true;
        if (await refreshHeartNotices(false)) changed = true;
        if (changed) {
          saveState();
          if (!isUserTyping()) render();
        }
      }

      // v10: 공유 동의 상태 반영. 바뀌었으면 true
      function applyShareConsent(next) {
        const prev = state.shareConsent;
        const key = (c) => (c ? c.id + ':' + c.status : '');
        if (key(prev) === key(next)) return false;
        state.shareConsent = next;
        if (next && prev && prev.id === next.id && prev.status === 'pending' && next.requested_by_me) {
          if (next.status === 'accepted') showToast('둘 다 좋대요! 이제 올릴 수 있어요 ✨');
          if (next.status === 'declined') showToast('이번 건 둘만 보기로 했어요. 카드는 사랑의 온도계 탭에 그대로 있어요.');
        } else if (next && next.status === 'pending' && !next.requested_by_me && (!prev || prev.id !== next.id)) {
          // 오늘의 미션 탭에서는 같은 문구의 동의 카드가 보이므로 토스트는 건너뛴다
          if (state.activeTab !== 'missions') {
            showToast((next.requester_name || state.partnerName || '연인') + '님이 우리 조합 카드를 올리고 싶대요 💌');
          }
        }
        return true;
      }

      // ---- v11: 심층 리포트(마음 날씨) + 결제 화면 ----
      // 서버 플래그(get_paywall_config)가 켜지고 가격·아임웹 링크·열리는 시간이 모두 채워졌을 때만 보인다.
      // 꺼져 있으면 아래 함수는 모두 빈 문자열/원래 문구를 돌려줘서 기존 화면이 그대로다.
      // 리포트 내용은 서버(my_report)가 만든 키(다정함 방식, 서운함 주제)뿐이다. 서운함 주제에는 미션 기록과 함께,
      // 연인이 비밀방 안내에서 [확인했어요](consent_secret_report)를 누른 뒤에 쓴 글의 '주제 키'만 쓰인다. 비밀방 원문은 어디에도 없다.
      const SECRET_COPY = [
        ['여기 대화는 연인에게 절대 보이지 않아요', '쓴 문장은 연인에게 절대 보이지 않아요'],
        ['여기 얘기는 연인에게 보이지 않으니까 마음 편히 말해 주세요.', '쓴 문장은 연인에게 절대 보이지 않아요. 마음 편히 말해 주세요.']
      ];
      let paywallCheckedAt = 0;
      let teaserViewLogged = false;

      function paywallOn() {
        const p = state.paywall;
        return Boolean(p && p.enabled === true && Number(p.price_krw) > 0
          && typeof p.checkout_url === 'string' && /^https:\/\/[^\s<>"'`\\]+$/.test(p.checkout_url)
          && typeof p.unlock_eta === 'string' && p.unlock_eta.trim());
      }

      function reportVisible() {
        const r = state.report;
        return paywallOn() && state.partnerJoined && Boolean(r && r.enabled === true && r.partner_joined === true);
      }

      function secretCopy(text) {
        if (!paywallOn()) return text;
        let t = String(text || '');
        SECRET_COPY.forEach(([a, b]) => { t = t.split(a).join(b); });
        return t;
      }

      // 서버에 [확인했어요]가 기록됐을 때만 저장 (실패하면 다음에 카드가 다시 뜬다)
      function secretInfoKey() { return 'urisai_secret_consent_' + state.userId + '_' + state.coupleCode; }
      let secretInfoAcked = false;
      let capNotice = false; // 비밀방 하루 상한(서버 sai_chat {capped:true})
      function checkoutKey() { return 'urisai_checkout_opened_' + state.coupleCode; }

      async function refreshPaywall(force) {
        if (state.phase !== 'ready' || !state.coupleCode) return false;
        if (!force && Date.now() - paywallCheckedAt < 30000) return false;
        paywallCheckedAt = Date.now();
        const before = JSON.stringify([state.paywall, state.report]);
        const wasPaid = Boolean(state.report && state.report.paid);
        const cfg = await sbFetchQuiet('rpc/get_paywall_config', { method: 'POST', body: '{}' });
        state.paywall = cfg && cfg.enabled === true ? cfg : null;
        if (paywallOn() && state.partnerJoined) {
          const r = await sbFetchQuiet('rpc/my_report', { method: 'POST', body: '{}' });
          state.report = r && r.enabled === true ? r : null;
        } else {
          state.report = null;
          state.showReport = false;
        }
        if (reportVisible() && state.report.paid && !wasPaid) {
          const k = 'urisai_report_opened_' + state.coupleCode;
          try {
            if (!localStorage.getItem(k)) { localStorage.setItem(k, '1'); showToast('두 분의 마음 날씨 리포트가 열렸어요 💛'); }
          } catch (_e) {}
        }
        return before !== JSON.stringify([state.paywall, state.report]);
      }

      // 우리 온도 탭 — 우리 조합 카드 바로 아래
      function renderReportTabCard() {
        if (!reportVisible()) return '';
        const r = state.report;
        const name = r.partner_name || state.partnerName || '연인';
        if (!teaserViewLogged) { teaserViewLogged = true; logEvent('report_teaser_view'); }
        if (!r.ready) {
          return `
            <div class="bg-white rounded-2xl p-4 border border-[#2D3436]/8 shadow-sm space-y-3">

      // 비밀방 — 입력창 위 한 줄 (v11.6: 리포트 설명 카드·펼치기 제거)

      // v10.5: 책 링크. 링크별 하루 클릭 수만 센다 (기다리지 않음, 실패해도 무시)
      const BOOK_LINKS = {

      // ---- v10: 우리 조합 카드 ----
      // 조합 이름 = "{A 유형} × {B 유형}" (A = 초대코드를 만든 사람). 두 폰이 같은 이름을 보도록
      // 서버에서 받은 공용 데이터(daily_missions의 제목·본문·수락 시각, 커플 코드)만 쓴다. 비밀방 원문은 쓰지 않는다.
      // 각 사람(역할)마다, 그 사람이 수락한 미션으로 8가지 유형 점수를 매긴다:
      //   조용한 펭귄  : 행동형 미션 (안아/산책/걷/눈맞/폰/화면/티타임/톤)        +1 / 미션
      //   수다 앵무새  : 대화형 미션 (말/톡/목소리/인사/한마디/문장/칭찬/안부/통화) +1 / 미션
      //   꼼꼼한 다람쥐: 약속형 미션 (약속/기념일/계획/코스)                     +1 / 미션
      //   포근한 곰    : 함께 보내는 시간 (같이/함께/데이트/집에서/노래/영상)      +1 / 미션
      //   반짝 토끼    : 깜짝 표현 (선물/깜짝/스티커/편지/비밀/이벤트)           +1 / 미션
      //   직진 강아지  : 도착 → 수락 중앙값 3시간 미만                          +2
      //   느긋한 고양이: 도착 → 수락 중앙값 24시간 초과                         +2
      //   든든한 거북이: 서로 다른 날 5일 이상 수락                              +2
      // 최고점이 같으면 커플 코드 해시로 정한 순서로 고른다. 신호가 하나도 없으면 커플 코드 해시로 고른다.
      // 진단 말(회피형 등)은 쓰지 않는다. 이름·설명 문구: Product Marketer (copy.md).
      const COMBO_TYPES = [
        { key: 'cat', name: '느긋한 고양이', desc: '마음 정리할 시간이 필요한 편이에요', words: [] },
        { key: 'dog', name: '직진 강아지', desc: '서운하면 바로 말하고 바로 풀어요', words: [] },
        { key: 'penguin', name: '조용한 펭귄', desc: '말보다 행동으로 챙겨요', words: ['안아', '산책', '걷', '눈맞', '눈 맞', '폰', '화면', '티타임', '톤'] },
        { key: 'parrot', name: '수다 앵무새', desc: '다정함은 말로 확인하고 싶어요', words: ['말', '톡', '목소리', '인사', '한마디', '문장', '칭찬', '안부', '통화'] },
        { key: 'squirrel', name: '꼼꼼한 다람쥐', desc: '작은 약속까지 기억해요', words: ['약속', '기념일', '계획', '코스'] },
        { key: 'bear', name: '포근한 곰', desc: '같이 있는 시간이 제일 좋아요', words: ['같이', '함께', '데이트', '집에서', '노래', '영상'] },
        { key: 'rabbit', name: '반짝 토끼', desc: '깜짝 표현에 약해요', words: ['선물', '깜짝', '스티커', '편지', '비밀', '이벤트'] },
        { key: 'turtle', name: '든든한 거북이', desc: '천천히, 오래 꾸준해요', words: [] }
      ];
      const COMBO_MIN_MISSIONS = 3;

      function hashStr(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
        return h >>> 0;
      }

      function comboTypeFor(role, seed) {
        const done = (state.missions || []).filter((m) => m.accepted && m.targetRole === role);
        const score = COMBO_TYPES.map(() => 0);
        done.forEach((m) => {
          const text = String(m.title || '') + ' ' + String(m.message || '');
          COMBO_TYPES.forEach((t, i) => { if (t.words.some((w) => text.indexOf(w) >= 0)) score[i] += 1; });
        });
        const lat = done
          .map((m) => (Date.parse(m.acceptedAt) - Date.parse(m.createdAt)) / 3600000)
          .filter((h) => Number.isFinite(h) && h >= 0)
          .sort((a, b) => a - b);
        if (lat.length) {
          const med = lat[Math.floor(lat.length / 2)];
          if (med < 3) score[1] += 2;
          if (med > 24) score[0] += 2;
        }
        const days = new Set(done.map((m) => String(m.acceptedAt || '').slice(0, 10)).filter(Boolean));
        if (days.size >= 5) score[7] += 2;
        const n = COMBO_TYPES.length;
        const best = Math.max.apply(null, score);
        if (best <= 0) return COMBO_TYPES[seed % n];
        for (let k = 0; k < n; k++) {
          const i = (seed + k) % n;
          if (score[i] === best) return COMBO_TYPES[i];
        }
        return COMBO_TYPES[0];
      }

      function comboInfo() {
        const h = hashStr(String(state.coupleCode || ''));
        const a = comboTypeFor('A', h % 8);
        const b = comboTypeFor('B', (h >>> 3) % 8);
        return { a: a, b: b, name: a.name + ' × ' + b.name, temp: String(dispTemp(shownTemp())), count: state.completedCount };
      }

      let comboImage = { key: '', url: '', blob: null, busy: false };

      function comboShareText(info) {
        return info.name + '\n' + '우리사이 온도 ' + info.temp + '°C\n함께 달성한 다정함 미션 ' + info.count + '회';
      }

      function copyText(t) {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
        return new Promise((resolve, reject) => {
          const ta = document.createElement('textarea');
          ta.value = t;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try { ok = document.execCommand('copy'); } catch (_e) {}
          document.body.removeChild(ta);
          if (ok) resolve(); else reject(new Error('copy-failed'));
        });
      }

      // 공유창을 탭 직후 바로 띄움(await 없이 호출해야 탭 제스처가 유지됨).
      // 공유창이 없거나 실패하면 링크 복사, 사용자가 닫은 경우(AbortError)는 아무것도 안 함.
      // 결과: 'shared' | 'copied' | 'aborted' | 'failed'
      function shareOrCopy(data, fallbackText) {
        let p;
        try {
          p = navigator.share ? navigator.share(data) : Promise.reject(new Error('share-unavailable'));
        } catch (err) {
          p = Promise.reject(err);
        }
        return Promise.resolve(p).then(() => 'shared', (err) => {
          if (err && err.name === 'AbortError') return 'aborted';
          return copyText(fallbackText).then(() => { showToast('링크 복사 완료!'); return 'copied'; },
            () => { showToast('잠시 후 다시 시도해 주세요'); return 'failed'; });
        });
      }

      function loadImg(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = src;
        });
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      const CARD_FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';

      // 1080x1920 (9:16) 카드 이미지
      async function drawComboCard(info) {
        const cv = document.createElement('canvas');
        cv.width = 1080; cv.height = 1920;
        const ctx = cv.getContext('2d');
        const bg = ctx.createLinearGradient(0, 0, 0, 1920);
        bg.addColorStop(0, '#FFF9F5'); bg.addColorStop(1, '#FFF0EE');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, 1080, 1920);
        ctx.save();
        ctx.shadowColor = 'rgba(45,52,54,0.08)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 16;
        roundRect(ctx, 80, 280, 920, 1180, 72); ctx.fillStyle = '#FFFFFF'; ctx.fill();
        ctx.restore();
        roundRect(ctx, 80, 280, 920, 1180, 72); ctx.strokeStyle = 'rgba(255,138,128,0.25)'; ctx.lineWidth = 3; ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#2D3436'; ctx.font = '800 88px ' + CARD_FONT; ctx.fillText(info.a.name, 540, 500);
        ctx.fillStyle = '#636E72'; ctx.font = '500 38px ' + CARD_FONT; ctx.fillText(info.a.desc, 540, 572);
        ctx.fillStyle = '#FF8A80'; ctx.font = '800 96px ' + CARD_FONT; ctx.fillText('×', 540, 715);
        ctx.fillStyle = '#2D3436'; ctx.font = '800 88px ' + CARD_FONT; ctx.fillText(info.b.name, 540, 860);
        ctx.fillStyle = '#636E72'; ctx.font = '500 38px ' + CARD_FONT; ctx.fillText(info.b.desc, 540, 932);
        ctx.fillStyle = '#2D3436'; ctx.font = '800 58px ' + CARD_FONT; ctx.fillText('우리사이 온도 ' + info.temp + '°C', 540, 1120);
        roundRect(ctx, 200, 1172, 680, 28, 14); ctx.fillStyle = '#FFF0EE'; ctx.fill();
        const pct = Math.min(100, Math.max(12, ((Number(info.temp) - 35) / 10) * 100)) / 100;
        const bar = ctx.createLinearGradient(200, 0, 880, 0);
        bar.addColorStop(0, '#FFAB91'); bar.addColorStop(1, '#FF8A80');
        roundRect(ctx, 200, 1172, Math.max(28, 680 * pct), 28, 14); ctx.fillStyle = bar; ctx.fill();
        ctx.fillStyle = '#636E72'; ctx.font = '600 42px ' + CARD_FONT; ctx.fillText('함께 달성한 다정함 미션 ' + info.count + '회', 540, 1300);
        const icon = await loadImg(AVATAR_SRC);
        if (icon) {
          ctx.save(); roundRect(ctx, 474, 1580, 132, 132, 36); ctx.clip(); ctx.drawImage(icon, 474, 1580, 132, 132); ctx.restore();
        }
        ctx.fillStyle = '#2D3436'; ctx.font = '800 56px ' + CARD_FONT; ctx.fillText('우리사이', 540, 1800);
        const blob = await new Promise((resolve) => cv.toBlob(resolve, 'image/png'));
        return { url: cv.toDataURL('image/png'), blob: blob };
      }

      async function ensureComboImage() {
        const info = comboInfo();
        const key = [info.name, info.temp, info.count].join('|');
        if (comboImage.key === key && comboImage.url) return comboImage;
        if (comboImage.busy) return comboImage;
        comboImage.busy = true;
        try {
          const out = await drawComboCard(info);
          comboImage = { key: key, url: out.url, blob: out.blob, busy: false };
        } catch (_e) {
          comboImage.busy = false;
        }
        if (state.showCombo) render();
        return comboImage;
      }

      function startSyncLoop() {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = null;
        if (state.phase === 'ready' && document.visibilityState !== 'hidden') {
          syncFromSupabase();
          syncTimer = setInterval(syncFromSupabase, 6000);
        }
      }

      // 백그라운드에서는 폴링을 멈추고(배터리·요청 절약), 돌아오면 바로 동기화
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
        } else if (state.phase === 'ready') {
          startSyncLoop();
        }
      });

      async function saveNamesToServer() {
        const payload = state.role === 'A' ? { name_a: state.myName } : { name_b: state.myName };
        await sbFetch('couples?code=eq.' + encodeURIComponent(state.coupleCode), {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
      }

      async function rpc(name, args) {
        return sbFetch('rpc/' + name, { method: 'POST', body: JSON.stringify(args || {}) });
      }

      function applyCouple(c) {
        state.coupleCode = c.code;
        state.role = c.role === 'B' ? 'B' : 'A';
        const mine = state.role === 'A' ? c.name_a : c.name_b;
        const theirs = state.role === 'A' ? c.name_b : c.name_a;
        state.myName = mine || state.kakaoName || '나';
        state.partnerName = theirs || '연인';
        state.partnerJoined = Boolean(c.partner_joined);
        const t = Number(c.warmth_temp);
        if (!Number.isNaN(t)) state.warmthTemp = t;
        const n = Number(c.completed_count);
        if (!Number.isNaN(n)) state.completedCount = n;
        state.phase = 'ready';
        state.onboarded = true;
      }

      // ---- 사이봇 대화 ----
      // 1) v9 서버 RPC sai_chat (Gemini, 최근 대화 맥락 포함)
      // 2) sai_chat 이 아직 DB에 없으면(마이그레이션 전) 예전 generate_mission
      // 3) 둘 다 실패할 때만 아래 기본 답변(매번 다른 문구, 최근 것 피함)
      const FALLBACK_EMPATHY = {

        ],
        affection: [
          '마음은 알아도 가끔은 말로 듣고 싶잖아요. 그 바람, 전혀 욕심이 아니에요.',
          '표현이 줄면 괜히 사랑이 식은 것 같아 외로워지죠. 그렇게 느끼는 거 이상한 거 아니에요.',

          '데이트를 늘 내가 끌고 가는 느낌이면 아쉬울 수밖에 없어요. 그 마음 충분히 이해돼요.'
        ],
        tone: [
          '가까운 사이라 말투 하나에 더 크게 상처받죠. 그 순간 많이 속상했겠어요.',
          '피곤한 건 알아도 차가운 말투는 마음에 오래 남죠. 상처받은 거 당연해요.',
          '말 한마디의 온도가 하루를 바꾸기도 하잖아요. 그 서운함 충분히 이해돼요.'
        ],
        default: [
          '그런 일이 있었군요. 말로 꺼내줘서 고마워요, 그 마음 제가 잘 들었어요.',
          '그 얘기 들으니 마음이 쓰이네요. 혼자 삭이지 말고 여기다 편하게 털어놔요.',
          '그랬구나, 쉽지 않았겠어요. 조금 더 얘기해 주면 같이 방법을 찾아볼게요.',
          '솔직하게 말해줘서 고마워요. 그 마음 충분히 그럴 수 있어요.'
        ]
      };
      const SMALLTALK_REPLIES = [
        '안녕하세요! 오늘 연인이랑은 어떤 하루였어요? 좋았던 일도, 서운했던 일도 편하게 얘기해 주세요 😊',
        '반가워요! 요즘 둘 사이에 신경 쓰이는 일 있으면 여기서 편하게 털어놔요.',
        '저는 두 분 사이를 몰래 도와주는 사이봇이에요. 여기 얘기는 연인에게 보이지 않으니까 마음 편히 말해 주세요.'
      ];

      function pickVaried(list, avoid) {
        const pool = list.filter((x) => (avoid || []).indexOf(x) < 0);
        const from = pool.length ? pool : list;
        return from[Math.floor(Math.random() * from.length)];
      }

      function isSmallTalk(text) {
        const s = String(text || '').trim();
        if (s.length > 25) return false;
        return /^(안녕|하이|ㅎㅇ|헬로|hello|hi|반가|뭐해|누구|너는|넌|고마워|ㄱㅅ|ㅋㅋ|ㅎㅎ|테스트|test)/i.test(s);
      }

      function recentBotTexts(role) {
        return (state.chats[role] || []).filter((m) => m.sender === 'bot').slice(-6).map((m) => m.empathy || m.text || '');
      }

      function localFallback(text, role) {
        const recentTexts = recentBotTexts(role);
        if (isSmallTalk(text)) {
          return { empathy: pickVaried(SMALLTALK_REPLIES, recentTexts), drafts: [], draftIdx: 0, fallback: true };
        }
        const cat = detectCategory(text);
        const preset = NUDGE_LIBRARY[cat] || NUDGE_LIBRARY.default;
        const sentTitles = (state.missions || []).map((m) => m.title);
        (state.chats[role] || []).forEach((m) => {
          if (m.sent && m.drafts && m.drafts[m.draftIdx || 0]) sentTitles.push(m.drafts[m.draftIdx || 0].title);
        });
        let drafts = preset.drafts.filter((d) => sentTitles.indexOf(d.title) < 0);
        if (drafts.length < 2) drafts = preset.drafts.slice();
        drafts = drafts.slice().sort(() => Math.random() - 0.5);
        return {
          empathy: pickVaried(FALLBACK_EMPATHY[cat] || FALLBACK_EMPATHY.default, recentTexts),
          drafts: drafts,
          draftIdx: 0,
          fallback: true
        };
      }

      // 예전 버전의 고정 문구는 맥락에서 뺌 (AI가 따라 하지 않게)
      const PRESET_EMPATHY = new Set(Object.keys(NUDGE_LIBRARY).map((k) => NUDGE_LIBRARY[k].empathy));

      // 비밀방 대화 기록 → [{role:'user'|'bot', text}] (최근 10개)
      function chatHistory(role) {
        const out = [];
        (state.chats[role] || []).forEach((m) => {
          if (m.sender === 'user') out.push({ role: 'user', text: String(m.text || '').slice(0, 500) });
          else if (m.type === 'draft' && m.empathy && !m.fallback && !PRESET_EMPATHY.has(m.empathy)) out.push({ role: 'bot', text: String(m.empathy).slice(0, 500) });
        });
        return out.slice(-10);
      }

      async function rpcTimed(name, args, ms) {
        const token = await accessToken();
        if (!token) return { status: 401, data: null };
        const ctrl = new AbortController();
        const timer = setTimeout(function () { ctrl.abort(); }, ms);
        try {
          const res = await fetch(DEFAULT_SUPABASE_URL + '/rest/v1/rpc/' + name, {
            method: 'POST',
            headers: {
              apikey: DEFAULT_SUPABASE_ANON_KEY,
              Authorization: 'Bearer ' + token,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(args || {}),
            signal: ctrl.signal
          });
          let data = null;
          try { data = await res.json(); } catch (_e) {}
          return { status: res.status, data: data };
        } catch (_e) {
          return { status: 0, data: null };
        } finally {
          clearTimeout(timer);
        }
      }

      function missionDraft(title, message, i) {
        const badges = ['온도 미션', '온도 미션', '온도 미션'];
        return { title: String(title || '오늘의 다정함 미션').slice(0, 40), badge: badges[i % badges.length], message: String(message || '').slice(0, 300) };
      }

      // v11.5: 『긍정학개론』 미션 제안 (비밀방 제안 2번째 자리에 하나)
      const BOOK_DRAFTS = {
        okay: { title: '"그럴 수 있지" 먼저 말해 주기', badge: '온도 미션', message: '오늘 작은 일로 마음이 걸리면, 따지기 전에 "그럴 수 있지" 한마디로 먼저 받아 주세요.' },
        gratitude: { title: '고마운 일 하나 말로 전하기', badge: '온도 미션', message: '감사하다고 말해야 감사한 것이 돼요. 오늘 고마웠던 일 하나를 말로 꺼내 주세요.' },
        open: { title: '"당연히"를 내려놓기', badge: '온도 미션', message: '"당연히 ~해야지"가 떠오르면 "그럴 수도 있지"로 바꿔 말해 보세요.' },
        resp: { title: '바라는 것 하나 내가 먼저 하기', badge: '온도 미션', message: '마음은 행동으로 증명돼요. 바라는 것 하나를 오늘 내가 먼저 해 주세요.' }
      };
      const BOOK_BY_CATEGORY = { contact: 'okay', tone: 'okay', affection: 'gratitude', date: 'resp', phone: 'resp' };
      function withBookDraft(drafts, text) {
        const list = (drafts || []).slice();
        if (!list.length) return list;
        const keys = ['okay', 'gratitude', 'open', 'resp'];
        const key = BOOK_BY_CATEGORY[detectCategory(String(text || ''))] || keys[hashStr(String(text || '')) % keys.length];
        const book = BOOK_DRAFTS[key];
        const rest = list.filter((d) => d && d.title !== book.title);
        return rest.slice(0, 1).concat([Object.assign({}, book)], rest.slice(1)).slice(0, 3);
      }

      async function askSaibot(text, role) {
        const clean = String(text || '').slice(0, 500);
        if (!state.coupleCode) return localFallback(clean, role);

        const r = await rpcTimed('sai_chat', { couple_code: state.coupleCode, messages: chatHistory(role) }, 27000);
        const d = r.data;
        if (r.status === 200 && d && d.capped === true) return { capped: true };
        if (r.status === 200 && d && typeof d.reply === 'string' && d.reply.trim()) {
          const drafts = (Array.isArray(d.missions) ? d.missions : [])
            .filter((m) => m && m.message)
            .slice(0, 3)
            .map((m, i) => missionDraft(m.title, m.message, i));
          return { empathy: d.reply.trim(), drafts: drafts, draftIdx: 0, ai: true };
        }

        // sai_chat 이 아직 없는 DB(v8)라면 예전 미션 생성기로
        const missing = r.status === 404 || (d && (d.code === 'PGRST202' || d.code === '42883'));
        if (missing && !isSmallTalk(clean)) {
          const g = await rpcTimed('generate_mission', { feeling: clean, couple_code: state.coupleCode }, 12000);
          const gd = g.data;
          if (g.status === 200 && gd && gd.empathy && gd.message) {
            const extra = localFallback(clean, role).drafts.slice(0, 2);
            return { empathy: gd.empathy, drafts: [missionDraft(gd.title, gd.message, 0)].concat(extra), draftIdx: 0, ai: true };
          }
        }
        return localFallback(clean, role);
      }

        if (state.partnerJoined) return '';
        return `

          let seen = false;
          try { seen = Boolean(localStorage.getItem('urisai_onboard_v116')); } catch (_e) {}

                  <div class="flex gap-1.5">${SAIBOT_LINES.onboarding.map((_l, k) => `<span class="w-1.5 h-1.5 rounded-full ${k === step ? 'bg-[#FF8A80]' : 'bg-[#FF8A80]/25'}"></span>`).join('')}</div>

              <div class="space-y-2.5">
                <button type="button" data-action="kakao-login" ${state.busy ? 'disabled' : ''} class="w-full py-3.5 rounded-2xl bg-[#FEE500] hover:brightness-95 active:scale-[0.99] text-[#191919] text-sm font-extrabold shadow-[0_6px_20px_rgba(254,229,0,0.35)] transition-all flex items-center justify-center gap-2 ${state.busy ? 'opacity-60' : ''}">

                <p class="text-[10px] text-[#9AA5A9] text-center leading-relaxed">카카오 닉네임과 프로필 사진만 받아요. 이메일이나 연락처는 받지 않아요.</p>
                <button type="button" data-action="open-install" class="w-full py-2.5 rounded-2xl bg-white border border-[#2D3436]/10 text-xs font-bold text-[#636E72] hover:text-[#2D3436]">
                  📱 아이폰 · 안드로이드 홈 화면에 앱으로 설치하는 법
                </button>
              </div>
            </div>
          `;
        }

        // needCouple
        const name = state.myName || state.kakaoName || '';
        return `
          <div class="flex-1 flex flex-col justify-between px-6 py-10 safe-top safe-bottom overflow-y-auto">
            ${landingHeader((name ? esc(name) + '님, 반가워요! 💛<br />' : '') + '연인과 연결하면 시작할 수 있어요.')}

            <div class="bg-white rounded-3xl p-5 shadow-[0_8px_28px_rgba(45,52,54,0.06)] border border-[#FF8A80]/20 space-y-4 my-6">
              <div>
                <label class="block text-[11px] font-bold text-[#636E72] mb-1">우리사이에서 쓸 내 닉네임</label>
                <input id="ob-my-name" type="text" maxlength="12" value="${esc(state.obName != null ? state.obName : name)}" placeholder="닉네임" class="w-full px-3 py-2.5 rounded-xl bg-[#FFF9F5] border border-[#FF8A80]/30 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#FF8A80]/40" />
              </div>
              ${state.joinMode ? `
                <div>
                  <label class="block text-[11px] font-bold text-[#636E72] mb-1">연인에게 받은 초대 코드</label>
                  <div class="flex items-center w-full rounded-xl bg-[#FFF9F5] border border-[#FF8A80]/30 focus-within:ring-2 focus-within:ring-[#FF8A80]/40">
                    <span class="pl-3 text-sm font-mono font-bold tracking-wider text-[#2D3436] select-none" aria-hidden="true">S2-</span>
                    <input id="ob-code" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="6" value="${esc(state.joinRest || '')}" placeholder="XXXXXX" aria-label="초대 코드 (S2- 뒤 6자리)" class="flex-1 min-w-0 pr-3 py-2.5 bg-transparent text-sm font-mono font-bold tracking-wider uppercase focus:outline-none" />
                  </div>
                </div>
              ` : `
                <p class="text-[11px] text-[#636E72] leading-relaxed">먼저 시작하는 분은 <b>초대코드 만들기</b>, 연인에게 코드를 받은 분은 <b>초대코드 입력</b>을 눌러 주세요.</p>
              `}
            </div>

            <div class="space-y-2.5">
              ${state.joinMode ? `
                <button type="button" data-action="join-couple" ${state.busy ? 'disabled' : ''} class="w-full py-3.5 rounded-2xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-sm font-extrabold shadow-[0_6px_20px_rgba(255,138,128,0.4)] ${state.busy ? 'opacity-60' : ''}">
                  ${state.busy ? '연결하는 중...' : '연인과 연결하기 💛'}
                </button>
                <button type="button" data-action="join-back" class="w-full py-2.5 rounded-2xl bg-white border border-[#2D3436]/10 text-xs font-bold text-[#636E72]">뒤로</button>
              ` : `

                  ${state.busy ? '만드는 중...' : '초대코드 만들기'}
                </button>
                <button type="button" data-action="join-mode" class="w-full py-3.5 rounded-2xl bg-white border border-[#FF8A80]/40 text-[#E0665B] text-sm font-extrabold">

              <button type="button" data-action="logout-confirm" class="w-full py-2 text-[11px] font-bold text-[#9AA5A9]">다른 카카오 계정으로 시작하기</button>

      }

      // ---- v10.4 오늘의 고마움 (매일 고마움 카드) ----
      // 예시 문장: copy.md '매일 아침 고마움 미션' 시작 문구 + book-quotes.md 2-2. 바꿀 부분(fill)만 칠해 보여 준다.
      // fill 칸이 비면 empty 문장을 보낸다. 회색 '___'는 CSS로만 그려서 보내는 글자에 절대 들어가지 않는다.
      const GRATITUDE_EXAMPLES = [
        { pre: '어제 ', fill: '퇴근길에 데리러 와', post: ' 줘서 고마웠어', empty: '어제 고마웠어' },
        { pre: '덕분에 ', fill: '오늘 힘내서 출근', post: ' 했어', empty: '덕분이야, 고마워' },
        { pre: '오늘 ', fill: '발표', post: ' 잘될 거야. 응원해', empty: '오늘도 잘될 거야. 응원해' },
        { pre: '언제나 ', fill: '', post: ' 해 줘서 고마워', empty: '언제나 고마워' },
        { pre: '', fill: '저녁', post: ' 챙겨 줘서 고마워', empty: '챙겨 줘서 고마워' },
        { pre: '바쁠 때도 ', fill: '연락', post: ' 해 줘서 고마워', empty: '바쁠 때도 고마워' }
      ];
      // book-quotes.md 2-1 (고마움 카드 전용. 236·237쪽은 이 카드에만 쓴다). 하루에 하나.
      const GRATITUDE_QUOTES = [
        { q: '우리가 감사하다고 해야 감사한 것이 되고, 재미있다고 해야 재밌어지고, 칭찬을 해야 칭찬거리가된다.', p: 125 },
        { q: '마음에도 없는 말을 못 하는 게 아니라, 마음에 말을 만들지 않았을 뿐이다.', p: 125 },
        { q: '상대에게도 언제나 "덕분이다", "감사하다"라고 생각하라.', p: 135 },
        { q: "그러니 필사적으로 '그런데'를 버리고 '그리고'를 써라.", p: 136 },
        { q: "'그리고'를 쓰려면 억지로라도 앞선 내용에 긍정이나 공감을 먼저 해야만 문장이 매끄럽게 이어진다.", p: 136 },
        { q: '행동을 한 순간 이미 그 호의의 가치는 완성된 것이다.', p: 236 },
        { q: "당연한 권리가 아니라 '기적 같이 감사한 선물'로 다가오게 된다.", p: 237 }
      ];

      function kstDay() {
        try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date()); }
        catch (_e) { return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10); }
      }
      function gratitudeKey() { return 'urisai_gratitude_v104_' + state.coupleCode + '_' + state.role; }
      function gratitudeSentToday() {
        try { const v = JSON.parse(localStorage.getItem(gratitudeKey()) || 'null'); return v && v.day === kstDay() ? v : null; } catch (_e) { return null; }
      }
      function gratitudeQuote() {
        const d = kstDay().split('-').map(Number);
        const n = Math.floor(Date.UTC(d[0], d[1] - 1, d[2]) / 86400000);
        return GRATITUDE_QUOTES[n % GRATITUDE_QUOTES.length];
      }
      // 문장 전체를 자유롭게 고칠 수 있다. 예시 문장에서 칠한 칸만 비우고 나머지를 그대로 두면 그 예시의 empty 문장.
      // 회색 '___'는 CSS(::before)로만 그려서 textContent에 절대 들어가지 않는다.
      const GRATITUDE_MAX = 100;
      function gratitudeNorm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
      function gratitudePartsFor(idx) {
        const ex = GRATITUDE_EXAMPLES[idx];
        return ex ? { b: ex.pre, f: ex.fill, a: ex.post, mark: true } : { b: '', f: '', a: '', mark: false };
      }
      function gratitudeSentence(idx, parts) {
        const full = gratitudeNorm(parts.b + parts.f + parts.a);
        if (!full) return '';
        const ex = GRATITUDE_EXAMPLES[idx];
        if (ex && !gratitudeNorm(parts.f) && full === gratitudeNorm(ex.pre + ' ' + ex.post)) return ex.empty;
        return full.slice(0, GRATITUDE_MAX);
      }
      // 편집기 DOM -> { 칠한 칸 앞, 칠한 칸, 뒤 }. 칸이 지워져 없어졌으면 mark=false, 전부 b.
      function readGratitudeEditor() {
        const el = document.getElementById('gratitude-text');
        if (!el) return state.gratitudeParts;
        const clean = (t) => t.replace(/[\r\n]+/g, ' ');
        const span = el.querySelector('[data-gratitude-fill]');
        if (!span) return { b: clean(el.textContent), f: '', a: '', mark: false };
        const r = document.createRange();
        r.selectNodeContents(el); r.setEndBefore(span);
        const b = r.toString();
        r.selectNodeContents(el); r.setStartAfter(span);
        return { b: clean(b), f: clean(span.textContent), a: clean(r.toString()), mark: true };
      }
      function currentGratitudeSentence() {
        return gratitudeSentence(state.gratitudeIdx, document.getElementById('gratitude-text') ? readGratitudeEditor() : state.gratitudeParts);
      }

      function renderGratitudeCard() {
        const sent = gratitudeSentToday();
        const idx = state.gratitudeIdx;
        const gp = state.gratitudeParts;
        const canSend = !!gratitudeSentence(idx, gp);
        return `
              <div class="animate-pop bg-white rounded-2xl p-4 border ${!sent ? 'border-[#FF8A80] ring-2 ring-[#FF8A80]/15' : 'border-[#2D3436]/8'} shadow-[0_4px_16px_rgba(45,52,54,0.05)] relative" data-gratitude-card>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-[11px] font-bold text-[#FF8A80] bg-[#FFF0EE] px-2.5 py-0.5 rounded-full">오늘의 고마움</span>
                </div>
                <h3 class="text-[15px] font-extrabold text-[#2D3436] mb-1.5">${esc(state.partnerName)}님에게 고마운 거 하나</h3>
                <div class="flex items-start gap-2 mt-2" data-saibot-bubble="gratitude">
                  <img src="${AVATAR_SRC}" alt="사이봇" class="w-8 h-8 rounded-full object-cover border border-[#FF8A80]/30 shrink-0" />
                  <div class="flex-1 min-w-0 bg-[#FFF9F5] rounded-2xl rounded-tl-sm px-3.5 py-2.5 border border-[#FF8A80]/15 space-y-1">
                    ${SAIBOT_LINES.gratitude.map((l) => `<p class="text-[13px] text-[#4A5568] leading-relaxed">${esc(l)}</p>`).join('')}
                  </div>
                </div>
                ${!sent ? `
                  <div class="flex gap-1.5 overflow-x-auto mt-3 pb-2 no-scrollbar">
                    <button type="button" data-action="gratitude-example" data-idx="-1" class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold border border-[#FF8A80]/30 transition-colors ${idx === -1 ? 'bg-[#FF8A80] text-white' : 'bg-[#FFF9F5] text-[#2D3436]'}">직접 쓰기</button>
                    ${GRATITUDE_EXAMPLES.map((g, i) => `
                      <button type="button" data-action="gratitude-example" data-idx="${i}" class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold border border-[#FF8A80]/30 transition-colors ${i === idx ? 'bg-[#FF8A80] text-white' : 'bg-[#FFF9F5] text-[#2D3436]'}">${esc(g.pre)}<span class="font-extrabold ${i === idx ? '' : 'text-[#E0665B]'}">${g.fill ? esc(g.fill) : '___'}</span>${esc(g.post)}</button>
                    `).join('')}
                    <span class="shrink-0 w-5" aria-hidden="true"></span>
                  </div>
                  <div id="gratitude-text" contenteditable="plaintext-only" role="textbox" aria-label="고마운 말" class="min-h-[2.75rem] bg-[#FFF9F5] rounded-2xl border border-[#FF8A80]/30 px-3 py-2.5 text-[13px] text-[#2D3436] leading-relaxed break-words focus:outline-none focus:border-[#FF8A80]" data-gratitude-editor>${esc(gp.b)}${gp.mark ? `<span data-gratitude-fill data-ph="___" class="px-1 rounded-md bg-[#FFF0EE] text-[#E0665B] font-extrabold empty:before:content-[attr(data-ph)] empty:before:text-[#B2BEC3]">${esc(gp.f)}</span>` : ''}${esc(gp.a)}</div>
                ` : ''}
                <div class="mt-3.5 pt-3 border-t border-[#2D3436]/5">
                  ${!sent ? `
                    <button type="button" data-action="send-gratitude" ${canSend ? '' : 'disabled'} class="${canSend ? '' : 'opacity-60 '}w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all">
                      카톡으로 보내기
                    </button>
                  ` : `
                    <div class="animate-pop flex items-center justify-between bg-[#E8F8F0] text-[#1E8449] px-3 py-2 rounded-xl text-xs font-bold" data-gratitude-stamp>
                      <span>${sent.bump > 0 || tempOn() ? '오늘의 고마움 보냈어요. 다음에 잴 때 온도에 담겨요 💛' : '오늘의 고마움 보냈어요 💛'}</span>
                      ${Number(sent.streak) > 1 ? `<span class="shrink-0 ml-2 whitespace-nowrap" data-gratitude-streak>${Math.floor(Number(sent.streak))}일째 ✓</span>` : ''}
                    </div>
                  `}
                </div>
              </div>
        `;
      }

      // 메시지형 미션(따옴표 문장 + 톡/메시지/보내기)만 카톡 버튼. 그 문장만 보내고, 보내면 [했어요]처럼 완료된다.
      function missionQuote(m) {
        const msg = String((m && m.message) || '');
        if (!/톡|메시지|보내/.test(msg)) return '';
        const q = /[“"]([^”"]{2,80})[”"]/.exec(msg);
        return q ? q[1].trim() : '';
      }

      function renderMissionsTab() {
        // 현재 내 역할에게 온 미션 + 공통 데일리 팁만 노출 (상대방 불만 0%)
        const visibleMissions = withSelfMissions(state.missions.filter((m) => m.targetRole === 'BOTH' || m.targetRole === state.role));
        const pendingCount = visibleMissions.filter((m) => !m.accepted).length;

        return `

              <div class="flex items-center justify-between">
                <div>
                  <p class="text-[11px] font-semibold text-white/85">${esc(state.myName)} ♥ ${esc(state.partnerName)} · 코드 ${esc(state.coupleCode)}</p>
                  <p class="text-base font-extrabold mt-0.5">우리사이 온도 <span data-mission-warmth-num>${dispTemp(shownTemp())}°C</span></p>

                  ${state.completedCount}회
                </div>

              <div class="mt-3 w-full h-1.5 bg-white/30 rounded-full overflow-hidden">

              </div>
            </div>
            ${renderHeartNotice()}
            ${renderConsentRequestCard()}
            ${renderGratitudeCard()}

            <div class="flex items-center justify-between px-1 pt-1">
              <h2 class="text-sm font-extrabold text-[#2D3436]">우리사이 온도를 데우는 오늘의 미션</h2>
              <span class="text-xs font-semibold text-[#636E72]">대기 ${pendingCount}개</span>
            </div>
            ${pendingCount > 0 ? '<p class="px-1 -mt-2 text-xs text-[#636E72]" data-mission-reminder>오늘 우리사이 온도를 데울 차례예요 🌡️ 미션 하나면 충분해요.</p>' : ''}

            ${visibleMissions.length === 0 ? `

                <p class="text-sm font-bold text-[#2D3436]">아직 도착한 미션이 없어요</p>

                <div class="flex items-center justify-between mb-2">
                  <span class="text-[11px] font-bold text-[#FF8A80] bg-[#FFF0EE] px-2.5 py-0.5 rounded-full">온도 미션</span>
                  <span class="text-[10px] text-[#9AA5A9]">${esc(m.time)}</span>

                <h3 class="text-[15px] font-extrabold text-[#2D3436] mb-1.5">${esc(m.title)}</h3>

                  ${!m.accepted ? `
                    <div class="flex gap-2">

      function renderSaibotTab() {

                <div class="max-w-[85%] space-y-1.5">
                  ${SAIBOT_LINES.secret.map((l) => `<div class="bg-white rounded-2xl rounded-tl-sm px-3.5 py-3 border border-[#FF8A80]/15 shadow-sm"><p class="text-[13px] text-[#2D3436] leading-relaxed">${esc(l)}</p></div>`).join('')}

              ${state.botTyping ? `
                <div id="bot-typing" class="flex items-start gap-2 animate-pop">
                  <img src="${AVATAR_SRC}" alt="사이봇" class="w-8 h-8 rounded-full object-cover border border-[#FF8A80]/30 shrink-0" />

              <div class="flex gap-1.5 overflow-x-auto pb-2 no-scrollbar">
                ${QUICK_TAGS.map((t) => `
                  <button type="button" data-action="quick-tag" data-sample="${esc(t.sample)}" class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-[#FFF9F5] text-[#2D3436] border border-[#FF8A80]/30 hover:bg-[#FF8A80] hover:text-white transition-colors">
                    ${esc(t.label)}
                  </button>
                `).join('')}
                <span class="shrink-0 w-5" aria-hidden="true"></span>
              </div>
              <div class="flex items-end gap-2 bg-[#FFF9F5] rounded-2xl border border-[#FF8A80]/30 px-3 py-2">
                <textarea id="emotion-input" rows="2" maxlength="500" enterkeyhint="send" placeholder="사이봇에게 편하게 얘기해 보세요 (서운했던 일, 고민, 뭐든지)" class="flex-1 bg-transparent text-[13px] text-[#2D3436] placeholder-[#9AA5A9] focus:outline-none resize-none leading-snug">${esc(state.draftInput)}</textarea>
                <button type="button" data-action="send-emotion" class="w-9 h-9 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white flex items-center justify-center shrink-0 shadow-sm font-bold text-sm">
                  ↑
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // 우리 온도 탭을 열 때 한 번: 36.5°C에서 출발해 살짝 넘쳤다가 지금 온도에 멈춤 (약 1.2초)
      // v11.5: 화면 표시는 실제 온도 30~45도 그대로 (45도가 최고). 구간은 소수점 버린 온도로 정한다.
      const TEMP_MIN = 30, TEMP_MAX = 45;
      function dispTemp(t) { const n = Number(t); return (Number.isFinite(n) ? n : 36.5).toFixed(1); }
      const TEMP_BANDS = [
        { min: 44, name: '뜨거워요', line: '서로 먼저 움직이는 사이예요.' },
        { min: 41, name: '포근해요', line: '서운해도 "그럴 수 있지"가 먼저 나와요.' },
        { min: 38, name: '따뜻해요', line: '고마움이 오가기 시작했어요.' },
        { min: 35, name: '미지근해요', line: '마음은 있는데 말로 덜 꺼내고 있어요.' },
        { min: 30, name: '서먹해요', line: '아직 서로를 데울 시간이 필요해요. 고마움 하나부터 시작해 봐요.' }
      ];
      function tempBand(t) { const d = Math.floor(Number(t)); return TEMP_BANDS.find((b) => d >= b.min) || TEMP_BANDS[TEMP_BANDS.length - 1]; }
      function tempPct(t) { return Math.min(100, Math.max(0, ((Number(t) - TEMP_MIN) / (TEMP_MAX - TEMP_MIN)) * 100)); }
      function warmthPct(t) {
        return Math.min(100, Math.max(3, tempPct(t)));
      }

      let lastRenderedTab = '';
      let warmthMotion = null;

      function warmthFrame(elapsed, from) {
        const target = shownTemp();
        const START = from == null ? 36.5 : from, RISE = 800, TOTAL = 1200;
        const dir = target >= START ? 1 : -1;
        const peak = target + dir * Math.min(0.6, Math.max(0.2, Math.abs(target - START) * 0.1));
        let value, wobble = 0;
        if (elapsed < RISE) {
          const k = 1 - Math.pow(1 - elapsed / RISE, 3);
          value = START + (peak - START) * k;
        } else {
          const u = Math.min(1, (elapsed - RISE) / (TOTAL - RISE));
          value = peak + (target - peak) * (0.5 - Math.cos(Math.PI * u) / 2);
          wobble = Math.sin(u * Math.PI * 3) * (1 - u) * 1.5;
        }
        return { value: value, width: Math.min(100, Math.max(0, warmthPct(value) + wobble)) };
      }

      function paintWarmth(elapsed, from, sel) {
        const num = document.querySelector(sel ? sel.num : '[data-warmth-num]');
        const bar = document.querySelector(sel ? sel.bar : '[data-warmth-bar]');
        if (!num || !bar) return false;
        if (elapsed >= 1200) {
          num.textContent = dispTemp(shownTemp()) + '°C';
          bar.style[bar.dataset.warmthAxis === 'y' ? 'height' : 'width'] = warmthPct(shownTemp()) + '%';
          return false;
        }
        const f = warmthFrame(elapsed, from);
        num.textContent = dispTemp(f.value) + '°C';
        bar.style[bar.dataset.warmthAxis === 'y' ? 'height' : 'width'] = f.width + '%';
        return true;
      }

      function startWarmthMotion() {
        if (warmthMotion) cancelAnimationFrame(warmthMotion);
        warmthMotion = null;
        let reduce = false;
        try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_e) {}
        if (reduce) return;
        const t0 = performance.now();
        if (!paintWarmth(0)) return;
        const step = () => {
          warmthMotion = null;
          if (state.activeTab !== 'warmth') return;
          if (paintWarmth(performance.now() - t0)) warmthMotion = requestAnimationFrame(step);
        };
        warmthMotion = requestAnimationFrame(step);
      }

      // v10.4: 고마움을 보낸 뒤 오늘의 미션 상단 온도에 같은 1.2초 모션 (이전 온도 -> 새 온도)
      let bumpMotion = null;
      const MISSION_WARMTH = { num: '[data-mission-warmth-num]', bar: '[data-mission-warmth-bar]' };
      function startWarmthBump(from) {
        if (bumpMotion) cancelAnimationFrame(bumpMotion);
        bumpMotion = null;
        let reduce = false;
        try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_e) {}
        if (reduce || tempOn() || !(state.warmthTemp > from)) return;
        const bar = document.querySelector(MISSION_WARMTH.bar);
        if (bar) bar.style.transitionDuration = '0s';
        const t0 = performance.now();
        if (!paintWarmth(0, from, MISSION_WARMTH)) return;
        const step = () => {
          bumpMotion = null;
          if (state.activeTab !== 'missions') return;
          if (paintWarmth(performance.now() - t0, from, MISSION_WARMTH)) bumpMotion = requestAnimationFrame(step);
          else { const b = document.querySelector(MISSION_WARMTH.bar); if (b) b.style.transitionDuration = ''; }
        };
        bumpMotion = requestAnimationFrame(step);
      }

      function renderWarmthTab() {
        const mySent = (state.chats[state.role] || []).filter((m) => m.sent);
        return `
          <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4">
            <div class="bg-white rounded-3xl px-5 py-5 border border-[#FF8A80]/20 shadow-sm flex items-center gap-3" data-warmth-card>
              <div class="relative shrink-0 w-[64px] h-[230px]" aria-hidden="true" data-warmth-thermo>
                <div class="absolute left-[10px] top-0 bottom-[30px] w-4 bg-[#FFF0EE] rounded-t-full overflow-hidden">
                  <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-[#FF8A80] from-[8px] to-[#FFAB91] rounded-t-full" data-warmth-bar data-warmth-axis="y" style="height:${warmthPct(shownTemp())}%"></div>
                </div>
                <div class="absolute bottom-0 left-0 w-[36px] h-[36px] rounded-full bg-[#FF8A80]"></div>
                ${[30, 35, 38, 41, 44, 45].map((v) => `<span class="absolute left-[34px] translate-y-1/2 text-[10px] leading-none text-[#B2BEC3]" style="bottom:${30 + 2 * tempPct(v)}px" data-warmth-tick>${v}</span>`).join('')}
              </div>
              <div class="flex-1 min-w-0 text-center">
                <p class="text-xs font-bold text-[#FF8A80]">우리사이 온도</p>
                <p class="mt-2 flex items-baseline justify-center gap-1.5 whitespace-nowrap"><span class="text-[48px] leading-none font-extrabold text-[#2D3436]" data-warmth-num>${dispTemp(shownTemp())}°C</span><span class="text-sm font-extrabold text-[#E0665B]" data-warmth-band>${esc(tempBand(dispTemp(shownTemp())).name)}</span></p>
                ${tempDaysLeft() > 0 ? `<p class="text-xs text-[#636E72] mt-2" data-temp-next>다음 측정까지 ${tempDaysLeft()}일</p>` : ''}
              </div>
            </div>

            ${renderTempTabCard()}
            ${renderComboTabCard()}
            ${renderReportTabCard()}

            <div class="bg-white rounded-2xl p-4 border border-[#2D3436]/8 shadow-sm space-y-3">
              <p class="text-xs font-bold text-[#2D3436]">우리 커플 초대 코드</p>
              <p class="text-[11px] text-[#9AA5A9]">${state.partnerJoined ? '두 분이 연결된 코드예요. 다른 사람은 들어올 수 없어요.' : '연인이 카카오로 로그인한 뒤 이 코드를 입력하면 연결돼요.'}</p>
              <div class="flex items-center justify-between text-xs">
                <span class="font-mono font-extrabold text-base text-[#2D3436] tracking-wider">${esc(state.coupleCode)}</span>
                <button type="button" data-action="copy-code" class="px-3 py-1.5 rounded-lg bg-[#FFF9F5] border border-[#FF8A80]/30 text-[11px] font-bold text-[#E0665B]">복사</button>
              </div>
            </div>

            ${renderQuizTabCard()}

            <div class="bg-white rounded-2xl p-4 border border-[#2D3436]/8 shadow-sm">
              <h3 class="text-xs font-extrabold text-[#2D3436] mb-2">내가 보낸 다정함 신호 (${mySent.length}건)</h3>
              ${mySent.length === 0 ? `<p class="text-xs text-[#9AA5A9]">아직 보낸 신호가 없어요. 사이봇 탭에서 속마음을 털어놓아 보세요.</p>` : mySent.map((s) => {
                const d = s.drafts[s.draftIdx || 0];
                return `<div class="py-2 border-t border-[#2D3436]/5 first:border-t-0 text-xs">
                  <p class="font-bold text-[#FF8A80]">${esc(d.title)}</p>
                  <p class="text-[#4A5568] mt-0.5">${esc(d.message)}</p>
                </div>`;
              }).join('')}
            </div>
          </div>
        `;
      }

      // v10: 우리 온도 탭 — 우리 조합 카드 (리포트 히어로 바로 아래)
      function renderComboTabCard() {
        if (!state.partnerJoined) return '';
        const left = COMBO_MIN_MISSIONS - state.completedCount;
        return `
            <div class="bg-white rounded-2xl p-4 border border-[#2D3436]/8 shadow-sm space-y-3">
              <div>
                <p class="text-xs font-bold text-[#2D3436]">우리 둘은 어떤 조합일까요?</p>
                <p class="text-[11px] text-[#9AA5A9] mt-1">${left > 0 ? `미션 ${left}번만 더 하면 우리 조합이 나와요` : '함께한 미션으로 두 분 조합을 알려드려요.'}</p>
              </div>
              ${left > 0 ? `
                <button type="button" data-action="switch-tab" data-tab="missions" class="w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all">오늘의 미션 하러 가기</button>
              ` : `
                <button type="button" data-action="open-combo" class="w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all">우리 조합 보기</button>
              `}
            </div>`;
      }

      // ---- v11.3: 우리사이 온도 (무료) ----
      // 두 사람이 따로 10문항을 푼다. 온도·부분 온도·설명은 서버(my_temp / submit_temp)가 정해서 보내 준다 — 앱은 답 배열이나
      // 고마움·미션 개수를 받지 않는다. 측정은 14일에 한 번 (서버가 막는다). 고마움·미션은 다음 측정 때 한 번에 반영된다.
      // my_temp: {status: 'not_started' | 'waiting' | 'done', days_left, next_on, last: null | {total, measured_on, areas: [{key, label, temp, why, todo}]}}
      // 문항 출처: 『긍정학개론』 — 고마움(1-2), 그럴 수 있지(3-5), 고정관념 내려놓기(6-8), 책임(9-10). 순서를 바꾸면 SQL의 v_map도 같이 바꿔야 한다.
      // v11.5 문항: v11-4 문항에서 출발, 『긍정학개론』 개념이 안 보이던 2·3·5·8번만 다듬었다. 보기 3개(0번이 가장 따뜻한 쪽)와
      // 순서 = 영역 매핑(SQL v_map)은 그대로라 서버 변경 없음.
      const TEMP_QS = [
        { t: 'gr', q: '연인이 해 준 작은 일, 고맙다고 말해요?', o: ['바로 말해요', '마음속으로만 해요', '잘 안 하게 돼요'] },
        { t: 'gr', q: '요즘 연인에게 "네 덕분이야"라고 말해요?', o: ['자주 말해요', '마음속으로만 해요', '덕분인 일이 잘 안 떠올라요'] },
        { t: 'ok', q: '연인 답장이 늦을 때, 내가 고르는 생각은?', o: ['"그럴 수 있지" 하고 넘겨요', '신경 쓰이지만 기다려요', '계속 마음에 걸려요'] },
        { t: 'ok', q: '약속에 연인이 늦으면?', o: ['그럴 수 있지, 웃으며 맞아요', '한마디는 하게 돼요', '하루 기분이 가라앉아요'] },
        { t: 'ok', q: '서운한 마음, 얼마나 붙잡고 있어요?', o: ['금방 내려놓아요', '하루쯤 붙잡고 있어요', '며칠 동안 남아 있어요'] },
        { t: 'op', q: '"연인이라면 당연히 ~해야지" 생각, 자주 해요?', o: ['거의 안 해요', '가끔 해요', '자주 해요'] },
        { t: 'op', q: '연인이 나와 다르게 생각하면?', o: ['다를 수 있지, 그대로 인정해요', '이해될 때까지 따져 봐요', '내 생각이 맞다고 느껴요'] },
        { t: 'op', q: '연인 앞에서 "내가 해 봐서 아는데" 하는 마음이 들어요?', o: ['거의 안 들어요', '가끔 들어요', '자주 들어요'] },
        { t: 'ac', q: '우리 사이에 문제가 생기면 먼저 보는 곳은?', o: ['내가 바꿀 수 있는 것', '둘 다 반반', '연인이 바뀌어야 할 것'] },
        { t: 'ac', q: '마음을 어떻게 보여 줘요?', o: ['작은 행동으로 자주', '특별한 날에 몰아서', '말 안 해도 알 거라 생각해요'] }
      ];
      function tempOn() { return Boolean(state.temp); }
      function tempLast() {
        const l = state.temp && state.temp.last;
        return l && Number.isFinite(Number(l.total)) && Array.isArray(l.areas) ? l : null;
      }
      // 홈 온도계 숫자: 잰 적이 있으면 마지막 측정 온도, 없으면 예전 다정함 온도 그대로 (첫 측정 전에 갑자기 내려가지 않게)
      function shownTemp() { const l = tempLast(); return l ? Number(l.total) : state.warmthTemp; }
      function tempDaysLeft() {
        if (!tempLast()) return 0;
        const d = Math.floor(Number(state.temp.days_left));
        return Number.isFinite(d) && d > 0 ? Math.min(60, d) : 0;
      }
      function tempNextLabel() {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String((state.temp && state.temp.next_on) || ''));
        return m ? Number(m[2]) + '월 ' + Number(m[3]) + '일' : '';
      }

      let tempCheckedAt = 0;
      // 서버 상태 새로고침. 함수가 아직 없으면(SQL 적용 전) null → 카드가 안 보인다. 바뀌었으면 true
      async function refreshTemp(force) {
        if (state.phase !== 'ready' || !state.partnerJoined) return false;
        if (!force && Date.now() - tempCheckedAt < 15000) return false;
        tempCheckedAt = Date.now();
        const before = JSON.stringify(state.temp);
        const f = await sbFetchQuiet('rpc/my_temp', { method: 'POST', body: '{}' });
        if (f && typeof f === 'object' && !Array.isArray(f) && typeof f.status === 'string') state.temp = f;
        if (state.tempView === 'wait' && state.temp && state.temp.status === 'done') state.tempView = 'result';
        let moved = false;
        // 처음 온 커플은 온도부터 잰다: 한 번만 우리 온도 탭으로 데려간다
        if (state.temp && !tempLast() && state.temp.status === 'not_started' && state.activeTab !== 'warmth') {
          const k = 'urisai_temp_intro_' + (state.coupleCode || '');
          try { if (!localStorage.getItem(k)) { localStorage.setItem(k, '1'); state.activeTab = 'warmth'; moved = true; } } catch (_e) {}
        }
        return moved || before !== JSON.stringify(state.temp);
      }

      // 비밀방 글쓴이 본인 미션 (상대 피드에는 없다). 일반 미션과 같은 모양으로 피드에 섞는다.
      function selfToMission(r) {
        return { id: String(r.id), targetRole: state.role, title: String(r.title || ''), badge: String(r.badge || ''), message: String(r.message || ''),
          time: '도착함', accepted: Boolean(r.accepted), createdAt: r.created_at || null, acceptedAt: r.accepted_at || null, self: true };
      }
      let selfCheckedAt = 0;
      async function refreshSelfMissions() {
        if (state.phase !== 'ready' || !state.partnerJoined || !tempOn()) return false;
        if (Date.now() - selfCheckedAt < 15000) return false;
        selfCheckedAt = Date.now();
        const rows = await sbFetchQuiet('rpc/my_self_missions', { method: 'POST', body: '{}' });
        if (!Array.isArray(rows)) return false;
        const before = JSON.stringify((state.selfMissions || []).map((m) => [m.id, m.accepted]));
        const busy = {};
        (state.selfMissions || []).forEach((m) => { if (m.accepting) busy[m.id] = m; });
        state.selfMissions = rows.slice(0, 30).map((r) => busy[r.id] || selfToMission(r));
        return before !== JSON.stringify(state.selfMissions.map((m) => [m.id, m.accepted]));
      }
      async function addSelfMission() {
        if (!tempOn()) return;
        try {
          const r = await rpc('create_self_mission', {});
          if (r && r.id && !(state.selfMissions || []).some((m) => m.id === r.id)) {
            state.selfMissions = [selfToMission(r)].concat(state.selfMissions || []);
            render();
          }
        } catch (_e) {}
      }
      // v11.5 상대 미션 알림: 이름 + 날짜만 온다 (미션 내용 없음). RPC가 없으면(SQL 적용 전) null → 카드 안 보임.
      let heartCheckedAt = 0;
      async function refreshHeartNotices(force) {
        if (state.phase !== 'ready' || !state.partnerJoined) return false;
        if (!force && Date.now() - heartCheckedAt < 15000) return false;
        heartCheckedAt = Date.now();
        const rows = await sbFetchQuiet('rpc/my_heart_notices', { method: 'POST', body: '{}' });
        const next = Array.isArray(rows) ? rows.slice(0, 20).map((r) => ({ id: String(r.id || ''), name: String(r.name || ''), doneOn: String(r.done_on || ''), hearted: Boolean(r.hearted) })) : null;
        const changed = JSON.stringify(next) !== JSON.stringify(state.heartNotices || null);
        state.heartNotices = next;
        return changed;
      }
      function renderHeartNotice() {
        const n = (state.heartNotices || []).find((x) => x.id && !x.hearted);
        if (!n) return '';
        const today = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
        const when = n.doneOn === today ? '오늘' : '어제';
        return `
            <div class="animate-pop bg-white rounded-2xl p-4 border border-[#FF8A80]/30 shadow-sm space-y-3" data-heart-notice>
              <p class="text-sm font-extrabold text-[#2D3436]">${esc((n.name || state.partnerName || '연인') + '님이 ' + when + ' 온도 미션을 했어요 💛')}</p>
              <button type="button" data-action="send-heart" data-id="${esc(n.id)}" class="w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all">하트 보내기</button>
            </div>`;
      }
      function withSelfMissions(list) {
        const mine = state.selfMissions || [];
        if (!mine.length) return list;
        const ts = (m) => { const t = Date.parse(m.createdAt || ''); return Number.isFinite(t) ? t : Number.MAX_SAFE_INTEGER; };
        return list.concat(mine).sort((x, y) => ts(y) - ts(x));
      }

      // 우리 온도 탭 — 온도계 카드 바로 아래
      function renderTempTabCard() {
        if (!state.partnerJoined || !state.temp) return '';
        const done = state.temp.status === 'done';
        const label = done ? (tempNextLabel() ? tempNextLabel() + '에 다시 재요' : '측정 완료') : (tempLast() && state.temp.status === 'not_started' ? '다시 재 보기' : '같이 재 보기');
        const cls = done
          ? 'w-full py-2.5 rounded-xl bg-[#EEF1F2] text-[#9AA5A9] text-xs font-extrabold transition-all'
          : 'w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all';
        return `
            <div class="bg-white rounded-2xl p-4 border border-[#2D3436]/8 shadow-sm space-y-3">
              <p class="text-xs font-bold text-[#2D3436]">온도 재기</p>
              <p class="text-[12px] text-[#636E72] leading-relaxed -mt-1.5" data-temp-explain>『긍정학개론』의 네 가지 힘으로 우리 사이를 재요. 둘이 따로 10문항씩 풀어요. (최고 45도)</p>
              <button type="button" data-action="open-temp" data-temp-state="${esc(state.temp.status)}" class="${cls}">${esc(label)}</button>
            </div>`;
      }

      // 서로 맞히기(quiz.html)와 같은 화면: 한 화면에 한 문항, 위에 진행 막대
      function tempProgress(n) {
        const total = TEMP_QS.length;
        return `
                  <div class="space-y-1.5">
                    <div class="flex items-center justify-end"><span class="text-[11px] font-bold text-[#E0665B]">${n}/${total}</span></div>
                    <div class="w-full h-2.5 bg-[#FFF0EE] rounded-full overflow-hidden">
                      <div class="h-full bg-gradient-to-r from-[#FFAB91] to-[#FF8A80] rounded-full transition-all duration-300" style="width:${Math.round((n / total) * 100)}%"></div>
                    </div>
                  </div>`;
      }

      function renderTempScreen() {
        const v = state.tempView;
        const CARD = 'bg-white rounded-3xl p-5 border border-[#FF8A80]/15 shadow-[0_8px_28px_rgba(45,52,54,0.06)] animate-pop';
        // 앱의 다른 버튼과 같은 모양 (분홍 그림자 없음)
        const PRIMARY = 'w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all';
        let inner = '';
        if (v === 'question') {
          const i = Math.min(state.tempIdx || 0, TEMP_QS.length - 1);
          const item = TEMP_QS[i];
          inner = `
                <div class="${CARD} space-y-4">
                  ${tempProgress(i + 1)}
                  ${(() => {
                    const ORDER = ['gr', 'ok', 'op', 'ac'];
                    const cur = ORDER.indexOf(item.t);
                    const firstOfArea = i === 0 || TEMP_QS[i - 1].t !== item.t;
                    const intro = SAIBOT_LINES.tempArea[item.t];
                    const bubble = (inner, attr) => `<div class="bg-white rounded-2xl rounded-tl-sm px-3.5 py-3 border border-[#FF8A80]/15 shadow-sm" ${attr || ''}>${inner}</div>`;
                    return `
                  <div class="flex items-center gap-2.5" data-temp-checklist>
                    <img src="${AVATAR_SRC}" alt="사이봇" class="w-11 h-11 rounded-2xl object-cover border border-[#FF8A80]/30 shrink-0" />
                    <div class="flex-1 grid grid-cols-4 gap-1">
                      ${ORDER.map((t, k) => `<span class="text-center rounded-lg py-1 text-[10.5px] font-bold border whitespace-nowrap ${k < cur ? 'bg-[#E8F8F0] text-[#1E8449] border-[#1E8449]/15' : k === cur ? 'bg-[#FFF0EE] text-[#E0665B] border-[#FF8A80]/40' : 'bg-white text-[#B2BEC3] border-[#2D3436]/8'}" data-temp-check="${k < cur ? 'done' : k === cur ? 'now' : 'todo'}">${k < cur ? '✓ ' : ''}${esc(AREA_NAMES[AREA_BY_T[t]].replace(/ 온도$/, ''))}</span>`).join('')}
                    </div>
                  </div>
                  <div class="space-y-1.5" data-temp-bubbles>
                    ${i === 0 ? bubble(`<p class="text-[13px] text-[#2D3436] leading-relaxed">${esc(SAIBOT_LINES.tempStart)}</p>`, 'data-temp-start') : ''}
                    ${firstOfArea && intro ? bubble(`<p class="text-[13px] text-[#4A5568] leading-relaxed">${esc(intro.line)}</p>${intro.book ? '<p class="text-[11px] text-[#9AA5A9] mt-0.5" data-temp-cite>도서 『긍정학개론』 중에서</p>' : ''}`, 'data-temp-intro="' + item.t + '"') : ''}
                    ${bubble(`<h2 class="text-[16px] font-extrabold text-[#2D3436] leading-snug">${esc(item.q)}</h2>`, 'data-temp-question')}
                  </div>`;
                  })()}
                  <div class="space-y-2.5">
                    ${item.o.map((label, k) => `<button type="button" data-action="temp-answer" data-i="${k}" class="w-full py-3.5 px-4 rounded-2xl bg-[#FFF9F5] active:bg-[#FFF0EE] border border-[#FF8A80]/30 text-sm font-bold text-[#2D3436] transition-colors">${esc(label)}</button>`).join('')}
                  </div>
                </div>`;
        } else if (v === 'wait') {
          inner = `
                <div class="h-6"></div>
                <div class="${CARD} space-y-5">
                  ${tempProgress(TEMP_QS.length)}
                  <h2 class="text-lg font-extrabold text-[#2D3436] text-center pt-1">${esc((state.partnerName || '연인') + '님이 풀면 결과가 열려요')}</h2>
                  <button type="button" data-action="temp-send" class="${PRIMARY}">카톡으로 보내기</button>
                </div>`;
        } else if (v === 'result' && tempLast()) {
          const l = tempLast();
          const area = (a) => {
            const t = Number(a.temp);
            return `
                    <div class="rounded-2xl bg-[#FFF9F5] border border-[#FF8A80]/20 p-3.5 text-left" data-temp-area>
                      <div class="flex items-center justify-between">
                        <p class="text-[11px] font-bold text-[#FF8A80]">${esc(areaLabel(a))}</p>
                        <p class="text-sm font-extrabold text-[#2D3436] whitespace-nowrap">${AREA_HINTS[a.key] ? `<span class="text-[10px] font-bold text-[#9AA5A9] mr-1.5" data-area-hint>${esc(AREA_HINTS[a.key])}</span>` : ''}${Number.isFinite(t) ? dispTemp(t) : '-'}°C</p>
                      </div>
                      <div class="mt-1.5 w-full h-1.5 bg-[#FFF0EE] rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-[#FFAB91] to-[#FF8A80] rounded-full" style="width:${warmthPct(Number.isFinite(t) ? t : 35)}%"></div>
                      </div>
                      <p class="text-[13px] text-[#4A5568] leading-relaxed mt-2">${esc(a.why)}</p>
                      ${a.cite ? `<p class="text-[12px] text-[#9AA5A9] mt-0.5" data-temp-cite>${esc(a.cite)}</p>` : ''}
                      <p class="text-[11px] font-bold text-[#FF8A80] mt-2.5">이번에 해 볼 일</p>
                      <p class="text-sm font-extrabold text-[#2D3436] mt-0.5">${esc(a.todo)}</p>
                    </div>`;
          };
          const pay = reportVisible() && !state.report.paid ? renderPayArea() : '';
          inner = `
                <div class="${CARD} space-y-3.5 text-center">
                  <p class="pt-2 flex items-baseline justify-center gap-2 whitespace-nowrap"><span class="text-5xl font-extrabold text-[#2D3436]" data-temp-total>${dispTemp(l.total)}°C</span><span class="text-base font-extrabold text-[#E0665B]" data-temp-band>${esc(tempBand(dispTemp(l.total)).name)}</span></p>
                  <p class="text-[13px] text-[#4A5568] leading-relaxed -mt-1.5" data-temp-band-line>${esc(tempBand(dispTemp(l.total)).line)}</p>
                  <div class="rounded-2xl border border-[#FF8A80]/20 overflow-hidden text-left" data-temp-scale>
                    ${TEMP_BANDS.map((b, i) => { const hi = i === 0 ? TEMP_MAX : TEMP_BANDS[i - 1].min - 1; const on = tempBand(dispTemp(l.total)) === b; return `
                    <div class="flex items-start gap-2.5 px-3 py-2 ${i ? 'border-t border-[#FF8A80]/10' : ''} ${on ? 'bg-[#FFF0EE]' : 'bg-white'}" data-temp-scale-row>
                      <span class="shrink-0 w-[52px] text-[11px] font-bold text-[#FF8A80] pt-px">${b.min}~${hi}도</span>
                      <span class="shrink-0 w-[64px] text-[12px] font-extrabold text-[#2D3436]">${esc(b.name)}</span>
                      <span class="text-[12px] text-[#636E72] leading-snug">${esc(b.line)}</span>
                    </div>`; }).join('')}
                  </div>
                  ${l.areas.slice(0, 4).map(area).join('')}
                </div>
                <button type="button" data-action="temp-share" class="${PRIMARY}">친구 커플에게 보내기</button>
                ${pay}`;
        }
        return `
            <div class="fixed inset-0 z-50 bg-[#FFF9F5] flex flex-col overflow-y-auto" data-temp-screen>
              <header class="shrink-0 bg-[#FFF9F5] border-b border-[#FF8A80]/15 px-4 pb-3 safe-top flex items-center justify-between">
                <span class="text-base font-extrabold text-[#2D3436]">우리사이 온도</span>
                <button type="button" data-action="close-temp" class="text-sm font-bold text-[#636E72] px-2 py-1">닫기</button>
              </header>
              <div class="flex-1 px-5 py-6 safe-bottom flex flex-col gap-4">${inner}</div>
            </div>`;
      }

      function tempAppUrl() { return location.origin + location.pathname; }

      // v10: 우리 온도 탭 — 서로 맞히기 테스트 (연인 코드 카드 아래)
      function renderQuizTabCard() {
        if (!state.partnerJoined) return '';
        return `
            <div class="bg-white rounded-2xl p-4 border border-[#2D3436]/8 shadow-sm space-y-3">
              <div>
                <p class="text-xs font-bold text-[#2D3436]">연인은 나를 얼마나 알까요?</p>
                <p class="text-[11px] text-[#9AA5A9] mt-1">10문제로 맞혀 보고, 친구 커플이랑 점수를 겨뤄 봐요.</p>
              </div>
              <button type="button" data-action="open-quiz" class="w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all">친구 커플이랑 맞히기 대결</button>
            </div>`;
      }

      // v10: 미션 탭 — 연인이 보낸 공유 동의 요청
      function renderConsentRequestCard() {
        const c = state.shareConsent;
        if (!c || c.status !== 'pending' || c.requested_by_me) return '';
        return `
            <div class="animate-pop bg-white rounded-2xl p-4 border border-[#FF8A80] ring-2 ring-[#FF8A80]/15 shadow-[0_4px_16px_rgba(45,52,54,0.05)]">
              <button type="button" data-action="open-combo" class="w-full text-left text-[15px] font-extrabold text-[#2D3436]">${esc((c.requester_name || state.partnerName) + '님이 우리 조합 카드를 올리고 싶대요 💌')}</button>
              ${consentAnswerButtons(c)}
            </div>`;
      }

      function consentAnswerButtons(c) {
        return `
              <div class="mt-3.5 pt-3 border-t border-[#2D3436]/5 flex gap-2">
                <button type="button" data-action="respond-share" data-id="${esc(c.id)}" data-accept="1" class="flex-1 py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all">좋아요</button>
                <button type="button" data-action="respond-share" data-id="${esc(c.id)}" data-accept="0" class="flex-1 py-2.5 rounded-xl bg-white border border-[#FF8A80]/30 text-[#E0665B] text-xs font-extrabold">둘만 볼래요</button>
              </div>`;
      }

      function renderComboModal() {
        const c = state.shareConsent;
        let action = '';
        if (c && c.status === 'accepted') {
          action = `
                <p class="text-sm font-extrabold text-[#2D3436] text-center">둘 다 좋대요! 이제 올릴 수 있어요 ✨</p>
                <div>
                  <button type="button" data-action="share-combo-story" class="w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all">스토리에 올리기</button>
                  <p class="text-[11px] text-[#9AA5A9] text-center mt-1.5">공유 창이 뜨면 인스타그램을 골라 스토리에 올려 주세요.</p>
                </div>
                <button type="button" data-action="share-combo-kakao" class="w-full py-2.5 rounded-xl bg-white border border-[#FF8A80]/30 text-[#E0665B] text-xs font-extrabold">카톡으로 보내기</button>`;
        } else if (c && c.status === 'pending' && !c.requested_by_me) {
          action = `
                <p class="text-sm font-extrabold text-[#2D3436] text-center">${esc((c.requester_name || state.partnerName) + '님이 우리 조합 카드를 올리고 싶대요 💌')}</p>
                ${consentAnswerButtons(c)}`;
        } else {
          const pending = c && c.status === 'pending';
          action = `
                ${c && c.status === 'declined' ? '<p class="text-xs font-bold text-[#636E72] text-center leading-relaxed">이번 건 둘만 보기로 했어요. 카드는 사랑의 온도계 탭에 그대로 있어요.</p>' : ''}
                <button type="button" data-action="request-share" ${pending ? 'disabled' : ''} class="w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all ${pending ? 'opacity-60' : ''}">올려도 될지 물어보기</button>`;
        }
        return `
            <div class="fixed inset-0 z-50 bg-[#2D3436]/45 flex items-end sm:items-center justify-center p-4">
              <div class="bg-white rounded-3xl w-full max-w-[400px] p-5 shadow-2xl max-h-[92vh] overflow-y-auto space-y-3.5">
