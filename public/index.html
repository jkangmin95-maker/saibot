      function detectCategory(text) {
        const s = text.toLowerCase();
        if (/폰|스마트폰|핸드폰|휴대폰|유튜브|인스타|릴스|게임|화면|만 보|만봐/.test(s)) return 'phone';
        if (/연락|답장|읽씹|카톡|톡|전화|바빠|바쁘|바쁨|무소식|기다리/.test(s)) return 'contact';
        if (/표현|사랑|좋아|예쁘|애정|스킨십|안아|고마|관심|무심|외로/.test(s)) return 'affection';
        if (/데이트|코스|계획|약속|주말|식당|카페|매번 나만|맨날 나만/.test(s)) return 'date';
        if (/말투|짜증|화내|차가|무뚝뚝|단답|퉁명|상처|예민/.test(s)) return 'tone';
        return 'default';
      }

      function nowStr() {
        const d = new Date();
        const h = d.getHours();
        const m = String(d.getMinutes()).padStart(2, '0');
        return (h >= 12 ? '오후 ' : '오전 ') + (h % 12 || 12) + ':' + m;
      }

      function welcomeChat(id) {
        return [{ id: id, sender: 'bot', type: 'welcome', text: '안녕하세요, 사이봇이에요! 오늘 연인이랑 있었던 일, 서운했던 점, 고민 뭐든 편하게 얘기해 주세요. 여기 대화는 연인에게 절대 보이지 않아요 🤫', time: '방금 전' }];
      }

      function defaultState() {
        return {
          // 'loading' | 'signedOut' | 'needCouple' | 'ready'
          phase: 'loading',
          joinMode: false,
          busy: false,
          userId: '',
          kakaoName: '',
          onboarded: false,
          myName: '',
          partnerName: '연인',
          partnerJoined: false,
          role: 'A', // 서버가 자동으로 정해줌: 코드를 만든 사람 A, 들어온 사람 B
          coupleCode: '',
          activeTab: 'saibot', // 'missions' | 'saibot' | 'warmth'
          warmthTemp: 37.5,
          completedCount: 0,
          missions: [],
          chats: { A: welcomeChat('w-a'), B: welcomeChat('w-b') },
          draftInput: '',
          showSettings: false,
          showLogoutConfirm: false,
          showInstallGuide: false
        };
      }

      // 사이봇 비밀방 대화는 이 기기에만 저장 (카카오 계정별로 분리)
      function localKey() {
        return state.userId ? STORAGE_PREFIX + state.userId : '';
      }

      function loadLocalForUser() {
        const key = localKey();
        if (!key) return;
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (saved && saved.chats) state.chats = Object.assign({ A: welcomeChat('w-a'), B: welcomeChat('w-b') }, saved.chats);
          if (saved && saved.activeTab) state.activeTab = saved.activeTab;
          if (saved && Array.isArray(saved.missions)) state.missions = saved.missions;
        } catch (_e) {}
      }

      // Old v1-v7 anonymous storage is no longer used.
      try {
        localStorage.removeItem('urisai_mobile_state_v1');
        localStorage.removeItem('urisai_last_couple_code');
        sessionStorage.removeItem('urisai_mobile_state_v1');
      } catch (_e) {}

      let state = defaultState();
      let syncTimer = null;
      let sendingEmotion = false;

      const sb = (window.supabase && window.supabase.createClient)
        ? window.supabase.createClient(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' }
          })
        : null;

      function saveState() {
        const key = localKey();
        if (!key) return;
        try {
          localStorage.setItem(key, JSON.stringify({ chats: state.chats, activeTab: state.activeTab, missions: state.missions }));
        } catch (_e) {}
      }

      function hideToast() {
        const el = document.getElementById('toast');
        if (!el) return;
        el.classList.add('hidden');
        clearTimeout(el._t);
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.add('hidden'), 2600);
      }

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Supabase REST 헬퍼 (설정된 경우에만 호출)
      async function accessToken() {
        if (!sb) return '';
        try {
          const r = await sb.auth.getSession();
          return (r && r.data && r.data.session && r.data.session.access_token) || '';
        } catch (_e) {
          return '';
        }
      }

      async function sbFetch(path, options) {
        const token = await accessToken();
        if (!token) {
          const err = new Error('not-signed-in');
          err.status = 401;
          throw err;
        }
        const base = DEFAULT_SUPABASE_URL;
        const extra = options || {};
        const headers = Object.assign({
          apikey: DEFAULT_SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + token,
          'Content-Type': 'application/json',
          Prefer: 'return=representation'
        }, extra.headers || {});
        const res = await fetch(base + '/rest/v1/' + path, Object.assign({}, extra, { headers: headers }));
        if (!res.ok) {
          let msg = '';
          try { const j = await res.json(); msg = (j && (j.message || j.hint)) || ''; } catch (_e) {}
          const err = new Error(msg || 'save-failed');
          err.status = res.status;
          throw err;
        }
        const raw = await res.text();
        if (!raw) return [];
        return JSON.parse(raw);
      }

      async function sbFetchQuiet(path, options) {
        try {
          return await sbFetch(path, options);
        } catch (_e) {
          return null;
        }
      }

      function isUserTyping() {
        const el = document.activeElement;
        return el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT');
      }

      function mergeRemoteMissions(rows) {
        const remote = (rows || []).map((r) => ({
          id: r.id,
          targetRole: r.target_role,
          title: r.title,
          badge: r.badge,
          message: r.message,
          time: '도착함',
          accepted: Boolean(r.accepted)
        }));
        const remoteIds = new Set(remote.map((m) => m.id));
        const localById = {};
        (state.missions || []).forEach((m) => { localById[m.id] = m; });
        const merged = remote.map((r) => {
          const local = localById[r.id];
          return local && local.accepted && !r.accepted ? Object.assign({}, r, { accepted: true }) : r;
        });
        (state.missions || []).forEach((m) => {
          if (remoteIds.has(m.id)) return;
          if (String(m.id).indexOf('base-') === 0) return; // drop old demo cards
          const ts = Number(String(m.id).replace(/^m-/, ''));
          // keep only a mission just sent on this phone, not yet visible on the server
          if (ts && (Date.now() - ts) < 20000) merged.unshift(m);
        });
        return merged;
      }

      async function syncFromSupabase() {
        if (state.phase !== 'ready' || !state.coupleCode) return;
        const couples = await sbFetchQuiet('couples?code=eq.' + encodeURIComponent(state.coupleCode));
        let changed = false;
        if (couples && couples.length > 0) {
          const row = couples[0];
          const nextTemp = Number(row.warmth_temp);
          const nextCount = Number(row.completed_count);
          if (!Number.isNaN(nextTemp) && nextTemp !== state.warmthTemp) {
            state.warmthTemp = nextTemp;
            changed = true;
          }
          if (!Number.isNaN(nextCount) && nextCount !== state.completedCount) {
            state.completedCount = nextCount;
            changed = true;
          }
          const myFromServer = state.role === 'A' ? row.name_a : row.name_b;
          const partnerFromServer = state.role === 'A' ? row.name_b : row.name_a;
          if (myFromServer && myFromServer !== state.myName) {
            state.myName = myFromServer;
            changed = true;
          }
          if (partnerFromServer && partnerFromServer !== state.partnerName) {
            state.partnerName = partnerFromServer;
            changed = true;
          }
          const joined = Boolean(row.user_a && row.user_b);
          if (joined !== state.partnerJoined) {
            state.partnerJoined = joined;
            changed = true;
            if (joined) showToast('연인이 들어왔어요! 이제 서로 연결됐어요 💛');
          }
        }
        const rows = await sbFetchQuiet('daily_missions?couple_code=eq.' + encodeURIComponent(state.coupleCode) + '&order=created_at.desc');
        if (rows && Array.isArray(rows)) {
          const merged = mergeRemoteMissions(rows);
          const before = JSON.stringify((state.missions || []).map((m) => [m.id, m.accepted]));
          const after = JSON.stringify(merged.map((m) => [m.id, m.accepted]));
          if (before !== after) {
            state.missions = merged;
            changed = true;
          }
        }
        if (changed) {
          saveState();
          if (!isUserTyping()) render();
        }
      }

      function startSyncLoop() {
        if (syncTimer) clearInterval(syncTimer);
        if (state.phase === 'ready') {
          syncFromSupabase();
          syncTimer = setInterval(syncFromSupabase, 6000);
        }
      }

      async function saveNamesToServer() {
        const payload = state.role === 'A' ? { name_a: state.myName } : { name_b: state.myName };
        await sbFetch('couples?code=eq.' + encodeURIComponent(state.coupleCode), {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
      }

      async function rpc(name, args) {
        return sbFetch('rpc/' + name, { method: 'POST', body: JSON.stringify(args || {}) });
      }

      function applyCouple(c) {
        state.coupleCode = c.code;
        state.role = c.role === 'B' ? 'B' : 'A';
        const mine = state.role === 'A' ? c.name_a : c.name_b;
        const theirs = state.role === 'A' ? c.name_b : c.name_a;
        state.myName = mine || state.kakaoName || '나';
        state.partnerName = theirs || '연인';
        state.partnerJoined = Boolean(c.partner_joined);
        const t = Number(c.warmth_temp);
        if (!Number.isNaN(t)) state.warmthTemp = t;
        const n = Number(c.completed_count);
        if (!Number.isNaN(n)) state.completedCount = n;
        state.phase = 'ready';
        state.onboarded = true;
      }

        '안녕하세요! 오늘 연인이랑은 어떤 하루였어요? 좋았던 일도, 서운했던 일도 편하게 얘기해 주세요 😊',

      ];

      function pickVaried(list, avoid) {
        const pool = list.filter((x) => (avoid || []).indexOf(x) < 0);
        const from = pool.length ? pool : list;
        return from[Math.floor(Math.random() * from.length)];
      }

      function isSmallTalk(text) {
        const s = String(text || '').trim();
        if (s.length > 25) return false;
        return /^(안녕|하이|ㅎㅇ|헬로|hello|hi|반가|뭐해|누구|너는|넌|고마워|ㄱㅅ|ㅋㅋ|ㅎㅎ|테스트|test)/i.test(s);
      }

      function recentBotTexts(role) {
        return (state.chats[role] || []).filter((m) => m.sender === 'bot').slice(-6).map((m) => m.empathy || m.text || '');
      }

      function localFallback(text, role) {
        const recentTexts = recentBotTexts(role);
        if (isSmallTalk(text)) {
          return { empathy: pickVaried(SMALLTALK_REPLIES, recentTexts), drafts: [], draftIdx: 0, fallback: true };
        }
        const cat = detectCategory(text);
        const preset = NUDGE_LIBRARY[cat] || NUDGE_LIBRARY.default;
        const sentTitles = (state.missions || []).map((m) => m.title);
        (state.chats[role] || []).forEach((m) => {
          if (m.sent && m.drafts && m.drafts[m.draftIdx || 0]) sentTitles.push(m.drafts[m.draftIdx || 0].title);
        });
        let drafts = preset.drafts.filter((d) => sentTitles.indexOf(d.title) < 0);
        if (drafts.length < 2) drafts = preset.drafts.slice();
        drafts = drafts.slice().sort(() => Math.random() - 0.5);
        return {
          empathy: pickVaried(FALLBACK_EMPATHY[cat] || FALLBACK_EMPATHY.default, recentTexts),
          drafts: drafts,
          draftIdx: 0,
          fallback: true
        };
      }

      // 예전 버전의 고정 문구는 맥락에서 뺌 (AI가 따라 하지 않게)
      const PRESET_EMPATHY = new Set(Object.keys(NUDGE_LIBRARY).map((k) => NUDGE_LIBRARY[k].empathy));

      // 비밀방 대화 기록 → [{role:'user'|'bot', text}] (최근 10개)
      function chatHistory(role) {
        const out = [];
        (state.chats[role] || []).forEach((m) => {
          if (m.sender === 'user') out.push({ role: 'user', text: String(m.text || '').slice(0, 500) });
          else if (m.type === 'draft' && m.empathy && !m.fallback && !PRESET_EMPATHY.has(m.empathy)) out.push({ role: 'bot', text: String(m.empathy).slice(0, 500) });
        });
        return out.slice(-10);
      }

      async function rpcTimed(name, args, ms) {
        const token = await accessToken();
        if (!token) return { status: 401, data: null };
        const ctrl = new AbortController();
        const timer = setTimeout(function () { ctrl.abort(); }, ms);
        try {
          const res = await fetch(DEFAULT_SUPABASE_URL + '/rest/v1/rpc/' + name, {
            method: 'POST',
            headers: {
              apikey: DEFAULT_SUPABASE_ANON_KEY,
              Authorization: 'Bearer ' + token,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(args || {}),
            signal: ctrl.signal
          });
          let data = null;
          try { data = await res.json(); } catch (_e) {}
          return { status: res.status, data: data };
        } catch (_e) {
          return { status: 0, data: null };
        } finally {
          clearTimeout(timer);
        }
      }

      function missionDraft(title, message, i) {
        const badges = ['오늘의 데일리 미션', '다정함 리마인더', '커플 추천 팁'];
        return { title: String(title || '오늘의 다정함 미션').slice(0, 40), badge: badges[i % badges.length], message: String(message || '').slice(0, 300) };
      }

      async function askSaibot(text, role) {
        const clean = String(text || '').slice(0, 500);
        if (!state.coupleCode) return localFallback(clean, role);

        const r = await rpcTimed('sai_chat', { couple_code: state.coupleCode, messages: chatHistory(role) }, 25000);
        const d = r.data;
        if (r.status === 200 && d && typeof d.reply === 'string' && d.reply.trim()) {
          const drafts = (Array.isArray(d.missions) ? d.missions : [])
            .filter((m) => m && m.message)
            .slice(0, 3)
            .map((m, i) => missionDraft(m.title, m.message, i));
          return { empathy: d.reply.trim(), drafts: drafts, draftIdx: 0, ai: true };
        }

        // sai_chat 이 아직 없는 DB(v8)라면 예전 미션 생성기로
        const missing = r.status === 404 || (d && (d.code === 'PGRST202' || d.code === '42883'));
        if (missing && !isSmallTalk(clean)) {
          const g = await rpcTimed('generate_mission', { feeling: clean, couple_code: state.coupleCode }, 12000);
          const gd = g.data;
          if (g.status === 200 && gd && gd.empathy && gd.message) {
            const extra = localFallback(clean, role).drafts.slice(0, 2);
            return { empathy: gd.empathy, drafts: [missionDraft(gd.title, gd.message, 0)].concat(extra), draftIdx: 0, ai: true };
          }
        }
        return localFallback(clean, role);
      }

      function renderMissionsTab() {
        // 현재 내 역할에게 온 미션 + 공통 데일리 팁만 노출 (상대방 불만 0%)

        return `
          <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3.5">
            ${waitingBanner()}

                  <p class="text-[11px] font-semibold text-white/85">${esc(state.myName)} ♥ ${esc(state.partnerName)} · 코드 ${esc(state.coupleCode)}</p>

            ${visibleMissions.length === 0 ? `
              <div class="bg-white rounded-2xl p-6 border border-[#FF8A80]/15 text-center">
                <p class="text-sm font-bold text-[#2D3436]">아직 도착한 미션이 없어요</p>
                <p class="text-xs text-[#9AA5A9] mt-1.5 leading-relaxed">사이봇 비밀방에서 마음을 전하면,<br />상대방에게만 따뜻한 미션으로 도착해요.</p>
              </div>
            ` : visibleMissions.map((m) => `
              <div class="animate-pop bg-white rounded-2xl p-4 border ${!m.accepted && m.targetRole === state.role ? 'border-[#FF8A80] ring-2 ring-[#FF8A80]/15' : 'border-[#2D3436]/8'} shadow-[0_4px_16px_rgba(45,52,54,0.05)] relative">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-[11px] font-bold text-[#FF8A80] bg-[#FFF0EE] px-2.5 py-0.5 rounded-full">${esc(m.badge)}</span>
                  <span class="text-[10px] text-[#9AA5A9]">${esc(m.time)}</span>
                </div>
                <h3 class="text-[15px] font-extrabold text-[#2D3436] mb-1.5">${esc(m.title)}</h3>
                <p class="text-[13px] text-[#4A5568] leading-relaxed">${esc(m.message)}</p>

                    <button type="button" data-action="accept-mission" data-id="${esc(m.id)}" class="w-full py-2.5 rounded-xl bg-[#FFF0EE] hover:bg-[#FF8A80] text-[#E0665B] hover:text-white text-xs font-extrabold transition-all border border-[#FF8A80]/30">

      function renderSaibotTab() {
        const list = state.chats[state.role] || [];
        return `
          <div class="flex-1 flex flex-col min-h-0">
            <div id="chat-scroll" class="flex-1 overflow-y-auto px-4 py-4 space-y-3.5">
              ${list.map((msg) => {
                if (msg.sender === 'user') {
                  return `
                    <div class="flex flex-col items-end animate-pop">
                      <div class="max-w-[85%] bg-[#2D3436] text-white rounded-2xl rounded-tr-sm px-3.5 py-2.5 text-[13px] leading-relaxed shadow-sm">
                        ${esc(msg.text)}
                      </div>
                      <span class="mt-1 text-[10px] text-[#9AA5A9]">🔒 나만 보는 비밀 기록 · ${esc(msg.time)}</span>
                    </div>
                  `;
                }
                if (msg.type === 'welcome' || msg.type === 'notice') {
                  return `
                    <div class="flex items-start gap-2 animate-pop">
                      <img src="${AVATAR_SRC}" alt="사이봇" class="w-8 h-8 rounded-full object-cover border border-[#FF8A80]/30 shrink-0" />
                      <div class="max-w-[85%] ${msg.type === 'notice' ? 'bg-[#FFF8E7] border-[#FFB74D]/50' : 'bg-white border-[#FF8A80]/15'} rounded-2xl rounded-tl-sm px-3.5 py-3 border shadow-sm">
                        <p class="text-[13px] text-[#2D3436] leading-relaxed">${esc(msg.text)}</p>
                      </div>
                    </div>
                  `;
                }
                const drafts = Array.isArray(msg.drafts) ? msg.drafts : [];
                const draft = drafts[msg.draftIdx || 0] || drafts[0];
                const replyBubble = `
                      <div class="bg-white rounded-2xl rounded-tl-sm px-3.5 py-3 border border-[#FF8A80]/15 shadow-sm">
                        <p class="text-[13px] text-[#2D3436] leading-relaxed whitespace-pre-line">${esc(msg.empathy)}</p>
                        ${msg.fallback ? '<p class="mt-1.5 text-[10px] text-[#B2BEC3]">AI 연결이 잠시 불안정해서 기본 답변을 보여드렸어요</p>' : ''}
                      </div>`;
                if (!draft) {
                  return `
                    <div class="flex items-start gap-2 animate-pop">
                      <img src="${AVATAR_SRC}" alt="사이봇" class="w-8 h-8 rounded-full object-cover border border-[#FF8A80]/30 shrink-0" />
                      <div class="flex-1 min-w-0">${replyBubble}</div>
                    </div>
                  `;
                }
                return `
                  <div class="flex items-start gap-2 animate-pop">
                    <img src="${AVATAR_SRC}" alt="사이봇" class="w-8 h-8 rounded-full object-cover border border-[#FF8A80]/30 shrink-0" />
                    <div class="flex-1 space-y-2.5 min-w-0">
                      ${replyBubble}
                      <div class="bg-gradient-to-br from-white to-[#FFF3F0] rounded-2xl p-3.5 border border-[#FF8A80]/35 shadow-sm">
                        <div class="flex items-center justify-between mb-2">
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#FF8A80]/15 text-[#D95B50]">✨ 연인에게 보낼 미션 제안</span>
                          ${!msg.sent && drafts.length > 1 ? `<button type="button" data-action="shuffle-draft" data-id="${esc(msg.id)}" class="text-[11px] font-bold text-[#636E72] hover:text-[#FF8A80]">다른 제안 (${(msg.draftIdx || 0) + 1}/${drafts.length})</button>` : ''}
                        </div>
                        <div class="bg-white rounded-xl p-3 border border-[#FF8A80]/15">
                          <p class="text-[10px] font-bold text-[#FF8A80] mb-1">${esc(draft.badge)} · ${esc(draft.title)}</p>
                          <p class="text-[12.5px] text-[#2D3436] leading-relaxed font-medium">“${esc(draft.message)}”</p>
                        </div>
                        <div class="mt-2.5">
                          ${!msg.sent ? `
                            <button type="button" data-action="send-nudge" data-id="${esc(msg.id)}" class="w-full py-2.5 rounded-xl bg-[#FF8A80] hover:bg-[#F26D63] text-white text-xs font-extrabold shadow-sm transition-all">
                              이대로 슬쩍 신호 보내기 ✨
                            </button>
                          ` : `
                            <div class="w-full py-2 rounded-xl bg-[#FFF0EE] text-[#E0665B] text-xs font-bold text-center border border-[#FF8A80]/30">
                              ✓ 연인 피드에 자연스럽게 도착했어요
                            </div>
                          `}
                        </div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
              ${state.botTyping ? `
                <div id="bot-typing" class="flex items-start gap-2 animate-pop">
                  <img src="${AVATAR_SRC}" alt="사이봇" class="w-8 h-8 rounded-full object-cover border border-[#FF8A80]/30 shrink-0" />
                  <div class="bg-white rounded-2xl rounded-tl-sm px-3.5 py-3 border border-[#FF8A80]/15 shadow-sm text-[13px] text-[#9AA5A9]">사이봇이 생각하는 중이에요…</div>
                </div>` : ''}
            </div>

            <!-- 빠른 태그 + 입력창 -->
            <div class="bg-white border-t border-[#FF8A80]/15 px-3.5 pt-2.5 pb-3">
              <div class="flex gap-1.5 overflow-x-auto pb-2 no-scrollbar">
                ${QUICK_TAGS.map((t) => `
                  <button type="button" data-action="quick-tag" data-sample="${esc(t.sample)}" class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-[#FFF9F5] text-[#2D3436] border border-[#FF8A80]/30 hover:bg-[#FF8A80] hover:text-white transition-colors">

                  </button>

              <div class="flex items-end gap-2 bg-[#FFF9F5] rounded-2xl border border-[#FF8A80]/30 px-3 py-2">
                <textarea id="emotion-input" rows="2" maxlength="500" enterkeyhint="send" placeholder="사이봇에게 편하게 얘기해 보세요 (서운했던 일, 고민, 뭐든지)" class="flex-1 bg-transparent text-[13px] text-[#2D3436] placeholder-[#9AA5A9] focus:outline-none resize-none leading-snug">${esc(state.draftInput)}</textarea>

                  ↑
                </button>
              </div>
            </div>
          </div>
        `;
      }

                    <p class="text-[11px] text-[#9AA5A9] leading-relaxed">${state.partnerJoined ? '두 분이 연결된 코드예요. 다른 사람은 들어올 수 없어요.' : '연인이 카카오로 로그인한 뒤 이 코드를 입력하면 연결돼요.'}</p>

                <div class="flex gap-2 pt-1">
                  <button type="button" data-action="logout-cancel" class="flex-1 py-2.5 rounded-xl bg-[#F1F2F6] text-[#2D3436] text-xs font-bold">취소</button>
                  <button type="button" data-action="logout-confirm" class="flex-1 py-2.5 rounded-xl bg-[#FF8A80] text-white text-xs font-extrabold">로그아웃</button>
                </div>
              </div>
            </div>
          `;
        }

        if (state.showInstallGuide) {
          html += `
            <div class="fixed inset-0 z-50 bg-[#2D3436]/45 flex items-end sm:items-center justify-center p-4">
              <div class="bg-white rounded-3xl w-full max-w-[400px] p-5 space-y-3.5 shadow-2xl">
                <div class="flex items-center justify-between">
                  <h3 class="text-base font-extrabold text-[#2D3436]">📱 핸드폰에 앱으로 설치하기</h3>
                  <button type="button" data-action="close-modals" class="text-sm font-bold text-[#636E72] px-2 py-1">닫기</button>
                </div>
                <div class="space-y-2.5 text-xs text-[#4A5568] leading-relaxed">
                  <div class="p-3 rounded-2xl bg-[#FFF9F5] border border-[#FF8A80]/20">
                    <p class="font-extrabold text-[#2D3436] mb-1">1. 아이폰 (Safari)</p>
                    <p>배포된 주소를 Safari로 열고 하단 <strong>공유 버튼(↑)</strong> → <strong>홈 화면에 추가</strong>를 누르면 앱 아이콘이 생겨요.</p>
                  </div>
                  <div class="p-3 rounded-2xl bg-[#FFF9F5] border border-[#FF8A80]/20">
                    <p class="font-extrabold text-[#2D3436] mb-1">2. 안드로이드 (Chrome)</p>
                    <p>Chrome 우측 상단 <strong>메뉴(⋮)</strong> → <strong>앱 설치</strong> 또는 <strong>홈 화면에 추가</strong>를 누르세요.</p>
                  </div>
                </div>
                <button type="button" data-action="close-modals" class="w-full py-2.5 rounded-xl bg-[#2D3436] text-white text-xs font-extrabold">확인했어요</button>
              </div>
            </div>
          `;
        }
        return html;
      }

      function render() {
        const root = document.getElementById('app');
        if (!root) return;

        if (state.phase !== 'ready') {
          root.innerHTML = renderLanding() + renderModals();
          return;
        }

        const otherPending = state.missions.filter((m) => !m.accepted && (m.targetRole === 'BOTH' || m.targetRole === state.role)).length;

        root.innerHTML = `
          <!-- 상단 앱바 -->
          <header class="shrink-0 bg-[#FFF9F5] border-b border-[#FF8A80]/15 px-4 pb-3 safe-top flex items-center justify-between z-20">
            <div class="flex items-center gap-2.5 min-w-0">
              <img src="${AVATAR_SRC}" alt="우리사이" class="w-9 h-9 rounded-2xl object-cover border border-[#FF8A80]/30 shrink-0" />
              <div class="min-w-0">
                <span class="text-base font-extrabold text-[#2D3436]">우리사이</span>
                <p class="text-[11px] text-[#636E72] truncate">${esc(state.myName)} ♥ ${esc(state.partnerName)} · ${state.warmthTemp.toFixed(1)}°C</p>
              </div>
            </div>
            <button type="button" data-action="open-settings" class="w-8 h-8 rounded-xl bg-white border border-[#2D3436]/10 flex items-center justify-center text-sm shrink-0" aria-label="설정">
              ⚙
            </button>
          </header>

          <!-- 메인 탭 뷰 -->
          <main class="flex-1 flex flex-col min-h-0">
            ${state.activeTab === 'missions' ? renderMissionsTab() : state.activeTab === 'saibot' ? renderSaibotTab() : renderWarmthTab()}
          </main>

          <!-- 하단 모바일 네비게이션 바 -->
          <nav class="shrink-0 bg-white border-t border-[#FF8A80]/15 px-3 pt-2 safe-bottom grid grid-cols-3 gap-1 z-20">
            <button type="button" data-action="switch-tab" data-tab="missions" class="relative py-2 rounded-2xl flex flex-col items-center gap-0.5 transition-colors ${state.activeTab === 'missions' ? 'bg-[#FFF0EE] text-[#E0665B]' : 'text-[#636E72]'}">
              <span class="text-base leading-none">💌</span>
              <span class="text-[11px] font-bold">오늘의 미션</span>
              ${otherPending > 0 ? `<span class="absolute top-1.5 right-6 w-4 h-4 rounded-full bg-[#FF8A80] text-white text-[9px] font-extrabold flex items-center justify-center">${otherPending}</span>` : ''}
            </button>
            <button type="button" data-action="switch-tab" data-tab="saibot" class="py-2 rounded-2xl flex flex-col items-center gap-0.5 transition-colors ${state.activeTab === 'saibot' ? 'bg-[#FFF0EE] text-[#E0665B]' : 'text-[#636E72]'}">
              <span class="text-base leading-none">👼</span>
              <span class="text-[11px] font-bold">사이봇 비밀방</span>
            </button>
            <button type="button" data-action="switch-tab" data-tab="warmth" class="py-2 rounded-2xl flex flex-col items-center gap-0.5 transition-colors ${state.activeTab === 'warmth' ? 'bg-[#FFF0EE] text-[#E0665B]' : 'text-[#636E72]'}">
              <span class="text-base leading-none">🌡️</span>
              <span class="text-[11px] font-bold">우리 온도</span>
            </button>
          </nav>
          ${renderModals()}
        `;

        const sc = document.getElementById('chat-scroll');
        if (sc) sc.scrollTop = sc.scrollHeight;
      }

      // 이벤트 위임
      function joinErrorMessage(err) {
        const m = String((err && err.message) || '');
        if (m.indexOf('couple_full') >= 0) return '이미 두 분이 연결된 코드예요. 연인에게 코드를 다시 확인해 주세요.';
        if (m.indexOf('code_not_found') >= 0) return '그런 초대 코드가 없어요. 코드를 다시 확인해 주세요.';
        if (m.indexOf('already_in_couple') >= 0) return '이미 다른 연인과 연결된 계정이에요.';
        if (err && err.status === 401) return '로그인이 풀렸어요. 카카오로 다시 시작해 주세요.';
        return '연결에 실패했어요, 다시 시도해 주세요';
      }

      async function enterCouple(c, toastMsg) {
        applyCouple(c);
        loadLocalForUser();
        if (state.role === 'B' && !localStorage.getItem(localKey())) state.activeTab = 'missions';
        saveState();
        render();
        await syncFromSupabase();
        startSyncLoop();
        if (toastMsg) showToast(toastMsg);
      }

      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');

        if (action === 'kakao-login') {
          if (!sb) { showToast('잠시 후 다시 시도해 주세요'); return; }
          state.busy = true;
          render();
          const { error } = await sb.auth.signInWithOAuth({
            provider: 'kakao',
            options: { redirectTo: location.origin + location.pathname, scopes: 'profile_nickname profile_image' }
          });
          if (error) {
            state.busy = false;
            render();
            showToast('카카오 로그인을 열지 못했어요, 다시 시도해 주세요');
          }
        } else if (action === 'join-mode' || action === 'join-back') {
          const myEl = document.getElementById('ob-my-name');
          if (myEl && myEl.value.trim()) state.myName = myEl.value.trim().slice(0, 12);
          state.joinMode = action === 'join-mode';
          render();
        } else if (action === 'create-couple' || action === 'join-couple') {
          if (state.busy) return;
          const myEl = document.getElementById('ob-my-name');
          const nick = ((myEl && myEl.value) || state.myName || state.kakaoName || '').trim().slice(0, 12);
          if (!nick) { showToast('닉네임을 입력해 주세요'); return; }
          state.myName = nick;
          let code = '';
          if (action === 'join-couple') {
            const cdEl = document.getElementById('ob-code');
            code = ((cdEl && cdEl.value) || '').trim().toUpperCase();
            if (!code) { showToast('초대 코드를 입력해 주세요'); return; }
          }
          state.busy = true;
          render();
          if (action === 'join-couple') {
            const again = document.getElementById('ob-code');
            if (again) again.value = code;
          }
          try {
            const c = action === 'create-couple'
              ? await rpc('create_couple', { nickname: nick })
              : await rpc('join_couple', { p_code: code, nickname: nick });
            state.busy = false;
            if (!c || !c.code) throw new Error('empty');
            await enterCouple(c, action === 'create-couple' ? '초대코드를 만들었어요! 연인에게 공유해 주세요 💌' : '연인과 연결됐어요! 💛');
          } catch (err) {
            state.busy = false;
            render();
            if (action === 'join-couple') {
              const again = document.getElementById('ob-code');
              if (again) again.value = code;
            }
            showToast(joinErrorMessage(err));
          }
        } else if (action === 'switch-tab') {
          state.activeTab = btn.getAttribute('data-tab') || 'saibot';
          saveState();
          render();
        } else if (action === 'quick-tag') {
          state.draftInput = btn.getAttribute('data-sample') || '';
          render();
        } else if (action === 'send-emotion') {
          const inputEl = document.getElementById('emotion-input');
          const text = ((inputEl && inputEl.value) || state.draftInput || '').trim();
          if (!text || sendingEmotion) return;
          sendingEmotion = true;
          state.draftInput = '';
          const role = state.role;
          state.chats[role] = state.chats[role] || [];
          state.chats[role].push({ id: 'u-' + Date.now(), sender: 'user', text: text, time: nowStr() });
          saveState();
          render();
          try {
            state.botTyping = true;
            render();
            let res;
            try {
              res = await askSaibot(text, role);
            } catch (_e) {
              res = localFallback(text, role);
            }
            state.botTyping = false;
            state.chats[role].push({
              id: 'b-' + Date.now(),
              sender: 'bot',
              type: 'draft',
              empathy: res.empathy,
              drafts: res.drafts || [],
              draftIdx: res.draftIdx || 0,
              fallback: Boolean(res.fallback),
              sent: false,
              time: nowStr()
            });
            saveState();
            render();
          } finally {
            state.botTyping = false;
            sendingEmotion = false;
          }
        } else if (action === 'shuffle-draft') {
          const id = btn.getAttribute('data-id');
          const list = state.chats[state.role] || [];
          const msg = list.find((m) => m.id === id);
          if (msg && !msg.sent) {
            msg.draftIdx = ((msg.draftIdx || 0) + 1) % msg.drafts.length;
            saveState();
            render();
          }
        } else if (action === 'send-nudge') {
          const id = btn.getAttribute('data-id');
          const list = state.chats[state.role] || [];
          const msg = list.find((m) => m.id === id);
          if (!msg || msg.sent) return;
          const draft = msg.drafts[msg.draftIdx || 0];
          const targetRole = state.role === 'A' ? 'B' : 'A';
          const missionId = 'm-' + Date.now();
          msg.sent = true;
          const newMission = {
            id: missionId,
            targetRole: targetRole,
            title: draft.title,
            badge: draft.badge,
            message: draft.message,
            time: '방금 도착',
            accepted: false
          };
          try {
            await sbFetch('daily_missions', {
              method: 'POST',
              body: JSON.stringify({
                id: missionId,
                couple_code: state.coupleCode,
                target_role: targetRole,
                title: draft.title,
                badge: draft.badge,
                message: draft.message,
                accepted: false
              })
            });
          } catch (_e) {
            showToast('미션을 보내지 못했어요, 다시 시도해 주세요');
            return;
          }
          state.missions.unshift(newMission);
          saveState();
          render();
          showToast('상대방 피드에 자연스러운 데일리 미션이 도착했어요 ✨');
        } else if (action === 'accept-mission') {
          const id = btn.getAttribute('data-id');
          const mission = state.missions.find((m) => m.id === id);
          if (!mission || mission.accepted) return;
          mission.accepted = true;
          state.warmthTemp = Math.min(45.0, Number((state.warmthTemp + 1.2).toFixed(1)));
          state.completedCount += 1;

          const senderRole = state.role === 'A' ? 'B' : 'A';
          state.chats[senderRole] = state.chats[senderRole] || [];
          state.chats[senderRole].push({
            id: 'n-' + Date.now(),
            sender: 'bot',
            type: 'notice',
            text: '상대방이 오늘의 추천 미션("' + mission.title + '")을 수락했어요! 💛 다정함 온도가 ' + state.warmthTemp.toFixed(1) + '°C로 올랐어요.',
            time: nowStr()
          });
          saveState();
          render();
          showToast('다정함 스탬프 완료! 온도가 +1.2°C 올랐어요 💛');

          try {
            await sbFetch('daily_missions?id=eq.' + encodeURIComponent(id), {
              method: 'PATCH',
              body: JSON.stringify({ accepted: true, accepted_at: new Date().toISOString() })
            });
            await sbFetch('couples?code=eq.' + encodeURIComponent(state.coupleCode), {
              method: 'PATCH',
              body: JSON.stringify({ warmth_temp: state.warmthTemp, completed_count: state.completedCount })
            });
          } catch (_e) {
            mission.accepted = false;
            state.warmthTemp = Math.max(37.5, Number((state.warmthTemp - 1.2).toFixed(1)));
            state.completedCount = Math.max(0, state.completedCount - 1);
            const noticeList = state.chats[senderRole] || [];
            if (noticeList.length && noticeList[noticeList.length - 1].type === 'notice') noticeList.pop();
            saveState();
            render();
            showToast('저장에 실패했어요, 다시 시도해 주세요');
            return;
          }
        } else if (action === 'open-settings') {
          hideToast();
          state.showSettings = true;
          render();
        } else if (action === 'open-install') {
          hideToast();
          state.showInstallGuide = true;
          render();
        } else if (action === 'close-modals') {
          state.showSettings = false;
          state.showInstallGuide = false;
          state.showLogoutConfirm = false;
          render();
        } else if (action === 'save-settings') {
          const myEl = document.getElementById('set-my-name');
          if (myEl && myEl.value.trim()) state.myName = myEl.value.trim().slice(0, 12);
          try {
            await saveNamesToServer();
            state.showSettings = false;
            saveState();
            render();
            showToast('닉네임을 저장했어요.');
          } catch (_e) {
            showToast('저장에 실패했어요, 다시 시도해 주세요');
          }
        } else if (action === 'share-code') {
          const text = '우리사이 초대 코드: ' + state.coupleCode + '\n' + location.origin + location.pathname + ' 에서 카카오로 시작한 뒤 "초대코드 입력"에 넣어 주세요 💛';
          try {
            if (navigator.share) {
              await navigator.share({ title: '우리사이', text: text });
            } else {
              throw new Error('share-unavailable');
            }
          } catch (err) {
            if (err && err.name === 'AbortError') return;
            const btn = document.querySelector('[data-action="copy-code"]');
            if (btn) btn.click();
            else showToast('코드: ' + state.coupleCode);
          }
        } else if (action === 'logout-ask') {
          hideToast();
          state.showLogoutConfirm = true;
          render();
        } else if (action === 'logout-cancel') {
          state.showLogoutConfirm = false;
          render();
        } else if (action === 'logout-confirm') {
          if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
          sendingEmotion = false;
          const key = localKey();
          try { if (key) localStorage.removeItem(key); } catch (_e) {}
          try { if (sb) await sb.auth.signOut(); } catch (_e) {}
          state = defaultState();
          state.phase = 'signedOut';
          render();
          showToast('로그아웃했어요. 카카오로 다시 시작하면 기록이 돌아와요.');
        } else if (action === 'copy-code') {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(state.coupleCode);
            } else {
              const ta = document.createElement('textarea');
              ta.value = state.coupleCode;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
            }
            showToast('커플 코드 ' + state.coupleCode + ' 복사 완료!');
          } catch (_e) {
            showToast('코드: ' + state.coupleCode);
          }
        }
      });

      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'emotion-input') {
          state.draftInput = e.target.value;
        }
      });

      if (window.visualViewport) {
        const fitViewport = () => {
          const app = document.getElementById('app');
          if (app) app.style.height = window.visualViewport.height + 'px';
        };
        window.visualViewport.addEventListener('resize', fitViewport);
        window.visualViewport.addEventListener('scroll', fitViewport);
        fitViewport();
      }

      function kakaoNickname(user) {
        const m = (user && user.user_metadata) || {};
        return String(m.nickname || m.name || m.full_name || m.preferred_username || m.user_name || '').trim().slice(0, 12);
      }

      let bootedUserId = null;
      async function onSignedIn(session) {
        const user = session && session.user;
        if (!user) return;
        if (bootedUserId === user.id) return;
        bootedUserId = user.id;
        state.userId = user.id;
        state.kakaoName = kakaoNickname(user);
        if (!state.myName) state.myName = state.kakaoName;
        try {
          const c = await rpc('my_couple', {});
          if (c && c.code) {
            await enterCouple(c);
          } else {
            state.phase = 'needCouple';
            render();
          }
        } catch (_e) {
          state.phase = 'needCouple';
          render();
          showToast('연결 정보를 불러오지 못했어요. 새로고침해 주세요');
        }
      }

      function cleanAuthUrl() {
        if (/[?&](code|error)=/.test(location.search) || /access_token|error_description/.test(location.hash)) {
          const params = new URLSearchParams(location.search);
          const err = params.get('error_description') || params.get('error');
          history.replaceState(null, '', location.pathname);
          if (err) showToast('카카오 로그인이 취소됐거나 실패했어요. 다시 시도해 주세요');
        }
      }

      async function boot() {
        render();
        if (!sb) {
          state.phase = 'signedOut';
          render();
          showToast('네트워크를 확인하고 새로고침해 주세요');
          return;
        }
        sb.auth.onAuthStateChange(function (event, session) {
          if (event === 'SIGNED_OUT') {
            if (state.phase !== 'signedOut') {
              if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
              bootedUserId = null;
              state = defaultState();
              state.phase = 'signedOut';
              render();
            }
          } else if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
            setTimeout(function () { onSignedIn(session); }, 0);
          }
        });
        let session = null;
        try {
          const r = await sb.auth.getSession();
          session = r && r.data && r.data.session;
        } catch (_e) {}
        cleanAuthUrl();
        if (session) {
          await onSignedIn(session);
        } else {
          state.phase = 'signedOut';
          render();
        }
      }

      boot();
    })();

  </script>
</body>
</html>
