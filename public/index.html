      function detectCategory(text) {
        const s = text.toLowerCase();
        if (/폰|스마트폰|핸드폰|휴대폰|유튜브|인스타|릴스|게임|화면|만 보|만봐/.test(s)) return 'phone';
        if (/연락|답장|읽씹|카톡|톡|전화|바빠|바쁘|바쁨|무소식|기다리/.test(s)) return 'contact';
        if (/표현|사랑|좋아|예쁘|애정|스킨십|안아|고마|관심|무심|외로/.test(s)) return 'affection';
        if (/데이트|코스|계획|약속|주말|식당|카페|매번 나만|맨날 나만/.test(s)) return 'date';
        if (/말투|짜증|화내|차가|무뚝뚝|단답|퉁명|상처|예민/.test(s)) return 'tone';
        return 'default';
      }

      function randomCoupleCode() {
        const num = Math.floor(1000 + Math.random() * 9000);
        return 'S2-' + num;
      }

      function nowStr() {
        const d = new Date();
        const h = d.getHours();
        const m = String(d.getMinutes()).padStart(2, '0');
        return (h >= 12 ? '오후 ' : '오전 ') + (h % 12 || 12) + ':' + m;
      }

            ],

            ]
          },
          draftInput: '',
          showSettings: false,
          showLogoutConfirm: false,
          showInstallGuide: false,
          supabaseUrl: DEFAULT_SUPABASE_URL,
          supabaseKey: DEFAULT_SUPABASE_ANON_KEY,
          geminiKey: '',
          syncStatus: 'Supabase 연동됨'
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const base = defaultState();
          if (!raw) return base;
          const parsed = JSON.parse(raw);
          const s = Object.assign(base, parsed);
          // Keep built-in project defaults if a previous visit saved empty keys
          if (!s.supabaseUrl) s.supabaseUrl = DEFAULT_SUPABASE_URL;
          if (!s.supabaseKey) s.supabaseKey = DEFAULT_SUPABASE_ANON_KEY;
          if (s.supabaseUrl && s.supabaseKey && s.syncStatus === '로컬 체험 모드') {
            s.syncStatus = 'connected';
          }
          if (Array.isArray(s.missions)) {
            s.missions = s.missions.filter((m) => m && String(m.id).indexOf('base-') !== 0 && !(m.message || '').includes("디지털 디톡스 15분"));
          }
          return s;
        } catch (_e) {
          return defaultState();
        }
      }

      let state = loadState();
      let syncTimer = null;
      let sendingEmotion = false;

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (_e) {}
      }

      function hideToast() {
        const el = document.getElementById('toast');
        if (!el) return;
        el.classList.add('hidden');
        clearTimeout(el._t);
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.add('hidden'), 2600);
      }

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Supabase REST 헬퍼 (설정된 경우에만 호출)
      async function sbFetch(path, options) {
        if (!state.supabaseUrl || !state.supabaseKey) return null;
        const base = state.supabaseUrl.replace(/\/$/, '');
        try {
          const res = await fetch(base + '/rest/v1/' + path, Object.assign({
            headers: {
              apikey: state.supabaseKey,
              Authorization: 'Bearer ' + state.supabaseKey,
              'Content-Type': 'application/json',
              Prefer: 'return=representation'
            }
          }, options || {}));
          if (!res.ok) return null;
          return await res.json();
        } catch (_e) {
          return null;
        }
      }

      function isUserTyping() {
        const el = document.activeElement;
        return el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT');
      }

      function mergeRemoteMissions(rows) {
        const remote = (rows || []).map((r) => ({
          id: r.id,
          targetRole: r.target_role,
          title: r.title,
          badge: r.badge,
          message: r.message,
          time: '도착함',
          accepted: Boolean(r.accepted)
        }));
        const remoteIds = new Set(remote.map((m) => m.id));
        const localById = {};
        (state.missions || []).forEach((m) => { localById[m.id] = m; });
        const merged = remote.map((r) => {
          const local = localById[r.id];
          return local && local.accepted && !r.accepted ? Object.assign({}, r, { accepted: true }) : r;
        });
        (state.missions || []).forEach((m) => {
          if (remoteIds.has(m.id)) return;
          if (String(m.id).indexOf('base-') === 0) return; // drop old demo cards
          const ts = Number(String(m.id).replace(/^m-/, ''));
          // keep only a mission just sent on this phone, not yet visible on the server
          if (ts && (Date.now() - ts) < 20000) merged.unshift(m);
        });
        return merged;
      }

      async function syncFromSupabase() {
        if (!state.onboarded || !state.supabaseUrl || !state.supabaseKey) return;
        const couples = await sbFetch('couples?code=eq.' + encodeURIComponent(state.coupleCode));
        let warmthChanged = false;
        if (couples && couples.length > 0) {
          const nextTemp = Number(couples[0].warmth_temp);
          const nextCount = Number(couples[0].completed_count);
          if (!Number.isNaN(nextTemp) && nextTemp !== state.warmthTemp) {
            state.warmthTemp = nextTemp;
            warmthChanged = true;
          }
          if (!Number.isNaN(nextCount) && nextCount !== state.completedCount) {
            state.completedCount = nextCount;
            warmthChanged = true;
          }
          if (state.syncStatus !== 'connected') state.syncStatus = 'connected';
        }
        const rows = await sbFetch('daily_missions?couple_code=eq.' + encodeURIComponent(state.coupleCode) + '&order=created_at.desc');
        if (rows && Array.isArray(rows)) {
          const merged = mergeRemoteMissions(rows);
          const before = JSON.stringify((state.missions || []).map((m) => [m.id, m.accepted]));
          const after = JSON.stringify(merged.map((m) => [m.id, m.accepted]));
          const missionsChanged = before !== after;
          if (missionsChanged) state.missions = merged;
          if (missionsChanged || warmthChanged) {
            saveState();
            if (!isUserTyping()) render();
          }
        } else if (warmthChanged && !isUserTyping()) {
          saveState();
          render();
        }
      }

      function startSyncLoop() {
        if (syncTimer) clearInterval(syncTimer);
        if (state.supabaseUrl && state.supabaseKey && state.onboarded) {
          syncFromSupabase();
          syncTimer = setInterval(syncFromSupabase, 6000);
        }
      }

      async function ensureCoupleRow() {
        if (!state.supabaseUrl || !state.supabaseKey) return;
        await sbFetch('couples?on_conflict=code', {
          method: 'POST',
          headers: {
            apikey: state.supabaseKey,
            Authorization: 'Bearer ' + state.supabaseKey,
            'Content-Type': 'application/json',
            Prefer: 'resolution=ignore-duplicates,return=representation'
          },
          body: JSON.stringify({
            code: state.coupleCode,
            warmth_temp: state.warmthTemp,
            completed_count: state.completedCount
          })
        });
      }

      async function translateEmotion(text) {
        const cat = detectCategory(text);
        const preset = NUDGE_LIBRARY[cat] || NUDGE_LIBRARY.default;

        if (state.geminiKey && state.geminiKey.trim()) {
          try {
            const prompt = `당신은 커플 관계 코칭 AI '사이봇'입니다. 연인이 서운한 감정을 털어놓았습니다: "${text}"
반드시 JSON으로만 답하세요(코드블록 없이):
{"empathy":"깊이 공감하고 위로하는 따뜻한 한국어 2문장","title":"상대방에게 보낼 자연스러운 데일리 미션 제목(15자 이내)","message":"서운함이 전혀 티 나지 않는 자연스러운 커플 추천 미션 문구(한국어 2문장)"}`;
            const res = await fetch(
              'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' +
                encodeURIComponent(state.geminiKey.trim()),
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
              }
            );
            if (res.ok) {
              const json = await res.json();
              const out = (json.candidates && json.candidates[0] && json.candidates[0].content.parts[0].text) || '';
              const parsed = JSON.parse(out.replace(/```json|```/g, '').trim());
              if (parsed.empathy && parsed.message) {
                return {
                  empathy: parsed.empathy,
                  drafts: [{ title: parsed.title || '오늘의 다정함 미션', badge: '오늘의 데일리 미션', message: parsed.message }].concat(preset.drafts)
                };
              }
            }
          } catch (_e) {}
        }
        const drafts = preset.drafts.slice();
        return { empathy: preset.empathy, drafts: drafts, draftIdx: Math.floor(Math.random() * drafts.length) };
      }

            </div>

            <div class="bg-white rounded-2xl p-4 border border-[#2D3436]/8 shadow-sm">
              <h3 class="text-xs font-extrabold text-[#2D3436] mb-2">내가 보낸 다정함 신호 (${mySent.length}건)</h3>
              ${mySent.length === 0 ? `<p class="text-xs text-[#9AA5A9]">아직 보낸 신호가 없어요. 사이봇 탭에서 속마음을 털어놓아 보세요.</p>` : mySent.map((s) => {
                const d = s.drafts[s.draftIdx || 0];
                return `<div class="py-2 border-t border-[#2D3436]/5 first:border-t-0 text-xs">
                  <p class="font-bold text-[#FF8A80]">${esc(d.title)}</p>
                  <p class="text-[#4A5568] mt-0.5">${esc(d.message)}</p>
                </div>`;
              }).join('')}
            </div>

            <button type="button" data-action="open-install" class="w-full py-3 rounded-2xl bg-white border border-[#FF8A80]/30 text-xs font-extrabold text-[#E0665B]">
              📱 핸드폰 홈 화면에 앱으로 설치하기 가이드
            </button>
          </div>
        `;
      }

      function renderModals() {
        let html = '';
        if (state.showSettings) {
          html += `
            <div class="fixed inset-0 z-50 bg-[#2D3436]/45 flex items-end sm:items-center justify-center p-4">
              <div class="bg-white rounded-3xl w-full max-w-[400px] p-5 shadow-2xl max-h-[88vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-base font-extrabold text-[#2D3436]">설정</h3>
                  <button type="button" data-action="close-modals" class="text-sm font-bold text-[#636E72] px-2 py-1">닫기</button>
                </div>

                <div class="space-y-4 text-xs">
                  <div class="space-y-3">
                    <div>
                      <label class="block font-bold text-[#636E72] mb-1">내 닉네임</label>
                      <input id="set-my-name" type="text" value="${esc(state.myName)}" maxlength="12" class="w-full px-3 py-2.5 rounded-xl bg-[#FFF9F5] border border-[#FF8A80]/30 text-sm font-semibold text-[#2D3436] focus:outline-none focus:ring-2 focus:ring-[#FF8A80]/40" />
                    </div>
                    <div>
                      <label class="block font-bold text-[#636E72] mb-1">연인 닉네임</label>
                      <input id="set-partner-name" type="text" value="${esc(state.partnerName)}" maxlength="12" class="w-full px-3 py-2.5 rounded-xl bg-[#FFF9F5] border border-[#FF8A80]/30 text-sm font-semibold text-[#2D3436] focus:outline-none focus:ring-2 focus:ring-[#FF8A80]/40" />
                    </div>
                    <button type="button" data-action="save-settings" class="w-full py-2.5 rounded-xl bg-[#FF8A80] text-white text-xs font-extrabold">닉네임 저장</button>
                  </div>

                  <div class="rounded-2xl bg-[#FFF9F5] border border-[#FF8A80]/20 p-3.5 space-y-2">
                    <p class="font-bold text-[#2D3436]">우리 초대 코드</p>
                    <p class="text-[11px] text-[#9AA5A9] leading-relaxed">연인에게 이 코드를 알려주고, 같은 코드로 입장하면 서로 연결돼요.</p>
                    <div class="flex items-center justify-between gap-2 pt-0.5">
                      <span class="font-mono font-extrabold text-base text-[#2D3436] tracking-wider">${esc(state.coupleCode)}</span>
                      <div class="flex gap-1.5 shrink-0">
                        <button type="button" data-action="copy-code" class="px-3 py-1.5 rounded-lg bg-white border border-[#FF8A80]/30 text-[11px] font-bold text-[#E0665B]">복사</button>
                        <button type="button" data-action="share-code" class="px-3 py-1.5 rounded-lg bg-white border border-[#FF8A80]/30 text-[11px] font-bold text-[#E0665B]">공유</button>
                      </div>
                    </div>
                  </div>

                  <button type="button" data-action="open-install" class="w-full text-left rounded-2xl bg-white border border-[#2D3436]/8 px-3.5 py-3 flex items-center justify-between">
                    <span>
                      <span class="block font-bold text-[#2D3436]">홈 화면에 추가</span>
                      <span class="block text-[11px] text-[#9AA5A9] mt-0.5">아이폰 · 안드로이드에 앱처럼 설치하기</span>
                    </span>
                    <span class="text-[#9AA5A9]">›</span>
                  </button>

                  <p class="text-[11px] text-[#B2BEC3] text-center pt-1">우리사이 · 커플 감정 번역 &amp; 다정함 코칭</p>
                </div>

                <button type="button" data-action="logout-ask" class="mt-5 w-full py-3 rounded-2xl border border-[#FF8A80]/30 text-[#E0665B] text-xs font-extrabold bg-white hover:bg-[#FFF0EE]">
                  로그아웃
                </button>
              </div>
            </div>
          `;
        }

        if (state.showLogoutConfirm) {
          html += `
            <div class="fixed inset-0 z-[70] bg-[#2D3436]/45 flex items-end sm:items-center justify-center p-4">
              <div class="bg-white rounded-3xl w-full max-w-[400px] p-5 shadow-2xl space-y-3">
                <h3 class="text-base font-extrabold text-[#2D3436]">로그아웃할까요?</h3>
                <p class="text-xs text-[#636E72] leading-relaxed">이 휴대폰에서만 연결이 해제되고 시작 화면으로 돌아가요. 연인의 앱과 우리 기록은 그대로 남아요.</p>
                <div class="flex gap-2 pt-1">
                  <button type="button" data-action="logout-cancel" class="flex-1 py-2.5 rounded-xl bg-[#F1F2F6] text-[#2D3436] text-xs font-bold">취소</button>
                  <button type="button" data-action="logout-confirm" class="flex-1 py-2.5 rounded-xl bg-[#FF8A80] text-white text-xs font-extrabold">로그아웃</button>
                </div>
              </div>
            </div>
          `;
        }

        if (state.showInstallGuide) {
          html += `
            <div class="fixed inset-0 z-50 bg-[#2D3436]/45 flex items-end sm:items-center justify-center p-4">
              <div class="bg-white rounded-3xl w-full max-w-[400px] p-5 space-y-3.5 shadow-2xl">
                <div class="flex items-center justify-between">
                  <h3 class="text-base font-extrabold text-[#2D3436]">📱 핸드폰에 앱으로 설치하기</h3>
                  <button type="button" data-action="close-modals" class="text-sm font-bold text-[#636E72] px-2 py-1">닫기</button>
                </div>
                <div class="space-y-2.5 text-xs text-[#4A5568] leading-relaxed">
                  <div class="p-3 rounded-2xl bg-[#FFF9F5] border border-[#FF8A80]/20">
                    <p class="font-extrabold text-[#2D3436] mb-1">1. 아이폰 (Safari)</p>
                    <p>배포된 주소를 Safari로 열고 하단 <strong>공유 버튼(↑)</strong> → <strong>홈 화면에 추가</strong>를 누르면 앱 아이콘이 생겨요.</p>
                  </div>
                  <div class="p-3 rounded-2xl bg-[#FFF9F5] border border-[#FF8A80]/20">
                    <p class="font-extrabold text-[#2D3436] mb-1">2. 안드로이드 (Chrome)</p>
                    <p>Chrome 우측 상단 <strong>메뉴(⋮)</strong> → <strong>앱 설치</strong> 또는 <strong>홈 화면에 추가</strong>를 누르세요.</p>
                  </div>
                </div>
                <button type="button" data-action="close-modals" class="w-full py-2.5 rounded-xl bg-[#2D3436] text-white text-xs font-extrabold">확인했어요</button>
              </div>
            </div>
          `;
        }
        return html;
      }

      function render() {
        const root = document.getElementById('app');
        if (!root) return;

        if (!state.onboarded) {
          root.innerHTML = renderOnboarding() + renderModals();
          return;
        }

        const otherPending = state.missions.filter((m) => !m.accepted && (m.targetRole === 'BOTH' || m.targetRole === state.role)).length;

        root.innerHTML = `
          <!-- 상단 앱바 -->
          <header class="shrink-0 bg-[#FFF9F5] border-b border-[#FF8A80]/15 px-4 pb-3 safe-top flex items-center justify-between z-20">
            <div class="flex items-center gap-2.5 min-w-0">
              <img src="${AVATAR_SRC}" alt="우리사이" class="w-9 h-9 rounded-2xl object-cover border border-[#FF8A80]/30 shrink-0" />
              <div class="min-w-0">
                <span class="text-base font-extrabold text-[#2D3436]">우리사이</span>
                <p class="text-[11px] text-[#636E72] truncate">${esc(state.myName)} ♥ ${esc(state.partnerName)} · ${state.warmthTemp.toFixed(1)}°C</p>
              </div>
            </div>
            <button type="button" data-action="open-settings" class="w-8 h-8 rounded-xl bg-white border border-[#2D3436]/10 flex items-center justify-center text-sm shrink-0" aria-label="설정">
              ⚙
            </button>
          </header>

          <!-- 메인 탭 뷰 -->
          <main class="flex-1 flex flex-col min-h-0">
            ${state.activeTab === 'missions' ? renderMissionsTab() : state.activeTab === 'saibot' ? renderSaibotTab() : renderWarmthTab()}
          </main>

          <!-- 하단 모바일 네비게이션 바 -->
          <nav class="shrink-0 bg-white border-t border-[#FF8A80]/15 px-3 pt-2 safe-bottom grid grid-cols-3 gap-1 z-20">
            <button type="button" data-action="switch-tab" data-tab="missions" class="relative py-2 rounded-2xl flex flex-col items-center gap-0.5 transition-colors ${state.activeTab === 'missions' ? 'bg-[#FFF0EE] text-[#E0665B]' : 'text-[#636E72]'}">
              <span class="text-base leading-none">💌</span>
              <span class="text-[11px] font-bold">오늘의 미션</span>
              ${otherPending > 0 ? `<span class="absolute top-1.5 right-6 w-4 h-4 rounded-full bg-[#FF8A80] text-white text-[9px] font-extrabold flex items-center justify-center">${otherPending}</span>` : ''}
            </button>
            <button type="button" data-action="switch-tab" data-tab="saibot" class="py-2 rounded-2xl flex flex-col items-center gap-0.5 transition-colors ${state.activeTab === 'saibot' ? 'bg-[#FFF0EE] text-[#E0665B]' : 'text-[#636E72]'}">
              <span class="text-base leading-none">👼</span>
              <span class="text-[11px] font-bold">사이봇 비밀방</span>
            </button>
            <button type="button" data-action="switch-tab" data-tab="warmth" class="py-2 rounded-2xl flex flex-col items-center gap-0.5 transition-colors ${state.activeTab === 'warmth' ? 'bg-[#FFF0EE] text-[#E0665B]' : 'text-[#636E72]'}">
              <span class="text-base leading-none">🌡️</span>
              <span class="text-[11px] font-bold">우리 온도</span>
            </button>
          </nav>
          ${renderModals()}
        `;

        const sc = document.getElementById('chat-scroll');
        if (sc) sc.scrollTop = sc.scrollHeight;
      }

      // 이벤트 위임
      function readOnboardingFields() {
        const myEl = document.getElementById('ob-my-name');
        const ptEl = document.getElementById('ob-partner-name');
        const cdEl = document.getElementById('ob-code');
        if (myEl && myEl.value.trim()) state.myName = myEl.value.trim();
        if (ptEl && ptEl.value.trim()) state.partnerName = ptEl.value.trim();
        if (cdEl && cdEl.value.trim()) state.coupleCode = cdEl.value.trim().toUpperCase();
      }

      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');

        if (action === 'regen-code') {
          readOnboardingFields();
          state.coupleCode = randomCoupleCode();
          render();
        } else if (action === 'pick-role') {
          readOnboardingFields();
          state.role = btn.getAttribute('data-role') || 'A';
          render();
        } else if (action === 'start-app') {
          readOnboardingFields();
          state.onboarded = true;
          saveState();
          await ensureCoupleRow();
          startSyncLoop();
          render();
          showToast('우리사이에 입장했어요! 💛');
        } else if (action === 'switch-tab') {
          state.activeTab = btn.getAttribute('data-tab') || 'saibot';
          saveState();
          render();
        } else if (action === 'toggle-role') {
          state.role = state.role === 'A' ? 'B' : 'A';
          state.activeTab = state.role === 'B' ? 'missions' : 'saibot';
          saveState();
          render();
          showToast(state.role === 'A' ? state.myName + ' (A) 화면으로 전환했어요' : state.partnerName + ' (B) 화면으로 전환했어요');
        } else if (action === 'quick-tag') {
          state.draftInput = btn.getAttribute('data-sample') || '';
          render();
        } else if (action === 'send-emotion') {
          const inputEl = document.getElementById('emotion-input');
          const text = ((inputEl && inputEl.value) || state.draftInput || '').trim();
          if (!text || sendingEmotion) return;
          sendingEmotion = true;
          state.draftInput = '';
          const role = state.role;
          state.chats[role] = state.chats[role] || [];
          state.chats[role].push({ id: 'u-' + Date.now(), sender: 'user', text: text, time: nowStr() });
          saveState();
          render();
          try {
            const res = await translateEmotion(text);
            state.chats[role].push({
              id: 'b-' + Date.now(),
              sender: 'bot',
              type: 'draft',
              empathy: res.empathy,
              drafts: res.drafts,
              draftIdx: (typeof res.draftIdx === 'number') ? res.draftIdx : Math.floor(Math.random() * res.drafts.length),
              sent: false,
              time: nowStr()
            });
            saveState();
            render();
          } finally {
            sendingEmotion = false;
          }
        } else if (action === 'shuffle-draft') {
          const id = btn.getAttribute('data-id');
          const list = state.chats[state.role] || [];
          const msg = list.find((m) => m.id === id);
          if (msg && !msg.sent) {
            msg.draftIdx = ((msg.draftIdx || 0) + 1) % msg.drafts.length;
            saveState();
            render();
          }
        } else if (action === 'send-nudge') {
          const id = btn.getAttribute('data-id');
          const list = state.chats[state.role] || [];
          const msg = list.find((m) => m.id === id);
          if (!msg || msg.sent) return;
          const draft = msg.drafts[msg.draftIdx || 0];
          const targetRole = state.role === 'A' ? 'B' : 'A';
          const missionId = 'm-' + Date.now();
          msg.sent = true;
          const newMission = {
            id: missionId,
            targetRole: targetRole,
            title: draft.title,
            badge: draft.badge,
            message: draft.message,
            time: '방금 도착',
            accepted: false
          };
          state.missions.unshift(newMission);
          saveState();
          render();
          showToast('상대방 피드에 자연스러운 데일리 미션이 도착했어요 ✨');

          if (state.supabaseUrl && state.supabaseKey) {
            await ensureCoupleRow();
            await sbFetch('daily_missions', {
              method: 'POST',
              body: JSON.stringify({
                id: missionId,
                couple_code: state.coupleCode,
                target_role: targetRole,
                title: draft.title,
                badge: draft.badge,
                message: draft.message,
                accepted: false
              })
            });
          }
        } else if (action === 'accept-mission') {
          const id = btn.getAttribute('data-id');
          const mission = state.missions.find((m) => m.id === id);
          if (!mission || mission.accepted) return;
          mission.accepted = true;
          state.warmthTemp = Math.min(45.0, Number((state.warmthTemp + 1.2).toFixed(1)));
          state.completedCount += 1;

          const senderRole = state.role === 'A' ? 'B' : 'A';
          state.chats[senderRole] = state.chats[senderRole] || [];
          state.chats[senderRole].push({
            id: 'n-' + Date.now(),
            sender: 'bot',
            type: 'notice',
            text: '상대방이 오늘의 추천 미션("' + mission.title + '")을 수락했어요! 💛 다정함 온도가 ' + state.warmthTemp.toFixed(1) + '°C로 올랐어요.',
            time: nowStr()
          });
          saveState();
          render();
          showToast('다정함 스탬프 완료! 온도가 +1.2°C 올랐어요 💛');

          if (state.supabaseUrl && state.supabaseKey) {
            await sbFetch('daily_missions?id=eq.' + encodeURIComponent(id), {
              method: 'PATCH',
              body: JSON.stringify({ accepted: true, accepted_at: new Date().toISOString() })
            });
            await sbFetch('couples?code=eq.' + encodeURIComponent(state.coupleCode), {
              method: 'PATCH',
              body: JSON.stringify({ warmth_temp: state.warmthTemp, completed_count: state.completedCount })
            });
          }
        } else if (action === 'open-settings') {
          hideToast();
          state.showSettings = true;
          render();
        } else if (action === 'open-install') {
          hideToast();
          state.showInstallGuide = true;
          render();
        } else if (action === 'close-modals') {
          state.showSettings = false;
          state.showInstallGuide = false;
          state.showLogoutConfirm = false;
          render();
        } else if (action === 'save-settings') {
          const myEl = document.getElementById('set-my-name');
          const ptEl = document.getElementById('set-partner-name');
          if (myEl && myEl.value.trim()) state.myName = myEl.value.trim();
          if (ptEl && ptEl.value.trim()) state.partnerName = ptEl.value.trim();
          state.showSettings = false;
          saveState();
          render();
          showToast('닉네임을 저장했어요.');
        } else if (action === 'share-code') {
          const text = '우리사이 초대 코드: ' + state.coupleCode + '\n같은 코드로 입장하면 서로 연결돼요.';
          try {
            if (navigator.share) {
              await navigator.share({ title: '우리사이', text: text });
            } else {
              throw new Error('share-unavailable');
            }
          } catch (err) {
            if (err && err.name === 'AbortError') return;
            const btn = document.querySelector('[data-action="copy-code"]');
            if (btn) btn.click();
            else showToast('코드: ' + state.coupleCode);
          }
        } else if (action === 'logout-ask') {
          hideToast();
          state.showLogoutConfirm = true;
          render();
        } else if (action === 'logout-cancel') {
          state.showLogoutConfirm = false;
          render();
        } else if (action === 'logout-confirm') {
          if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
          sendingEmotion = false;
          try { localStorage.removeItem(STORAGE_KEY); } catch (_e) {}
          state = defaultState();
          saveState();
          render();
          showToast('이 휴대폰에서 로그아웃했어요.');
        } else if (action === 'copy-code') {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(state.coupleCode);
            } else {
              const ta = document.createElement('textarea');
              ta.value = state.coupleCode;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
            }
            showToast('커플 코드 ' + state.coupleCode + ' 복사 완료!');
          } catch (_e) {
            showToast('코드: ' + state.coupleCode);
          }
        }
      });

      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'emotion-input') {
          state.draftInput = e.target.value;
        }
      });

      if (window.visualViewport) {
        const fitViewport = () => {
          const app = document.getElementById('app');
          if (app) app.style.height = window.visualViewport.height + 'px';
        };
        window.visualViewport.addEventListener('resize', fitViewport);
        window.visualViewport.addEventListener('scroll', fitViewport);
        fitViewport();
      }

      render();
      startSyncLoop();
    })();
  </script>
</body>
</html>
