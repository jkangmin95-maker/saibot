                  <button type="button" data-action="close-modals" class="text-sm font-bold text-[#636E72] px-2 py-1">닫기</button>
                </div>
                ${comboImage.url
                  ? `<img id="combo-preview" src="${comboImage.url}" alt="${esc(comboInfo().name)}" class="block mx-auto rounded-2xl border border-[#FF8A80]/20 shadow-sm" style="height:min(48vh,400px);aspect-ratio:9/16" />`
                  : `<div class="mx-auto rounded-2xl bg-[#FFF0EE] animate-pulse" style="height:min(48vh,400px);aspect-ratio:9/16"></div>`}
                ${action}
              </div>
            </div>`;

                      <input id="set-my-name" type="text" value="${esc(state.myName)}" maxlength="12" class="w-full px-3 py-2.5 rounded-xl bg-[#FFF9F5] border border-[#FF8A80]/30 text-sm font-semibold text-[#2D3436] focus:outline-none focus:ring-2 focus:ring-[#FF8A80]/40" />
                    </div>
                    <div class="flex items-center justify-between rounded-xl bg-[#FFF9F5] border border-[#FF8A80]/15 px-3 py-2.5">
                      <span class="font-bold text-[#636E72]">연인</span>
                      <span class="text-sm font-semibold text-[#2D3436]">${state.partnerJoined ? esc(state.partnerName) : '아직 연결 전이에요'}</span>

                    <button type="button" data-action="save-settings" class="w-full py-2.5 rounded-xl bg-[#FF8A80] text-white text-xs font-extrabold">닉네임 저장</button>
                  </div>

                  <div class="rounded-2xl bg-[#FFF9F5] border border-[#FF8A80]/20 p-3.5 space-y-2">
                    <p class="font-bold text-[#2D3436]">우리 초대 코드</p>
                    <p class="text-[11px] text-[#9AA5A9] leading-relaxed">${state.partnerJoined ? '두 분이 연결된 코드예요. 다른 사람은 들어올 수 없어요.' : '연인이 카카오로 로그인한 뒤 이 코드를 입력하면 연결돼요.'}</p>
                    <div class="flex items-center justify-between gap-2 pt-0.5">
                      <span class="font-mono font-extrabold text-base text-[#2D3436] tracking-wider">${esc(state.coupleCode)}</span>
                      <div class="flex gap-1.5 shrink-0">
                        <button type="button" data-action="copy-code" class="px-3 py-1.5 rounded-lg bg-white border border-[#FF8A80]/30 text-[11px] font-bold text-[#E0665B]">복사</button>
                        <button type="button" data-action="share-code" class="px-3 py-1.5 rounded-lg bg-white border border-[#FF8A80]/30 text-[11px] font-bold text-[#E0665B]">공유</button>
                      </div>

                  </div>

                  ${paywallOn() && state.partnerJoined ? `
                  <div class="flex items-center justify-between rounded-xl bg-[#FFF9F5] border border-[#FF8A80]/15 px-3 py-2.5">
                    <span class="font-bold text-[#636E72]">리포트에 비밀방 주제 쓰기 <span class="font-normal text-[#9AA5A9]">· ${state.paywall.report_consent === true ? '켜짐' : '꺼짐'}</span></span>
                    <button type="button" data-action="${state.paywall.report_consent === true ? 'withdraw-secret-report' : 'grant-secret-report'}" class="px-3 py-1.5 rounded-lg bg-white border border-[#FF8A80]/30 text-[11px] font-bold text-[#E0665B]">${state.paywall.report_consent === true ? '끄기' : '켜기'}</button>
                  </div>` : ''}

                  <button type="button" data-action="open-install" class="w-full text-left rounded-2xl bg-white border border-[#2D3436]/8 px-3.5 py-3 flex items-center justify-between">
                    <span>
                      <span class="block font-bold text-[#2D3436]">홈 화면에 추가</span>
                      <span class="block text-[11px] text-[#9AA5A9] mt-0.5">아이폰 · 안드로이드에 앱처럼 설치하기</span>

                  ${state.kakaoName ? `<p class="text-[11px] text-[#9AA5A9] text-center">카카오 계정 <span class="font-bold text-[#636E72]">${esc(state.kakaoName)}</span>(으)로 로그인됨</p>` : ''}

              </div>
            </div>
          `;
        }

        if (capNotice) {
          html += `
            <div class="fixed inset-0 z-[70] bg-[#2D3436]/45 flex items-end sm:items-center justify-center p-4">
              <div class="bg-white rounded-3xl w-full max-w-[400px] p-5 shadow-2xl space-y-3">
                <p class="text-sm font-bold text-[#2D3436] leading-relaxed">오늘은 여기까지 들을게요. 마음이 아직 남았다면 내일 다시 이야기해 주세요.</p>

        if (state.showLogoutConfirm) {

              <div class="bg-white rounded-3xl w-full max-w-[400px] p-5 shadow-2xl space-y-3">
                <h3 class="text-base font-extrabold text-[#2D3436]">로그아웃할까요?</h3>
                <p class="text-xs text-[#636E72] leading-relaxed">카카오 로그인이 해제되고 시작 화면으로 돌아가요. 미션과 온도 기록은 계정에 남아 있어서, 다시 카카오로 로그인하면 그대로 돌아와요. (사이봇 비밀방 대화는 이 기기에서 지워져요.)</p>

                </div>
              </div>

        if (state.showInstallGuide) {
          html += `
            <div class="fixed inset-0 z-50 bg-[#2D3436]/45 flex items-end sm:items-center justify-center p-4">
              <div class="bg-white rounded-3xl w-full max-w-[400px] p-5 space-y-3.5 shadow-2xl">
                <div class="flex items-center justify-between">
                  <h3 class="text-base font-extrabold text-[#2D3436]">📱 핸드폰에 앱으로 설치하기</h3>
                  <button type="button" data-action="close-modals" class="text-sm font-bold text-[#636E72] px-2 py-1">닫기</button>
                </div>
                <div class="space-y-2.5 text-xs text-[#4A5568] leading-relaxed">
                  <div class="p-3 rounded-2xl bg-[#FFF9F5] border border-[#FF8A80]/20">
                    <p class="font-extrabold text-[#2D3436] mb-1">1. 아이폰 (Safari)</p>
                    <p>배포된 주소를 Safari로 열고 하단 <strong>공유 버튼(↑)</strong> → <strong>홈 화면에 추가</strong>를 누르면 앱 아이콘이 생겨요.</p>
                  </div>
                  <div class="p-3 rounded-2xl bg-[#FFF9F5] border border-[#FF8A80]/20">
                    <p class="font-extrabold text-[#2D3436] mb-1">2. 안드로이드 (Chrome)</p>
                    <p>Chrome 우측 상단 <strong>메뉴(⋮)</strong> → <strong>앱 설치</strong> 또는 <strong>홈 화면에 추가</strong>를 누르세요.</p>
                  </div>
                </div>
                <button type="button" data-action="close-modals" class="w-full py-2.5 rounded-xl bg-[#2D3436] text-white text-xs font-extrabold">확인했어요</button>
              </div>
            </div>
          `;
        }
        return html;
      }

      function render() {
        const root = document.getElementById('app');
        if (!root) return;

        if (state.phase !== 'ready') {
          const ae = document.activeElement;
          const keep = ae && ae.id && (ae.id === 'ob-code' || ae.id === 'ob-my-name') ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
          root.innerHTML = renderLanding() + renderModals();
          lastRenderedTab = '';
          if (keep) {
            const el = document.getElementById(keep.id);
            if (el) { try { el.focus({ preventScroll: true }); el.setSelectionRange(keep.s, keep.e); } catch (_e) {} }
          }
          return;
        }

        const gratCaret = gratitudeCaret();
        const otherPending = state.missions.filter((m) => !m.accepted && (m.targetRole === 'BOTH' || m.targetRole === state.role)).length;

        root.innerHTML = `
          <!-- 상단 앱바 -->
          <header class="shrink-0 bg-[#FFF9F5] border-b border-[#FF8A80]/15 px-4 pb-3 safe-top flex items-center justify-between z-20">
            <div class="flex items-center gap-2.5 min-w-0">
              <img src="${AVATAR_SRC}" alt="우리사이" class="w-9 h-9 rounded-2xl object-cover border border-[#FF8A80]/30 shrink-0" />
              <div class="min-w-0">
                <span class="text-base font-extrabold text-[#2D3436]">우리사이</span>
                <p class="text-[11px] text-[#636E72] truncate">${esc(state.myName)} ♥ ${esc(state.partnerName)} · ${dispTemp(shownTemp())}°C</p>
              </div>
            </div>
            <button type="button" data-action="open-settings" class="w-8 h-8 rounded-xl bg-white border border-[#2D3436]/10 flex items-center justify-center text-sm shrink-0" aria-label="설정">
              ⚙
            </button>
          </header>

          <!-- 메인 탭 뷰 -->
          <main class="flex-1 flex flex-col min-h-0">
            ${state.activeTab === 'missions' ? renderMissionsTab() : state.activeTab === 'saibot' ? renderSaibotTab() : renderWarmthTab()}
          </main>

          <!-- 하단 모바일 네비게이션 바 -->
          <nav class="shrink-0 bg-white border-t border-[#FF8A80]/15 px-3 pt-2 safe-bottom grid grid-cols-3 gap-1 z-20">
            <button type="button" data-action="switch-tab" data-tab="missions" class="relative py-2 rounded-2xl flex flex-col items-center gap-0.5 transition-colors ${state.activeTab === 'missions' ? 'bg-[#FFF0EE] text-[#E0665B]' : 'text-[#636E72]'}">
              <span class="text-base leading-none">💌</span>
              <span class="text-[11px] font-bold">오늘의 미션</span>
              ${otherPending > 0 ? `<span class="absolute top-1.5 right-6 w-4 h-4 rounded-full bg-[#FF8A80] text-white text-[9px] font-extrabold flex items-center justify-center">${otherPending}</span>` : ''}
            </button>
            <button type="button" data-action="switch-tab" data-tab="saibot" class="py-2 rounded-2xl flex flex-col items-center gap-0.5 transition-colors ${state.activeTab === 'saibot' ? 'bg-[#FFF0EE] text-[#E0665B]' : 'text-[#636E72]'}">
              <span class="text-base leading-none">👼</span>
              <span class="text-[11px] font-bold">사이봇 비밀방</span>
            </button>
            <button type="button" data-action="switch-tab" data-tab="warmth" class="py-2 rounded-2xl flex flex-col items-center gap-0.5 transition-colors ${state.activeTab === 'warmth' ? 'bg-[#FFF0EE] text-[#E0665B]' : 'text-[#636E72]'}">
              <span class="text-base leading-none">🌡️</span>
              <span class="text-[11px] font-bold">사랑의 온도계</span>
            </button>
          </nav>
          ${renderModals()}
        `;

        const sc = document.getElementById('chat-scroll');
        if (sc) sc.scrollTop = sc.scrollHeight;
        if (gratCaret != null) restoreGratitudeCaret(gratCaret);

        if (state.activeTab === 'warmth' && lastRenderedTab !== 'warmth') startWarmthMotion();
        lastRenderedTab = state.activeTab;
      }

      // 이벤트 위임
      function joinErrorMessage(err) {
        const m = String((err && err.message) || '');
        if (m.indexOf('couple_full') >= 0) return '이미 두 분이 연결된 코드예요. 연인에게 코드를 다시 확인해 주세요.';
        if (m.indexOf('code_not_found') >= 0) return '그런 초대 코드가 없어요. 코드를 다시 확인해 주세요.';
        if (m.indexOf('already_in_couple') >= 0) return '이미 다른 연인과 연결된 계정이에요.';
        if (err && err.status === 401) return '로그인이 풀렸어요. 카카오로 다시 시작해 주세요.';
        return '연결에 실패했어요, 다시 시도해 주세요';
      }

      async function enterCouple(c, toastMsg) {
        paywallCheckedAt = 0;
        applyCouple(c);
        loadLocalForUser();
        if (state.role === 'B' && !localStorage.getItem(localKey())) state.activeTab = 'missions';
        saveState();
        render();
        await syncFromSupabase();
        startSyncLoop();
        if (toastMsg) showToast(toastMsg);
      }

      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        let action = btn.getAttribute('data-action');
        // 메시지형 미션의 [카톡으로 보내기]: 보내거나(복사) 끝나면 [했어요]와 똑같이 완료
        if (action === 'mission-kakao') {
          const m = (state.missions || []).concat(state.selfMissions || []).find((x) => x.id === btn.getAttribute('data-id'));
          const q = missionQuote(m);
          if (!q || m.accepted || m.accepting) return;
          const r = await shareOrCopy({ text: q }, q);
          if (r !== 'shared' && r !== 'copied') return;
          action = 'accept-mission';
        }

        if (action === 'kakao-login') {
          if (!sb) { showToast('잠시 후 다시 시도해 주세요'); return; }
          copyInviteQuiet(pendingInvite());
          state.busy = true;
          render();
          const { error } = await sb.auth.signInWithOAuth({
            provider: 'kakao',
            options: { redirectTo: location.origin + location.pathname, scopes: 'profile_nickname profile_image' }
          });
          if (error) {
            state.busy = false;
            render();
            showToast('카카오 로그인을 열지 못했어요, 다시 시도해 주세요');
          }
        } else if (action === 'join-mode' || action === 'join-back') {
          const myEl = document.getElementById('ob-my-name');
          if (myEl && myEl.value.trim()) state.myName = myEl.value.trim().slice(0, 12);
          state.joinMode = action === 'join-mode';
          if (action === 'join-back') clearInvite();
          render();
          if (state.joinMode) { const cd = document.getElementById('ob-code'); if (cd) { try { cd.focus(); } catch (_e) {} } }
        } else if (action === 'ob-next' || action === 'ob-skip') {
          const last = SAIBOT_LINES.onboarding.length - 1;
          if (action === 'ob-next' && (state.obStep || 0) < last) { state.obStep = (state.obStep || 0) + 1; render(); return; }
          try { localStorage.setItem('urisai_onboard_v116', '1'); } catch (_e) {}
          render();
        } else if (action === 'create-couple' || action === 'join-couple') {
          if (state.busy) return;
          const myEl = document.getElementById('ob-my-name');
          const nick = ((myEl && myEl.value) || state.myName || state.kakaoName || '').trim().slice(0, 12);
          if (!nick) { showToast('닉네임을 입력해 주세요'); return; }
          state.myName = nick;
          let code = '';
          if (action === 'join-couple') {
            const cdEl = document.getElementById('ob-code');
            const rest = joinRestFrom((cdEl && cdEl.value) || state.joinRest || '');
            state.joinRest = rest;
            if (!rest) { showToast('초대 코드를 입력해 주세요'); return; }
            if (rest.length !== 6) { showToast('초대 코드 6자리를 확인해 주세요'); return; }
            code = 'S2-' + rest;
          }
          state.busy = true;
          render();
          try {
            const c = action === 'create-couple'
              ? await rpc('create_couple', { nickname: nick })
              : await rpc('join_couple', { p_code: code, nickname: nick });
            state.busy = false;
            if (!c || !c.code) throw new Error('empty');
            clearInvite();
            await enterCouple(c, action === 'create-couple' ? '초대코드를 만들었어요! 연인에게 공유해 주세요 💌' : '연인과 연결됐어요! 💛');
          } catch (err) {
            state.busy = false;
            render();
            showToast(joinErrorMessage(err));
          }
        } else if (action === 'switch-tab') {
          state.activeTab = btn.getAttribute('data-tab') || 'saibot';
          saveState();
          render();
          if (state.activeTab === 'warmth' && paywallOn() && await refreshPaywall(true)) render();
          if (state.activeTab === 'warmth' && await refreshTemp(true)) render();
        } else if (action === 'quick-tag') {
          state.draftInput = btn.getAttribute('data-sample') || '';
          render();
        } else if (action === 'send-emotion') {
          const inputEl = document.getElementById('emotion-input');
          const text = ((inputEl && inputEl.value) || state.draftInput || '').trim();
          if (!text || sendingEmotion) return;
          sendingEmotion = true;
          state.draftInput = '';
          const role = state.role;
          state.chats[role] = state.chats[role] || [];
          state.chats[role].push({ id: 'u-' + Date.now(), sender: 'user', text: text, time: nowStr() });
          saveState();
          render();
          try {
            state.botTyping = true;
            render();
            let res;
            try {
              res = await askSaibot(text, role);
            } catch (_e) {
              res = localFallback(text, role);
            }
            state.botTyping = false;
            if (res && res.capped) {
              capNotice = true;
              render();
              return;
            }
            state.chats[role].push({
              id: 'b-' + Date.now(),
              sender: 'bot',
              type: 'draft',
              empathy: res.empathy,
              drafts: withBookDraft(res.drafts || [], text),
              draftIdx: 0,
              fallback: Boolean(res.fallback),
              sent: false,
              time: nowStr()
            });
            saveState();
            render();
          } finally {
            state.botTyping = false;
            sendingEmotion = false;
          }
        } else if (action === 'shuffle-draft') {
          const id = btn.getAttribute('data-id');
          const list = state.chats[state.role] || [];
          const msg = list.find((m) => m.id === id);
          if (msg && !msg.sent) {
            msg.draftIdx = ((msg.draftIdx || 0) + 1) % msg.drafts.length;
            saveState();
            render();
          }
        } else if (action === 'send-nudge') {
          const id = btn.getAttribute('data-id');
          const list = state.chats[state.role] || [];
          const msg = list.find((m) => m.id === id);
          if (!msg || msg.sent || msg.sending) return;
          const pick = Number(btn.getAttribute('data-idx'));
          if (Number.isInteger(pick) && pick >= 0 && pick < msg.drafts.length) msg.draftIdx = pick;
          const draft = msg.drafts[msg.draftIdx || 0];
          if (!draft) return;
          const targetRole = state.role === 'A' ? 'B' : 'A';
          const missionId = 'm-' + Date.now();
          msg.sending = true;
          const newMission = {
            id: missionId,
            targetRole: targetRole,
            title: draft.title,
            badge: draft.badge,
            message: draft.message,
            time: '방금 도착',
            accepted: false
          };
          try {
            // v11.3: 서버가 비밀방 출처를 기록하는 RPC. 실패하면 예전처럼 직접 넣는다
            let viaRpc = false;
            if (tempOn()) {
              try {
                await rpc('send_secret_mission', { p_id: missionId, p_title: draft.title, p_badge: draft.badge || '', p_message: draft.message });
                viaRpc = true;
              } catch (_e) {
                // 함수가 없거나 서버가 거절하면(no_saibot_use 등) 미션은 예전처럼 보낸다 (셀프 미션만 안 생김)
              }
            }
            if (!viaRpc) await sbFetch('daily_missions', {
              method: 'POST',
              body: JSON.stringify({
                id: missionId,
                couple_code: state.coupleCode,
                target_role: targetRole,
                title: draft.title,
                badge: draft.badge,
                message: draft.message,
                accepted: false
              })
            });
          } catch (_e) {
            msg.sending = false;
            showToast('미션을 보내지 못했어요, 다시 시도해 주세요');
            return;
          }
          msg.sending = false;
          msg.sent = true;
          state.missions.unshift(newMission);
          saveState();
          render();
          showToast('상대방 피드에 자연스러운 데일리 미션이 도착했어요 ✨');
          addSelfMission();
        } else if (action === 'accept-mission') {
          const id = btn.getAttribute('data-id');
          const selfM = (state.selfMissions || []).find((m) => m.id === id);
          if (selfM) {
            if (selfM.accepted || selfM.accepting) return;
            selfM.accepting = true; selfM.accepted = true; render();
            try {
              const r = await rpc('accept_self_mission', { p_id: id });
              selfM.accepted = Boolean(r && r.accepted);
              selfM.accepting = false;
              render();
              showToast('미션 완료! 다음에 잴 때 온도에 담겨요 💛');
            } catch (_e) {
              selfM.accepting = false; selfM.accepted = false; render();
              showToast('잠시 후 다시 시도해 주세요');
            }
            return;
          }
          const mission = state.missions.find((m) => m.id === id);
          if (!mission || mission.accepted || mission.accepting) return;
          mission.accepting = true;
          const prevTemp = state.warmthTemp;
          const prevCount = state.completedCount;
          mission.accepted = true;
          if (!tempOn()) state.warmthTemp = Math.min(45.0, Number((state.warmthTemp + 1.2).toFixed(1)));
          state.completedCount += 1;
          render();
          try {
            let c = null;
            try {
              c = await rpc('accept_mission', { p_id: id });
            } catch (err) {
              // v9.1 SQL not applied yet: fall back to the old direct writes
              if (err && err.status === 404) {
                await sbFetch('daily_missions?id=eq.' + encodeURIComponent(id), {
                  method: 'PATCH',
                  body: JSON.stringify({ accepted: true, accepted_at: new Date().toISOString() })
                });
                await sbFetch('couples?code=eq.' + encodeURIComponent(state.coupleCode), {
                  method: 'PATCH',
                  body: JSON.stringify({ warmth_temp: state.warmthTemp, completed_count: state.completedCount })
                });
              } else {
                throw err;
              }
            }
            if (c && c.code) {
              const t = Number(c.warmth_temp);
              const n = Number(c.completed_count);
              if (!Number.isNaN(t)) state.warmthTemp = t;
              if (!Number.isNaN(n)) state.completedCount = n;
            }
            mission.accepting = false;
            saveState();
            render();
            showToast('미션 완료! 다음에 잴 때 온도에 담겨요 💛');
          } catch (_e) {
            mission.accepting = false;
            mission.accepted = false;
            state.warmthTemp = prevTemp;
            state.completedCount = prevCount;
            saveState();
            render();
            showToast('저장에 실패했어요, 다시 시도해 주세요');
          }
        } else if (action === 'open-settings') {
          hideToast();
          state.showSettings = true;
          render();
        } else if (action === 'open-install') {
          hideToast();
          state.showInstallGuide = true;
          render();
        } else if (action === 'close-modals') {
          state.showSettings = false;
          state.showInstallGuide = false;
          state.showLogoutConfirm = false;
          state.showCombo = false;
          state.showReport = false;
          render();
        } else if (action === 'save-settings') {
          const myEl = document.getElementById('set-my-name');
          if (myEl && myEl.value.trim()) state.myName = myEl.value.trim().slice(0, 12);
          try {
            await saveNamesToServer();
            state.showSettings = false;
            saveState();
            render();
            showToast('닉네임을 저장했어요.');
          } catch (_e) {
            showToast('저장에 실패했어요, 다시 시도해 주세요');
          }
        } else if (action === 'share-code') {
          const text = '우리사이 초대 코드: ' + state.coupleCode + '\n링크를 누르면 코드가 바로 들어가요 💛\n' + inviteUrl(state.coupleCode);
          try {
            if (navigator.share) {
              await navigator.share({ title: '우리사이', text: text });
            } else {
              throw new Error('share-unavailable');
            }
          } catch (err) {
            if (err && err.name === 'AbortError') return;
            const btn = document.querySelector('[data-action="copy-code"]');
            if (btn) btn.click();
            else showToast('코드: ' + state.coupleCode);
          }
        } else if (action === 'logout-ask') {
          hideToast();
          state.showLogoutConfirm = true;
          render();
        } else if (action === 'cap-ok') {
          capNotice = false;
          render();
        } else if (action === 'logout-cancel') {
          state.showLogoutConfirm = false;
          render();
        } else if (action === 'logout-confirm') {
          if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
          sendingEmotion = false;
          const key = localKey();
          try { if (key) localStorage.removeItem(key); } catch (_e) {}
          try { if (sb) await sb.auth.signOut(); } catch (_e) {}
          state = defaultState();
          state.phase = 'signedOut';
          render();
          showToast('로그아웃했어요. 카카오로 다시 시작하면 기록이 돌아와요.');
        } else if (action === 'open-combo') {
          hideToast();
          state.showCombo = true;
          render();
          ensureComboImage();
          logEvent('combo_view');
        } else if (action === 'open-temp') {
          const f = state.temp;
          if (!f) return;
          hideToast();
          if (f.status === 'done') { if (!tempLast()) return; state.tempView = 'result'; }
          else if (f.status === 'waiting') state.tempView = 'wait';
          else { state.tempView = 'question'; state.tempIdx = 0; state.tempAnswers = []; }
          render();
          if (state.tempView !== 'question' && await refreshTemp(true)) render();
          if (state.tempView === 'result' && paywallOn() && await refreshPaywall(true)) render();
        } else if (action === 'close-temp') {
          state.tempView = null;
          render();
        } else if (action === 'temp-answer') {
          if (state.tempView !== 'question' || state.busy) return;
          const i = state.tempIdx || 0;
          state.tempAnswers[i] = Number(btn.getAttribute('data-i')) || 0;
          if (i < TEMP_QS.length - 1) { state.tempIdx = i + 1; render(); return; }
          state.busy = true;
          try {
            const f = await rpc('submit_temp', { p_answers: state.tempAnswers.slice(0, TEMP_QS.length) });
            if (f && typeof f.status === 'string') state.temp = f;
            state.tempView = state.temp && state.temp.status === 'done' && tempLast() ? 'result' : 'wait';
          } catch (_e) {
            // too_soon 등: 서버 상태로 다시 맞춘다
            await refreshTemp(true);
            state.tempView = state.temp && state.temp.status === 'done' && tempLast() ? 'result' : null;
            if (!state.tempView) showToast('잠시 후 다시 시도해 주세요');
          }
          state.busy = false;
          render();
          if (state.tempView === 'result' && paywallOn() && await refreshPaywall(true)) render();
        } else if (action === 'send-heart') {
          const n = (state.heartNotices || []).find((x) => x.id === btn.getAttribute('data-id'));
          if (!n || n.hearted || n.sending) return;
          n.sending = true;
          try {
            const rows = await rpc('send_heart', { p_id: n.id });
            n.hearted = true;
            if (Array.isArray(rows)) state.heartNotices = rows.slice(0, 20).map((r) => ({ id: String(r.id || ''), name: String(r.name || ''), doneOn: String(r.done_on || ''), hearted: Boolean(r.hearted) }));
            render();
            showToast('하트를 보냈어요 💛');
          } catch (_e) {
            n.sending = false;
            showToast('잠시 후 다시 시도해 주세요');
          }
        } else if (action === 'temp-send') {
          const text = '우리사이 온도, 나는 다 풀었어. 너도 풀면 같이 볼 수 있어.';
          const url = tempAppUrl();
          shareOrCopy({ title: '우리사이', text: text, url: url }, text + '\n' + url);
        } else if (action === 'temp-share') {
          const l = tempLast();
          if (!l) return;
          const text = '우리사이 온도 재 봤어. 🌡️ ' + dispTemp(l.total) + '°C\n너희 커플은 몇 도야? 둘이 따로 재면 나와.';
          const url = tempAppUrl();
          shareOrCopy({ title: '우리사이', text: text, url: url }, text + '\n' + url);
        } else if (action === 'open-quiz') {
          location.href = './quiz.html';
        } else if (action === 'request-share') {
          if (btn.disabled) return;
          btn.disabled = true;
          try {
            const c = await rpc('request_share_consent', { p_card_type: 'combo' });
            applyShareConsent(c && c.id ? c : null);
            logEvent('combo_share_request');
            render();
            showToast('연인에게 물어봤어요 💌');
          } catch (_e) {
            btn.disabled = false;
            showToast('잠시 후 다시 시도해 주세요');
          }
        } else if (action === 'respond-share') {
          const id = btn.getAttribute('data-id');
          const accept = btn.getAttribute('data-accept') === '1';
          try {
            const c = await rpc('respond_share_consent', { p_id: id, p_accept: accept });
            state.shareConsent = c && c.id ? c : null;
            render();
            showToast(accept ? '둘 다 좋대요! 이제 올릴 수 있어요 ✨' : '이번 건 둘만 보기로 했어요. 카드는 사랑의 온도계 탭에 그대로 있어요.');
          } catch (_e) {
            showToast('잠시 후 다시 시도해 주세요');
          }
        } else if (action === 'share-combo-story') {
          if (!state.shareConsent || state.shareConsent.status !== 'accepted') return;
          const info = comboInfo();
          const url = location.origin + location.pathname;
          const text = comboShareText(info);
          const key = [info.name, info.temp, info.count].join('|');
          const file = comboImage.key === key && comboImage.blob ? new File([comboImage.blob], 'urisai-combo.png', { type: 'image/png' }) : null;
          if (!file) ensureComboImage();
          const data = file && navigator.canShare && navigator.canShare({ files: [file] })
            ? { files: [file], title: '우리사이' }
            : { title: '우리사이', text: text, url: url };
          shareOrCopy(data, text + '\n' + url).then((r) => { if (r === 'shared' || r === 'copied') logEvent('combo_shared'); });
        } else if (action === 'share-combo-kakao') {
          if (!state.shareConsent || state.shareConsent.status !== 'accepted') return;
          const info = comboInfo();
          const url = location.origin + location.pathname;
          const text = comboShareText(info);
          shareOrCopy({ title: '우리사이', text: text, url: url }, text + '\n' + url).then((r) => { if (r === 'shared' || r === 'copied') logEvent('combo_shared'); });
        } else if (action === 'open-report') {
          if (!reportVisible()) return;
          hideToast();
          logEvent('report_teaser_click');
          state.showReport = true;
          render();
          if (await refreshPaywall(true)) render();
          if (reportVisible()) logEvent(state.report.paid ? 'report_view' : 'paywall_view');
        } else if (action === 'pay-open') {
          if (state.report && state.report.posts_ready !== true) return;
          if (!reportVisible() || state.report.paid) return;
          if (!state.report.pay_code) {
            if (state.busy) return;
            state.busy = true;
            logEvent('paywall_click');
            try {
              const c = await rpc('request_pay_code', {});
              if (c && c.pay_code) state.report = Object.assign({}, state.report, { pay_code: c.pay_code, paid: Boolean(c.paid) });
            } catch (_e) {
              showToast('잠시 후 다시 시도해 주세요');
            }
            state.busy = false;
            render();
            return;
          }
          logEvent('paywall_checkout_open');
          try { localStorage.setItem(checkoutKey(), '1'); } catch (_e) {}
          window.open(state.paywall.checkout_url, '_blank', 'noopener');
          render();
        } else if (action === 'copy-pay-code') {
          const code = state.report && state.report.pay_code;
          if (!code) return;
          logEvent('pay_code_copy');
          try {
            await navigator.clipboard.writeText(code);
            showToast('복사 완료!');
          } catch (_e) {
            showToast(code);
          }
        } else if (action === 'grant-secret-report') {
          // 설정의 [켜기]: 비밀방 안내 카드의 [확인했어요]와 같은 동의를 다시 기록한다
          if (!paywallOn()) return;
          const r = await sbFetchQuiet('rpc/consent_secret_report', { method: 'POST', body: '{}' });
          if (!r || r.consented !== true) { showToast('잠시 후 다시 시도해 주세요'); return; }
          if (state.paywall) state.paywall.report_consent = true;
          secretInfoAcked = true;
          try { localStorage.setItem(secretInfoKey(), '1'); } catch (_e) {}
          render();
        } else if (action === 'withdraw-secret-report') {
          // [확인했어요] 끄기: 서버에서 동의·주제 키를 지우면 비밀방 안내 카드가 다시 뜬다
          const r = await sbFetchQuiet('rpc/withdraw_secret_report', { method: 'POST', body: '{}' });
          if (!r || r.consented !== false) { showToast('잠시 후 다시 시도해 주세요'); return; }
          if (state.paywall) state.paywall.report_consent = false;
          secretInfoAcked = false;
          try { localStorage.removeItem(secretInfoKey()); } catch (_e) {}
          render();
        } else if (action === 'gratitude-example') {
          const i = Number(btn.getAttribute('data-idx'));
          if (i !== -1 && !GRATITUDE_EXAMPLES[i]) return;
          state.gratitudeIdx = i;
          state.gratitudeParts = gratitudePartsFor(i);
          render();
          focusGratitudeFill();
        } else if (action === 'send-gratitude') {
          if (gratitudeSentToday() || sendingGratitude) return;
          const sentence = currentGratitudeSentence();
          if (!sentence) return;
          const url = location.origin + location.pathname;
          const msg = sentence + '\n' + url;
          // 공유창은 탭 직후 바로 (앞에 await 없음)
          sendingGratitude = true;
          shareOrCopy({ text: msg }, msg).then((r) => {
            if (r !== 'shared' && r !== 'copied') { sendingGratitude = false; return; }
            return recordGratitude().finally(() => { sendingGratitude = false; });
          });
        } else if (action === 'copy-code') {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(state.coupleCode);
            } else {
              const ta = document.createElement('textarea');
              ta.value = state.coupleCode;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
            }
            showToast('커플 코드 ' + state.coupleCode + ' 복사 완료!');
          } catch (_e) {
            showToast('코드: ' + state.coupleCode);
          }
        }
      });

      // 초대 코드 칸: 'S2-'는 고정, 뒤 6자리만. 붙여넣은 전체 코드/링크도 받는다. 값은 state에 있어서 다시 그려도 안 지워진다.
      function joinRestFrom(v) {
        const raw = String(v || '');
        const m = /invite=([^&#\s]+)/i.exec(raw);
        const full = normInvite(m ? decodeURIComponent(m[1]) : raw);
        if (full) return full.slice(3);
        return raw.toUpperCase().replace(/^\s*S2-?/, '').replace(/[^A-Z0-9]/g, '').slice(0, 6);
      }
      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'ob-code') {
          const rest = joinRestFrom(e.target.value);
          state.joinRest = rest;
          if (e.target.value !== rest) { e.target.value = rest; try { e.target.setSelectionRange(rest.length, rest.length); } catch (_e) {} }
        }
        if (e.target && e.target.id === 'ob-my-name') state.obName = e.target.value.slice(0, 12);
        if (e.target && e.target.id === 'emotion-input') {
          state.draftInput = e.target.value;
        }
        if (e.target && e.target.id === 'gratitude-text') {
          // 칸이 비면 회색 '___'가 다시 보이도록 남은 <br> 정리
          const span = e.target.querySelector('[data-gratitude-fill]');
          if (span && !span.textContent && span.childNodes.length) span.textContent = '';
          if (!e.target.textContent && e.target.childNodes.length && !span) e.target.textContent = '';
          state.gratitudeParts = readGratitudeEditor();
          const ok = !!gratitudeSentence(state.gratitudeIdx, state.gratitudeParts);
          const sb = document.querySelector('[data-action="send-gratitude"]');
          if (sb) { sb.disabled = !ok; sb.classList.toggle('opacity-60', !ok); }
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.target && e.target.id === 'gratitude-text' && e.key === 'Enter') e.preventDefault();
      });
      // 붙여넣기는 한 줄 글자로만
      document.addEventListener('paste', (e) => {
        if (!(e.target && e.target.closest && e.target.closest('#gratitude-text'))) return;
        const t = ((e.clipboardData && e.clipboardData.getData('text/plain')) || '').replace(/[\r\n]+/g, ' ');
        e.preventDefault();
        try { document.execCommand('insertText', false, t); } catch (_e) {}
      });

      let sendingGratitude = false;
      // 예시를 누르면 칠한 칸이 선택된 채로 (빈칸이면 그 안에 커서), 직접 쓰기면 끝에 커서
      function focusGratitudeFill() {
        const el = document.getElementById('gratitude-text');
        if (!el) return;
        try {
          el.focus({ preventScroll: true });
          const span = el.querySelector('[data-gratitude-fill]');
          const r = document.createRange();
          r.selectNodeContents(span || el);
          if (!span) r.collapse(false);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        } catch (_e) {}
      }
      // 다시 그리기 전후로 커서 위치(글자 수) 유지. 편집기에 포커스가 없으면 null.
      function gratitudeCaret() {
        const el = document.getElementById('gratitude-text');
        if (!el || document.activeElement !== el) return null;
        try {
          const s = window.getSelection();
          if (!s.rangeCount || !el.contains(s.getRangeAt(0).endContainer)) return -1;
          const span = el.querySelector('[data-gratitude-fill]');
          if (span && span.contains(s.getRangeAt(0).endContainer) && !span.textContent) return 'fill';
          const r = document.createRange();
          r.selectNodeContents(el);
          r.setEnd(s.getRangeAt(0).endContainer, s.getRangeAt(0).endOffset);
          return r.toString().length;
        } catch (_e) { return -1; }
      }
      function restoreGratitudeCaret(off) {
        const el = document.getElementById('gratitude-text');
        if (!el) return;
        try {
          el.focus({ preventScroll: true });
          const r = document.createRange();
          const span = el.querySelector('[data-gratitude-fill]');
          if (off === 'fill' && span) { r.selectNodeContents(span); }
          else {
            r.selectNodeContents(el); r.collapse(false);
            if (typeof off === 'number' && off >= 0) {
              const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
              let n, left = off;
              while ((n = w.nextNode())) {
                if (left <= n.data.length) { r.setStart(n, left); r.collapse(true); break; }
                left -= n.data.length;
              }
            }
          }
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        } catch (_e) {}
      }

      // 보낸 날만 기록 (문장은 서버로 보내지 않음). 서버가 온도를 올려 주면 같은 1.2초 모션.
      async function recordGratitude() {
        const prev = state.warmthTemp;
        let bump = 0, streak = 0;
        try {
          const r = await rpc('send_gratitude', {});
          const k = Number(r && r.streak);
          if (Number.isFinite(k) && k > 0) streak = Math.min(9999, Math.floor(k));
          const t = Number(r && r.warmth_temp);
          if (!Number.isNaN(t)) state.warmthTemp = t;
          const n = Number(r && r.completed_count);
          if (!Number.isNaN(n)) state.completedCount = n;
          const b = Number(r && r.bump);
          bump = Math.max(0, Number((Number.isNaN(b) ? state.warmthTemp - prev : b).toFixed(1)));
        } catch (_e) {
          // 마이그레이션 전이거나 네트워크 오류: 메시지는 이미 나갔으니 보냄 표시만 하고 온도는 그대로
        }
        try { localStorage.setItem(gratitudeKey(), JSON.stringify({ day: kstDay(), bump: bump, streak: streak })); } catch (_e) {}
        state.gratitudeIdx = 0;
        state.gratitudeParts = gratitudePartsFor(0);
        render();
        if (bump > 0) startWarmthBump(prev);
      }

      if (window.visualViewport) {
        const fitViewport = () => {
          const app = document.getElementById('app');
          if (app) app.style.height = window.visualViewport.height + 'px';
        };
        window.visualViewport.addEventListener('resize', fitViewport);
        window.visualViewport.addEventListener('scroll', fitViewport);
        fitViewport();
      }

      function kakaoNickname(user) {
        const m = (user && user.user_metadata) || {};
        return String(m.nickname || m.name || m.full_name || m.preferred_username || m.user_name || '').trim().slice(0, 12);
      }

      let bootedUserId = null;
      async function onSignedIn(session) {
        const user = session && session.user;
        if (!user) return;
        if (bootedUserId === user.id) return;
        bootedUserId = user.id;
        state.userId = user.id;
        state.kakaoName = kakaoNickname(user);
        if (!state.myName) state.myName = state.kakaoName;
        try {
          const c = await rpc('my_couple', {});
          if (c && c.code) {
            clearInvite();
            await enterCouple(c);
          } else {
            const inv = pendingInvite();
            if (inv) { state.joinMode = true; state.joinRest = inv.slice(3); copyInviteQuiet(inv); }
            state.phase = 'needCouple';
            render();
          }
        } catch (_e) {
          state.phase = 'needCouple';
          render();
          showToast('연결 정보를 불러오지 못했어요. 새로고침해 주세요');
        }
      }

      function cleanAuthUrl() {
        if (/[?&](code|error)=/.test(location.search) || /access_token|error_description/.test(location.hash)) {
          const params = new URLSearchParams(location.search);
          const err = params.get('error_description') || params.get('error');
          history.replaceState(null, '', location.pathname);
          if (err) showToast('카카오 로그인이 취소됐거나 실패했어요. 다시 시도해 주세요');
        }
      }

      async function boot() {
        render();
        if (!sb) {
          state.phase = 'signedOut';
          render();
          showToast('네트워크를 확인하고 새로고침해 주세요');
          return;
        }
        sb.auth.onAuthStateChange(function (event, session) {
          if (event === 'SIGNED_OUT') {
            if (state.phase !== 'signedOut') {
              if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
              bootedUserId = null;
              state = defaultState();
              state.phase = 'signedOut';
              render();
            }
          } else if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
            setTimeout(function () { onSignedIn(session); }, 0);
          }
        });
        let session = null;
        try {
          const r = await sb.auth.getSession();
          session = r && r.data && r.data.session;
        } catch (_e) {}
        cleanAuthUrl();
        if (session) {
          await onSignedIn(session);
        } else {
          state.phase = 'signedOut';
          render();
        }
      }

      boot();
    })();

  </script>
</body>
</html>
